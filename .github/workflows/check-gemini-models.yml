name: Check Gemini summary preview
on:
  push:
    branches: [codex/check-gemini-models]
    paths: [.github/workflows/check-gemini-models.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7fd954db0515f327582584e1826910c1c63c643
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test digest quality gates
        run: python3 -m unittest discover -s scripts -p 'test*dev_digest.py' -v
      - name: Preview Korean summaries and source verification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
        run: |
          python3 scripts/generate_dev_digest.py --ai --check-links --dry-run --force --max-items 2 | tee "$RUNNER_TEMP/gemini-preview.log"
          grep -F '[dry-run] Post preview' "$RUNNER_TEMP/gemini-preview.log"
          git diff --exit-code
