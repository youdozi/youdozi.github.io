name: Scheduled SEO and AEO Technical Checks

on:
  schedule:
    # 07:17 Asia/Seoul. Private API performance reports run on the owner's Mac.
    - cron: '17 22 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/search-monitor.yml'
      - 'scripts/search_monitor.py'
      - 'scripts/test_search_monitor.py'
      - 'scripts/install_search_monitor.py'
      - 'scripts/run_search_monitor.sh'

permissions:
  contents: read

concurrency:
  group: search-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify selection, failure handling, date windows and scheduler contracts
        run: python3 -B -m unittest discover -s scripts -p test_search_monitor.py -v

  daily:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install -r scripts/requirements-search-console.txt
      - name: Check public sitemap pages, metadata, language links and images without Analytics events
        run: python3 -B scripts/search_monitor.py daily --live --output-dir "$RUNNER_TEMP/search-monitor"
      - name: Retain public technical observations, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-seo-aeo-technical-${{ github.run_id }}
          path: ${{ runner.temp }}/search-monitor/daily-*.json
          retention-days: 30
          if-no-files-found: warn
