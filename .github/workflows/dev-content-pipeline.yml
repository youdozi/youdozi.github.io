name: Dev Content Pipeline

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "AI 연동 확인용: 게시 없이 새 후보 최대 2개만 검사"
        type: boolean
        default: true
  pull_request:
    paths:
      - "scripts/*dev_digest*.py"
      - "scripts/fixtures/**"
      - ".github/workflows/dev-content-pipeline.yml"

permissions:
  contents: read

concurrency:
  group: dev-content-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test digest quality gates
        run: python3 -m unittest discover -s scripts -p 'test*dev_digest.py' -v

  generate-digest:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate and validate today's digest
        id: digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
        run: |
          args=(--ai --check-links --github-output "$GITHUB_OUTPUT")
          if [ "$PREVIEW" = "true" ]; then
            args+=(--dry-run --force --max-items 2)
          else
            args+=(--max-items 6)
          fi
          python3 scripts/generate_dev_digest.py "${args[@]}"
      - name: Validate the generated file
        if: steps.digest.outputs.generated == 'true'
        env:
          POST_PATH: ${{ steps.digest.outputs.post_path }}
        run: python3 scripts/validate_dev_digest.py "$POST_PATH" --min-items 1
      - name: Setup Ruby
        if: steps.digest.outputs.generated == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build site
        if: steps.digest.outputs.generated == 'true'
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Commit and push changes
        if: steps.digest.outputs.generated == 'true'
        env:
          POST_PATH: ${{ steps.digest.outputs.post_path }}
        run: |
          git add -- "$POST_PATH" .pipeline/content_state.json
          audit_path=".pipeline/$(basename "$POST_PATH" -dev-digest.markdown)-ai-audit.json"
          git add -- "$audit_path"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: add automated dev digest"
          git push
