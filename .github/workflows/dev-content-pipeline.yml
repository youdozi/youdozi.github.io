name: Dev Content Pipeline

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: '게시 없이 새 후보 최대 2개로 영문·한국어 생성과 검증 확인'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dev-content-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      generated: ${{ steps.digest.outputs.generated }}
      commit_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test publication gates
        run: npm run test:python
      - name: Generate verified bilingual JSON
        id: digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
        run: |
          args=(--check-links --github-output "$GITHUB_OUTPUT")
          if [ "$PREVIEW" = 'true' ]; then
            args+=(--dry-run --force --max-items 2)
          fi
          python3 scripts/generate_digest.py "${args[@]}"
      - name: Validate and build before committing content
        if: steps.digest.outputs.generated == 'true'
        run: |
          npm run check
          npm run build
      - name: Commit verified content
        id: commit
        if: steps.digest.outputs.generated == 'true'
        env:
          DIGEST_PATH: ${{ steps.digest.outputs.digest_path }}
        run: |
          git add -- "$DIGEST_PATH" .pipeline/content_state.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: add bilingual dev digest'
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: generate
    if: needs.generate.outputs.generated == 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site-quality-gates.yml
    with:
      ref: ${{ needs.generate.outputs.commit_sha }}
      publish: true
