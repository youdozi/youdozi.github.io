<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 987" width="420" height="987" role="img" aria-labelledby="title description" xml:lang="en"><title id="title">Migration path from WebFlux to MVC and virtual threads</title><desc id="description">Identify reactive-only paths, migrate ordinary request paths incrementally, then expand or roll back based on observations</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Migration path from WebFlux to MVC and virtual threads</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">Identify streaming and</text><text x="180" y="137" text-anchor="middle" font-size="16">backpressure paths</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">Select one finite API</text><text x="180" y="263" text-anchor="middle" font-size="16">record contract and baseline</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">Change MVC and storage</text><text x="180" y="389" text-anchor="middle" font-size="16">test each contract</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">Verify virtual threads</text><text x="180" y="515" text-anchor="middle" font-size="16">and database limits</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">Compare latency, errors</text><text x="180" y="641" text-anchor="middle" font-size="16">and waits under equal load</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">Does it meet the</text><text x="180" y="767" text-anchor="middle" font-size="16">service criteria?</text><path d="M 342 749 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="749" r="12" fill="#8c3a32"/><text x="384" y="755" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="782" text-anchor="middle" font-size="10">stop</text><text x="193" y="817" font-size="12">yes</text><path d="M 180 793 V 826" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="832" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="869" text-anchor="middle" font-size="16">Expand traffic</text><text x="180" y="893" text-anchor="middle" font-size="16">in small steps</text></g></svg>
