<path d="M230 233 L270 263" fill="none" stroke="#53675c" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="18" y="263" width="154" height="68" rx="8" fill="#e6f0e8" stroke="#53675c"/>
