<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1110" viewBox="0 0 360 1110" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">Spring MVC의 WebClient 대기와 비동기 반환</title>
<desc id="desc">block 경로는 Servlet 요청 스레드 대기와 Netty I/O를 구분한다. Mono 경로는 구독 후 Netty I/O와 Servlet 비동기 처리가 겹치며 결과를 MVC로 재디스패치한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#53675c"/></marker></defs>
<rect width="360" height="1110" fill="#f7f8f4"/>
<g font-family="sans-serif" text-anchor="middle" fill="#20342a">
<text x="180" y="30" font-size="20">MVC + WebClient</text>
<text x="180" y="58" font-size="16">같은 HTTP 클라이언트, 다른 대기 방식</text>
<text x="180" y="96" font-size="17">① .block() 반환 경로</text>
<rect x="30" y="114" width="300" height="48" rx="8" fill="#e6f0e8" stroke="#53675c"/>
