<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1170" viewBox="0 0 360 1170" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">Rust 접근 로그 집계 CLI의 읽기·집계·출력 흐름</title>
  <desc id="desc">인자 하나로 파일을 열고 BufReader로 읽는다. 한 번에 현재 줄을 4097바이트까지만 읽으며 읽기 실패, 4096바이트 초과 또는 잘못된 UTF-8은 오류 반환이다. EOF까지 형식이 맞는 줄은 상태 코드별로 집계하고 잘못된 줄은 invalid를 증가시킨다. 전체 읽기를 마치면 정렬된 집계를 출력하며 invalid가 없으면 종료 코드 0, 있으면 1이다. 인자·파일·분석·출력 실패는 표준 오류와 종료 코드 2로 전달된다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50"/></marker></defs>
  <rect width="360" height="1170" rx="16" fill="#f6f7f2"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="19" font-weight="bold">파일 → 반복 집계 → 종료 상태</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="25" y="60" width="310" height="74" rx="8"/>
      <rect x="25" y="174" width="310" height="100" rx="8"/>
      <rect x="25" y="314" width="310" height="100" rx="8"/>
      <rect x="25" y="454" width="310" height="74" rx="8"/>
      <rect x="25" y="568" width="145" height="90" rx="8"/>
      <rect x="190" y="568" width="145" height="90" rx="8"/>
      <rect x="25" y="740" width="310" height="82" rx="8"/>
      <rect x="25" y="862" width="310" height="82" rx="8"/>
      <rect x="25" y="1010" width="310" height="100" rx="8" fill="#f8e8dd"/>
    </g>
    <text x="180" y="90">main: 인자 하나 확인 · 파일 열기</text>
    <text x="180" y="116">File → BufReader → analyze</text>
    <text x="180" y="202">현재 줄을 최대 4097바이트 읽기</text>
    <text x="180" y="229">읽기 실패는 Err · 0바이트는 EOF</text>
    <text x="180" y="255">그 외에는 길이·UTF-8 검사 ↓</text>
    <text x="180" y="342">4096바이트 초과?</text>
    <text x="180" y="369">잘못된 UTF-8?</text>
    <text x="180" y="396">하나라도 해당하면 Err 반환</text>
    <text x="180" y="484">형식 검사: 상태 코드 + 경로</text>
    <text x="180" y="510">상태 100–599 · 경로는 /로 시작</text>
    <text x="97" y="595">형식이 맞음</text><text x="97" y="620">valid + 1</text><text x="97" y="644">상태 코드별 + 1</text>
    <text x="262" y="595">형식이 틀림</text><text x="262" y="620">invalid + 1</text><text x="262" y="644">원문은 저장 안 함</text>
    <text x="180" y="698">두 분기 모두 다음 줄 읽기로 반복 ↑</text>
    <text x="180" y="768">EOF: Ok(Stats) → main</text><text x="180" y="797">끝까지 읽은 뒤에만 출력 시작</text>
    <text x="180" y="890">상태 코드 오름차순으로 출력 · flush</text><text x="180" y="919">invalid = 0: 코드 0 / 그 외: 코드 1</text>
    <text x="180" y="1040">오류 경로: 인자 · 파일 · 분석 · 출력</text>
    <text x="180" y="1069">main이 표준 오류에 알림 · 코드 2</text>
    <text x="180" y="1095">분석 실패 시 집계 출력하지 않음</text>
    <text x="180" y="1144" font-size="13">EOF와 오류의 분기를 별도 상자로 요약한 그림</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M180 134V174"/><path d="M180 274V314"/><path d="M180 414V454"/>
    <path d="M180 528V548H97V568"/><path d="M180 548H262V568"/>
    <path d="M97 658V675H12V224H25"/><path d="M262 658V675H97"/>
    <path d="M335 250H348V781H335"/><path d="M180 822V862"/>
  </g>
</svg>
