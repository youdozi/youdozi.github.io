<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">Rust 금액 집계 CLI의 처리 흐름</title>
  <desc id="desc">main이 인자를 Vec String으로 소유하고 summarize에 빌려준다. 빈 입력은 오류다. 각 값을 u64로 파싱하고 checked_add로 누적하며 실패하면 즉시 오류를 반환한다. 모두 성공하면 Summary를 반환한다. main은 성공을 표준 출력과 종료 코드 0으로, 오류를 표준 오류와 종료 코드 1로 전달한다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50"/></marker></defs>
  <rect width="360" height="1040" rx="16" fill="#f6f7f2"/>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1e352d">
    <text x="180" y="31" font-size="19" font-weight="bold">소유 → 빌림 → 결과 분기</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="20" y="55" width="215" height="68" rx="8"/>
      <rect x="20" y="155" width="215" height="68" rx="8"/>
      <rect x="20" y="270" width="215" height="64" rx="8"/>
      <rect x="20" y="385" width="215" height="64" rx="8"/>
      <rect x="20" y="505" width="215" height="64" rx="8"/>
      <rect x="20" y="625" width="215" height="64" rx="8"/>
      <rect x="20" y="745" width="215" height="64" rx="8"/>
      <rect x="20" y="865" width="215" height="68" rx="8"/>
      <rect x="250" y="736" width="96" height="78" rx="8" fill="#f8e8dd"/>
      <rect x="250" y="865" width="96" height="68" rx="8" fill="#f8e8dd"/>
    </g>
    <text x="127" y="82">main: 인자 수집</text><text x="127" y="106">Vec&lt;String&gt; 소유</text>
    <text x="127" y="181">summarize(&amp;inputs)</text><text x="127" y="205">문자열 슬라이스 빌림</text>
    <text x="127" y="308">입력이 비었는가?</text>
    <text x="127" y="411">다음 값이 있는가?</text><text x="127" y="434">각 문자열을 참조로 읽기</text>
    <text x="127" y="531">u64로 파싱</text><text x="127" y="554">숫자·범위 확인</text>
    <text x="127" y="651">checked_add로 누적</text><text x="127" y="674">합계 오버플로 확인</text>
    <text x="127" y="772">Ok(Summary) 반환</text><text x="127" y="795">개수·합계</text>
    <text x="127" y="891">main: 표준 출력</text><text x="127" y="916">종료 코드 0</text>
    <text x="298" y="763">Err 반환</text><text x="298" y="788" font-size="13">함수 조기 반환</text>
    <text x="298" y="891">표준 오류</text><text x="298" y="916">종료 코드 1</text>
    <text x="148" y="362">아니요</text><text x="148" y="479">예</text>
    <text x="148" y="598">성공</text><text x="283" y="296">예</text>
    <text x="288" y="495">실패</text><text x="288" y="617">실패</text>
    <text x="88" y="704" font-size="13">누적 성공·반복</text>
    <text x="55" y="740" font-size="13">다음 값 없음</text>
    <text x="116" y="975">성공 시 다음 값으로 반복</text>
    <text x="180" y="1006" font-size="13">그림의 오류 경로는 모두 main의 Err 분기로 모인다.</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M127 123V155"/><path d="M127 223V270"/><path d="M127 334V385"/>
    <path d="M127 449V505"/><path d="M127 569V625"/>
    <path d="M20 417H8V777H20"/>
    <path d="M127 689V710H3V365H127V385"/>
    <path d="M235 302H337V736"/>
    <path d="M235 537H309V736"/><path d="M235 657H280V736"/>
    <path d="M127 809V865"/><path d="M298 814V865"/>
  </g>
</svg>
