<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">Pickle의 키 위임과 두 종류 자격 증명 사용 경계</title>
  <desc id="desc">설정 단계에서 iPhone의 공개 보안 프로그램이 키를 만들고 노드 증명을 검증한 뒤 사용자 키를 검증된 Nitro Enclave에 암호화해 위임한다. 저장 레코드는 암호문이다. 사용 단계에서 노드는 활성 위임을 확인하고 기록 저장 확인 후 자격 증명을 사용한다. OAuth는 노드 내부에서 토큰을 넣어 API에 요청한다. Vault 비밀번호와 카드 값은 release를 거쳐 운영 측 worker에 평문으로 전달되고 웹 폼에 사용된다. 이후 worker와 AI 결과 마스킹은 별도 보호 경계다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50"/></marker></defs>
  <rect width="360" height="1120" rx="16" fill="#f6f7f2"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="18" font-weight="bold">키를 맡기는 단계 · 실제 쓰는 단계</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="25" y="60" width="310" height="85" rx="8"/>
      <rect x="25" y="185" width="310" height="85" rx="8"/>
      <rect x="25" y="310" width="310" height="85" rx="8"/>
      <rect x="25" y="480" width="310" height="110" rx="8"/>
      <rect x="18" y="655" width="151" height="105" rx="8"/>
      <rect x="191" y="655" width="151" height="105" rx="8" fill="#f8e8dd"/>
      <rect x="18" y="805" width="151" height="85" rx="8"/>
      <rect x="191" y="805" width="151" height="85" rx="8" fill="#f8e8dd"/>
    </g>
    <text x="180" y="86">iPhone: 마스터 키 생성</text>
    <text x="180" y="112">iCloud Keychain에 보관</text>
    <text x="180" y="135" font-size="13">실제 프로토콜은 파생 키들을 구분한다</text>
    <text x="180" y="212">노드의 증명·측정값·공개 키 확인</text>
    <text x="180" y="238">검증 실패 → 사용자 키 위임 안 함</text>
    <text x="180" y="260" font-size="13">성공한 노드에만 암호화해 키 위임</text>
    <text x="180" y="337">서버 저장소: 자격 증명 암호문</text>
    <text x="180" y="365">Enclave 메모리: 기간 한정 사용자 키</text>
    <text x="180" y="386" font-size="13">마스터 키 자체를 서버에 맡기는 흐름 아님</text>
    <text x="180" y="451" font-size="14">아래는 위임이 유효할 때의 사용 흐름</text>
    <text x="180" y="508">요청 수신 → 활성 위임·레코드 확인</text>
    <text x="180" y="535">Enclave가 복호화 · 사용 기록 생성</text>
    <text x="180" y="562">로그 저장 확인 후 사용·반출 진행</text>
    <text x="180" y="582" font-size="13">확인 실패 시 사용·반출 실패</text>
    <text x="93" y="682">OAuth: forward</text>
    <text x="93" y="710">토큰은 노드 내부</text>
    <text x="93" y="738">허용 API에 사용</text>
    <text x="266" y="682">Vault: release</text>
    <text x="266" y="710">비밀번호·카드 값</text>
    <text x="266" y="738">worker에 평문 전달</text>
    <text x="93" y="834">API 제공자와 TLS</text><text x="93" y="861">결과 데이터 반환</text>
    <text x="266" y="834">worker → 웹 폼</text><text x="266" y="861">이 구간은 노드 밖</text>
    <text x="180" y="951" font-size="16" font-weight="bold">AI 결과에서 값 숨김: 공식 서비스 설명</text>
    <text x="180" y="983">worker와 앱 전체의 강제 여부까지</text>
    <text x="180" y="1008">이 Enclave 저장소만으로 입증되지는 않음</text>
    <text x="180" y="1060" font-size="13">공개 코드·프로토콜을 요약한 개념도</text>
    <text x="180" y="1086" font-size="13">운영 서버·설치 앱의 실시간 검증 결과 아님</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M180 145V185"/><path d="M180 270V310"/>
    <path d="M180 590V620H93V655"/><path d="M180 620H266V655"/>
    <path d="M93 760V805"/><path d="M266 760V805"/>
  </g>
  <path d="M20 420H340" stroke="#a7b7ac" stroke-dasharray="5 5"/>
</svg>
