<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" viewBox="0 0 440 310" role="img" aria-labelledby="title desc">
<title id="title">用 AI 做 PPT：从大纲到可编辑的 PowerPoint</title>
<desc id="desc">先明确听众和待定事项，审核大纲，再制作可编辑的幻灯片，最后对照原始资料并在放映模式下检查。</desc>
<rect width="440" height="310" rx="12" fill="#f3f6fa"/>
<g font-family="system-ui, sans-serif" fill="#163849">
<rect x="12" y="12" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="44" font-size="22" font-weight="700">拟定大纲</text>
<text x="28" y="72" font-size="17">听众、待定事项和依据</text>
<path d="M220 93v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="114" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="146" font-size="22" font-weight="700">制作 PowerPoint</text>
<text x="28" y="174" font-size="17">可编辑的表格、形状和演讲者备注</text>
<path d="M220 195v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="216" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="248" font-size="22" font-weight="700">逐页检查</text>
<text x="28" y="276" font-size="17">核对原始资料，检查编辑和放映效果</text>
</g>
</svg>
