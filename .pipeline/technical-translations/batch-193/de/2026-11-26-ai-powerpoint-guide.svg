<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" viewBox="0 0 440 310" role="img" aria-labelledby="title desc">
<title id="title">Mit KI eine PowerPoint-Präsentation erstellen – von der Gliederung zu bearbeitbaren Folien</title>
<desc id="desc">Zielgruppe und Entscheidung festlegen, Gliederung prüfen, bearbeitbare Folien erstellen und sie mit den Quellen sowie im Präsentationsmodus kontrollieren.</desc>
<rect width="440" height="310" rx="12" fill="#f3f6fa"/>
<g font-family="system-ui, sans-serif" fill="#163849">
<rect x="12" y="12" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="44" font-size="22" font-weight="700">Gliederung entwerfen</text>
<text x="28" y="72" font-size="17">Zielgruppe, Entscheidung und Belege</text>
<path d="M220 93v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="114" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="146" font-size="22" font-weight="700">PowerPoint-Datei erstellen</text>
<text x="28" y="174" font-size="17">Bearbeitbare Tabellen, Formen und Notizen</text>
<path d="M220 195v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="216" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="248" font-size="22" font-weight="700">Folien prüfen</text>
<text x="28" y="276" font-size="17">Quellen abgleichen und Ansichten testen</text>
</g>
</svg>
