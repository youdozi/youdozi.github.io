<svg xmlns="http://www.w3.org/2000/svg" xml:lang="es" viewBox="0 0 440 310" role="img" aria-labelledby="title desc">
<title id="title">Cómo crear un PowerPoint con IA, del esquema a las diapositivas editables</title>
<desc id="desc">Define el público y la decisión, revisa el esquema, crea diapositivas editables y compruébalas con las fuentes y en modo presentación.</desc>
<rect width="440" height="310" rx="12" fill="#f3f6fa"/>
<g font-family="system-ui, sans-serif" fill="#163849">
<rect x="12" y="12" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="44" font-size="22" font-weight="700">Preparar el esquema</text>
<text x="28" y="72" font-size="17">Público, decisión y datos de respaldo</text>
<path d="M220 93v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="114" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="146" font-size="22" font-weight="700">Crear el PowerPoint</text>
<text x="28" y="174" font-size="17">Tablas, formas y notas del orador</text>
<path d="M220 195v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="216" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="248" font-size="22" font-weight="700">Revisar las diapositivas</text>
<text x="28" y="276" font-size="17">Fuentes, edición y modo presentación</text>
</g>
</svg>
