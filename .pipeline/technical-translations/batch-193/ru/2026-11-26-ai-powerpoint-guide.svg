<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ru" viewBox="0 0 440 310" role="img" aria-labelledby="title desc">
<title id="title">Как сделать презентацию с ИИ: от плана до редактируемых слайдов PowerPoint</title>
<desc id="desc">Определите аудиторию и решение, согласуйте план, создайте редактируемые слайды, сверьте их с источниками и проверьте в режиме показа.</desc>
<rect width="440" height="310" rx="12" fill="#f3f6fa"/>
<g font-family="system-ui, sans-serif" fill="#163849">
<rect x="12" y="12" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="44" font-size="22" font-weight="700">Составить план</text>
<text x="28" y="72" font-size="17">Аудитория, решение и обоснование</text>
<path d="M220 93v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="114" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="146" font-size="22" font-weight="700">Создать файл PowerPoint</text>
<text x="28" y="174" font-size="17">Таблицы, фигуры и заметки докладчика</text>
<path d="M220 195v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="216" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="248" font-size="22" font-weight="700">Проверить слайды</text>
<text x="28" y="276" font-size="17">Сверка с источниками, правка и показ</text>
</g>
</svg>
