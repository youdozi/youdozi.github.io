<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ru" viewBox="0 0 560 232" role="img" aria-labelledby="title desc">
  <title id="title">Как изменился план?</title>
  <desc id="desc">До создания индекса: Seq Scan → Sort → Limit. С частичным индексом: Index Only Scan → Limit.</desc>
  <rect x="2" y="2" width="556" height="108" rx="12" fill="#eff3f7"/>
  <rect x="2" y="122" width="556" height="108" rx="12" fill="#e1f4ed"/>
  <g font-family="system-ui, sans-serif" fill="#19354a">
    <text x="24" y="39" font-size="23">До создания индекса</text>
    <text x="24" y="83" font-size="29" font-weight="600">Seq Scan → Sort → Limit</text>
    <text x="24" y="159" font-size="23">С частичным индексом</text>
    <text x="24" y="203" font-size="29" font-weight="600">Index Only Scan → Limit</text>
  </g>
</svg>
