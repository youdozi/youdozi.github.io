<svg xmlns="http://www.w3.org/2000/svg" xml:lang="es" viewBox="0 0 560 232" role="img" aria-labelledby="title desc">
  <title id="title">¿Qué cambió en el plan?</title>
  <desc id="desc">Antes de crear el índice: Seq Scan → Sort → Limit. Con el índice parcial: Index Only Scan → Limit.</desc>
  <rect x="2" y="2" width="556" height="108" rx="12" fill="#eff3f7"/>
  <rect x="2" y="122" width="556" height="108" rx="12" fill="#e1f4ed"/>
  <g font-family="system-ui, sans-serif" fill="#19354a">
    <text x="24" y="39" font-size="23">Antes de crear el índice</text>
    <text x="24" y="83" font-size="29" font-weight="600">Seq Scan → Sort → Limit</text>
    <text x="24" y="159" font-size="23">Con el índice parcial</text>
    <text x="24" y="203" font-size="29" font-weight="600">Index Only Scan → Limit</text>
  </g>
</svg>
