<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" viewBox="0 0 560 232" role="img" aria-labelledby="title desc">
  <title id="title">执行计划发生了什么变化？</title>
  <desc id="desc">建索引前: Seq Scan → Sort → Limit. 使用部分索引后: Index Only Scan → Limit.</desc>
  <rect x="2" y="2" width="556" height="108" rx="12" fill="#eff3f7"/>
  <rect x="2" y="122" width="556" height="108" rx="12" fill="#e1f4ed"/>
  <g font-family="system-ui, sans-serif" fill="#19354a">
    <text x="24" y="39" font-size="23">建索引前</text>
    <text x="24" y="83" font-size="29" font-weight="600">Seq Scan → Sort → Limit</text>
    <text x="24" y="159" font-size="23">使用部分索引后</text>
    <text x="24" y="203" font-size="29" font-weight="600">Index Only Scan → Limit</text>
  </g>
</svg>
