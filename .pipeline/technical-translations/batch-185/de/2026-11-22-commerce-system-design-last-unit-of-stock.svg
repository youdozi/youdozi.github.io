    <rect x="215" y="325" width="192" height="107" rx="10" fill="#e9f2ff" stroke="#7a9ec4"/>
  </g>
  <g fill="#172f48" font-family="system-ui, sans-serif" text-anchor="middle" font-size="16">
    <text x="210" y="45" font-weight="700">Geprüfte Zahlung und Bestellstatus lesen</text>
    <text x="101" y="128" font-size="14" font-weight="700" textLength="156" lengthAdjust="spacingAndGlyphs">Bezahlt / Erstattung offen</text>
    <text x="101" y="149">Keine neue Aufgabe</text>
    <text x="303" y="139" font-weight="700">Geprüftes Ergebnis</text>
    <text x="72" y="230" font-weight="700">Ungeklärt</text>
    <text x="72" y="252" textLength="108" lengthAdjust="spacingAndGlyphs">Status behalten</text>
    <text x="210" y="230" font-weight="700" textLength="108" lengthAdjust="spacingAndGlyphs">Ohne Abbuch.</text>
    <text x="210" y="252">Freigeben</text>
    <text x="348" y="242" font-weight="700">Bezahlt</text>
    <text x="109" y="355" font-weight="700">Bestand reserviert</text>
    <text x="109" y="380">Bestätigen, zuweisen</text>
    <text x="109" y="405">Versand einreihen</text>
    <text x="311" y="355" font-weight="700">Bestand freigegeben</text>
    <text x="311" y="380">Storniert lassen</text>
    <text x="311" y="405">Erstattung einreihen</text>
  </g>
