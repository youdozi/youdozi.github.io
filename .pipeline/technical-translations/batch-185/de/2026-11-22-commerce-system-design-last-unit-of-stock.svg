<svg xml:lang="de" xmlns="http://www.w3.org/2000/svg" width="420" height="462" viewBox="0 0 420 462" role="img" aria-labelledby="title desc">
  <title id="title">Ein Zahlungsergebnis auf die Bestandsreservierung anwenden</title>
  <desc id="desc">Bei bereits bezahlten Zahlungen oder ausstehender Rückerstattung entsteht keine neue Aufgabe. Solange das Ergebnis ungeklärt ist, bleibt der Reservierungsstatus bestehen. Wird der Vorgang ohne Abbuchung geschlossen, wird die Reservierung freigegeben. Bei Zahlungseingang folgt die Versandabwicklung, falls der Bestand reserviert ist, andernfalls eine Rückerstattung.</desc>
