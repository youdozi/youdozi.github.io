<svg xml:lang="de" xmlns="http://www.w3.org/2000/svg" width="420" height="415" viewBox="0 0 420 415" role="img" aria-labelledby="title desc">
  <title id="title">Trace-Weitergabe nach Art der RestClient-Erstellung</title>
  <desc id="desc">Die Produkt-App fragt Produkt 42 ab. Links sendet der Boot-Builder traceparent. Der Server-Span der Bestands-API schließt an den Client-Span der Produkt-App an. Rechts sendet der direkt erstellte RestClient keinen Header. Der Bestandsserver beginnt einen eigenen Trace. Beide Anfragen liefern HTTP 200.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#536781"/>
    </marker>
  </defs>
  <rect width="420" height="415" rx="18" fill="#f3f7fb"/>
  <g fill="none" stroke="#536781" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M210 67V82H109V98"/>
    <path d="M210 67V82H311V98"/>
    <path d="M109 177V204"/>
    <path d="M311 177V204"/>
    <path d="M109 283V311H198V332"/>
    <path d="M311 283V311H222V332"/>
  </g>
  <g stroke-width="1.2">
    <rect x="27" y="16" width="366" height="51" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="14" y="101" width="190" height="76" rx="10" fill="#eaf3ff" stroke="#7a9ec4"/>
    <rect x="216" y="101" width="190" height="76" rx="10" fill="#fff0de" stroke="#cfa671"/>
    <rect x="14" y="207" width="190" height="76" rx="10" fill="#eaf3ff" stroke="#7a9ec4"/>
    <rect x="216" y="207" width="190" height="76" rx="10" fill="#fff0de" stroke="#cfa671"/>
    <rect x="27" y="335" width="366" height="57" rx="10" fill="#fff" stroke="#a6bdd5"/>
  </g>
  <g fill="#18324e" font-family="system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif" text-anchor="middle" font-size="16">
    <text x="210" y="47" font-weight="700">Produkt-App · GET /products/42</text>
    <text x="109" y="130" font-weight="700">Boot-Builder</text>
    <text x="109" y="156">Sendet traceparent</text>
    <text x="311" y="130" font-weight="700">RestClient.create()</text>
    <text x="311" y="156" textLength="172" lengthAdjust="spacingAndGlyphs">Kein traceparent-Header</text>
    <text x="109" y="237" font-weight="700">Bestands-API</text>
    <text x="109" y="262" textLength="172" lengthAdjust="spacingAndGlyphs">Verwendet denselben Trace</text>
    <text x="311" y="237" font-weight="700">Bestands-API</text>
    <text x="311" y="262" textLength="172" lengthAdjust="spacingAndGlyphs">Startet einen neuen Trace</text>
    <text x="210" y="359" font-weight="700">Beide liefern 200 OK</text>
    <text x="210" y="380">Produkt-ID 42 · Bestand 7</text>
  </g>
</svg>
