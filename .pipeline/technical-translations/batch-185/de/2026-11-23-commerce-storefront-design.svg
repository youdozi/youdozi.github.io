<svg xml:lang="de" xmlns="http://www.w3.org/2000/svg" width="468" height="461" viewBox="0 0 468 461" role="img" aria-labelledby="title desc">
  <title id="title">Bestellstatus nach der Rückkehr von der Zahlung</title>
  <desc id="desc">Die bestehende Bestellung abrufen. Beim Laden einen Wartehinweis und bei Fehlern eine Möglichkeit zum erneuten Abruf anzeigen. Nach dem Laden je nach Zahlungs- und Bestellstatus das Aktualisieren des Status, die Sendungsverfolgung, die Produktauswahl oder das Aktualisieren beziehungsweise Anzeigen der Rückerstattung anbieten.</desc>
  <rect width="468" height="461" rx="16" fill="#f4f7fb"/>
  <path d="M25 66V426 M25 100H44 M25 158H44 M25 225H44 M25 283H44 M25 341H44 M25 399H44" fill="none" stroke="#7185a0" stroke-width="1.6"/>
  <g stroke="#b5c4d6">
    <rect x="15" y="14" width="438" height="52" rx="9" fill="#fff"/>
    <rect x="44" y="80" width="408" height="47" rx="8" fill="#fff"/>
    <rect x="44" y="138" width="408" height="47" rx="8" fill="#fff2e5"/>
    <rect x="44" y="197" width="408" height="56" rx="8" fill="#eef4ff"/>
    <rect x="44" y="263" width="408" height="42" rx="8" fill="#e9f5ec"/>
    <rect x="44" y="321" width="408" height="42" rx="8" fill="#fff"/>
    <rect x="44" y="379" width="408" height="64" rx="8" fill="#eef4ff"/>
  </g>
  <g fill="#203951" font-family="system-ui, sans-serif" font-size="16">
    <text x="34" y="46" font-size="18" font-weight="700">Nach der Zahlung · Bestellung abrufen</text>
    <text x="61" y="109">Wird geladen · Wartehinweis anzeigen</text>
    <text x="61" y="167">Abruf fehlgeschlagen · Status neu laden</text>
    <text x="61" y="220" font-weight="700">Zahlung ungeklärt oder Bestellung in Prüfung</text>
    <text x="61" y="243">Bestellstatus aktualisieren</text>
    <text x="61" y="289" textLength="378" lengthAdjust="spacingAndGlyphs">Zahlung und Bestellung bestätigt · Sendung verfolgen</text>
    <text x="61" y="347">Storniert ohne Abbuchung · Produkte ansehen</text>
    <text x="61" y="403">Erstattung läuft · Erstattungsstatus aktualisieren</text>
    <text x="61" y="428">Erstattung abgeschlossen · Details anzeigen</text>
  </g>
</svg>
