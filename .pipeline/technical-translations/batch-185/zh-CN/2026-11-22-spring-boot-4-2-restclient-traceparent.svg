<svg xml:lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="420" height="415" viewBox="0 0 420 415" role="img" aria-labelledby="title desc">
  <title id="title">RestClient 创建方式与链路传播</title>
  <desc id="desc">商品应用查询商品 42。左侧使用 Boot 构建器发送 traceparent，库存服务器 span 接续商品客户端 span。右侧直接创建的 RestClient 不发送该头，库存服务器开启另一条链路。两次请求都返回 HTTP 200。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#536781"/>
    </marker>
  </defs>
  <rect width="420" height="415" rx="18" fill="#f3f7fb"/>
  <g fill="none" stroke="#536781" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M210 67V82H109V98"/>
    <path d="M210 67V82H311V98"/>
    <path d="M109 177V204"/>
    <path d="M311 177V204"/>
    <path d="M109 283V311H198V332"/>
    <path d="M311 283V311H222V332"/>
  </g>
  <g stroke-width="1.2">
    <rect x="27" y="16" width="366" height="51" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="14" y="101" width="190" height="76" rx="10" fill="#eaf3ff" stroke="#7a9ec4"/>
    <rect x="216" y="101" width="190" height="76" rx="10" fill="#fff0de" stroke="#cfa671"/>
    <rect x="14" y="207" width="190" height="76" rx="10" fill="#eaf3ff" stroke="#7a9ec4"/>
    <rect x="216" y="207" width="190" height="76" rx="10" fill="#fff0de" stroke="#cfa671"/>
    <rect x="27" y="335" width="366" height="57" rx="10" fill="#fff" stroke="#a6bdd5"/>
  </g>
  <g fill="#18324e" font-family="system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif" text-anchor="middle" font-size="16">
    <text x="210" y="47" font-weight="700">商品应用 · GET /products/42</text>
    <text x="109" y="130" font-weight="700">Boot 构建器</text>
    <text x="109" y="156">发送 traceparent</text>
    <text x="311" y="130" font-weight="700">RestClient.create()</text>
    <text x="311" y="156">没有 traceparent 请求头</text>
    <text x="109" y="237" font-weight="700">库存 API</text>
    <text x="109" y="262">加入同一条链路</text>
    <text x="311" y="237" font-weight="700">库存 API</text>
    <text x="311" y="262">开始另一条链路</text>
    <text x="210" y="359" font-weight="700">均返回 200 OK</text>
    <text x="210" y="380">商品 ID 42 · 库存 7</text>
  </g>
</svg>
