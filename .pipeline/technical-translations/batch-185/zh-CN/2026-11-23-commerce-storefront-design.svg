<svg xml:lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="468" height="461" viewBox="0 0 468 461" role="img" aria-labelledby="title desc">
  <title id="title">购物者从支付页返回后显示的订单状态</title>
  <desc id="desc">查询已存在的订单。加载时显示等待提示，查询失败时提供重试。查到订单后，按支付和订单状态引导购物者刷新、追踪物流、浏览商品、刷新退款状态或查看退款详情。</desc>
  <rect width="468" height="461" rx="16" fill="#f4f7fb"/>
  <path d="M25 66V426 M25 100H44 M25 158H44 M25 225H44 M25 283H44 M25 341H44 M25 399H44" fill="none" stroke="#7185a0" stroke-width="1.6"/>
  <g stroke="#b5c4d6">
    <rect x="15" y="14" width="438" height="52" rx="9" fill="#fff"/>
    <rect x="44" y="80" width="408" height="47" rx="8" fill="#fff"/>
    <rect x="44" y="138" width="408" height="47" rx="8" fill="#fff2e5"/>
    <rect x="44" y="197" width="408" height="56" rx="8" fill="#eef4ff"/>
    <rect x="44" y="263" width="408" height="42" rx="8" fill="#e9f5ec"/>
    <rect x="44" y="321" width="408" height="42" rx="8" fill="#fff"/>
    <rect x="44" y="379" width="408" height="64" rx="8" fill="#eef4ff"/>
  </g>
  <g fill="#203951" font-family="system-ui, sans-serif" font-size="16">
    <text x="34" y="46" font-size="18" font-weight="700">从支付页返回 · 查询订单</text>
    <text x="61" y="109">加载中 · 显示等待提示</text>
    <text x="61" y="167">查询失败 · 重新加载订单状态</text>
    <text x="61" y="220" font-weight="700">支付结果未知或订单审核中</text>
    <text x="61" y="243">刷新订单状态</text>
    <text x="61" y="289">支付和订单已确认 · 追踪物流</text>
    <text x="61" y="347">已取消且未扣款 · 浏览商品</text>
    <text x="61" y="403">退款处理中 · 刷新退款状态</text>
    <text x="61" y="428">退款完成 · 查看退款详情</text>
  </g>
</svg>
