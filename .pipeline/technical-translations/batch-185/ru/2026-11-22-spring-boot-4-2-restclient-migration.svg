<svg xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="420" height="380" viewBox="0 0 420 380" role="img" aria-labelledby="title desc">
  <title id="title">Поиск товара и обработка ответа 404</title>
  <desc id="desc">Приложение ищет товар через RestClient по идентификатору от RestTestClient. Вышестоящий сервер возвращает 200 и Keyboard для ID 42 и 404 для ID 99. Приложение возвращает 200 и Keyboard либо 404 с пустым телом.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#51657e"/>
    </marker>
  </defs>
  <rect width="420" height="380" rx="18" fill="#f4f7fb"/>
  <g stroke="#51657e" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M210 79V108"/>
    <path d="M210 171V194H109V213"/>
    <path d="M210 171V194H311V213"/>
    <path d="M109 273V305"/>
    <path d="M311 273V305"/>
  </g>
  <g stroke-width="1.2">
    <rect x="40" y="20" width="340" height="59" rx="10" fill="#fff" stroke="#b7c6d8"/>
    <rect x="40" y="111" width="340" height="60" rx="10" fill="#fff" stroke="#b7c6d8"/>
    <rect x="14" y="216" width="190" height="57" rx="10" fill="#e7f4ed" stroke="#74a68c"/>
    <rect x="216" y="216" width="190" height="57" rx="10" fill="#fff2e2" stroke="#bd925f"/>
    <rect x="14" y="308" width="190" height="52" rx="10" fill="#fff" stroke="#74a68c"/>
    <rect x="216" y="308" width="190" height="52" rx="10" fill="#fff" stroke="#bd925f"/>
  </g>
  <g fill="#172c43" font-family="system-ui, sans-serif" text-anchor="middle" font-size="15">
    <text x="210" y="43" font-weight="700">RestTestClient → приложение Spring MVC</text>
    <text x="210" y="65">GET /products/{id}</text>
    <text x="210" y="135" font-weight="700">RestClient приложения → внешний API</text>
    <text x="210" y="157">GET /items/{id}</text>
    <text x="109" y="239" font-weight="700">ID 42 · ответ API 200</text>
    <text x="109" y="260">Тело: Keyboard</text>
    <text x="311" y="239" font-weight="700">ID 99 · ответ API 404</text>
    <text x="311" y="260">Исключение RestClient</text>
    <text x="109" y="331" font-weight="700">Приложение: 200</text>
    <text x="109" y="352">Тело: Keyboard</text>
    <text x="311" y="331" font-weight="700">Перехват и ответ 404</text>
    <text x="311" y="352">Пустое тело</text>
  </g>
</svg>
