<svg xml:lang="es" xmlns="http://www.w3.org/2000/svg" width="468" height="461" viewBox="0 0 468 461" role="img" aria-labelledby="title desc">
  <title id="title">Estado del pedido al regresar del pago</title>
  <desc id="desc">Consulta el pedido existente. Mientras carga, muestra un aviso de espera. Si falla la consulta, ofrece un nuevo intento. Una vez cargado, los estados del pago y el pedido guían al comprador a actualizar el estado, seguir el envío, explorar productos, actualizar el reembolso o ver sus detalles.</desc>
  <rect width="468" height="461" rx="16" fill="#f4f7fb"/>
  <path d="M25 66V426 M25 100H44 M25 158H44 M25 225H44 M25 283H44 M25 341H44 M25 399H44" fill="none" stroke="#7185a0" stroke-width="1.6"/>
  <g stroke="#b5c4d6">
    <rect x="15" y="14" width="438" height="52" rx="9" fill="#fff"/>
    <rect x="44" y="80" width="408" height="47" rx="8" fill="#fff"/>
    <rect x="44" y="138" width="408" height="47" rx="8" fill="#fff2e5"/>
    <rect x="44" y="197" width="408" height="56" rx="8" fill="#eef4ff"/>
    <rect x="44" y="263" width="408" height="42" rx="8" fill="#e9f5ec"/>
    <rect x="44" y="321" width="408" height="42" rx="8" fill="#fff"/>
    <rect x="44" y="379" width="408" height="64" rx="8" fill="#eef4ff"/>
  </g>
  <g fill="#203951" font-family="system-ui, sans-serif" font-size="16">
    <text x="34" y="46" font-size="18" font-weight="700">Regreso del pago · consultar pedido</text>
    <text x="61" y="109">Cargando · mostrar mensaje de espera</text>
    <text x="61" y="167">Falló la consulta · volver a cargar el estado</text>
    <text x="61" y="220" font-weight="700">Pago sin confirmar o pedido en revisión</text>
    <text x="61" y="243">Actualizar estado del pedido</text>
    <text x="61" y="289">Pago y pedido confirmados · seguir el envío</text>
    <text x="61" y="347">Cancelado sin cobro · explorar productos</text>
    <text x="61" y="403">Reembolso pendiente · actualizar estado</text>
    <text x="61" y="428">Reembolso completado · ver detalles</text>
  </g>
</svg>
