<svg xml:lang="es" xmlns="http://www.w3.org/2000/svg" width="420" height="410" viewBox="0 0 420 410" role="img" aria-labelledby="title desc">
  <title id="title">Comparación de dos convenciones de métricas HTTP</title>
  <desc id="desc">Ejecuta la misma aplicación con las convenciones predeterminadas y luego con OpenTelemetry. Solicita los productos 42 y 99 y guarda la salida de Prometheus. En el ejemplo cambian el nombre y las etiquetas de la métrica del servidor MVC. Los de la métrica de RestClient siguen iguales.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#506681"/>
    </marker>
  </defs>
  <rect width="420" height="410" rx="18" fill="#f3f7fb"/>
  <g fill="none" stroke="#506681" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M109 73V98H198V115"/>
    <path d="M311 73V98H222V115"/>
    <path d="M210 192V221"/>
    <path d="M210 285V307H109V325"/>
    <path d="M210 285V307H311V325"/>
  </g>
  <g stroke-width="1.2">
    <rect x="14" y="20" width="190" height="53" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="216" y="20" width="190" height="53" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="27" y="118" width="366" height="74" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="27" y="224" width="366" height="61" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="14" y="328" width="190" height="61" rx="10" fill="#eaf3ff" stroke="#7a9ec4"/>
    <rect x="216" y="328" width="190" height="61" rx="10" fill="#e8f3ec" stroke="#78a08a"/>
  </g>
  <g fill="#18324e" font-family="system-ui, sans-serif" text-anchor="middle" font-size="16">
    <text x="109" y="43" font-weight="700" textLength="172" lengthAdjust="spacingAndGlyphs">Convenciones por defecto<tspan x="109" dy="18" font-weight="400">Iniciar la aplicación</tspan></text>
    <text x="311" y="43" font-weight="700">OpenTelemetry<tspan x="311" dy="18" font-weight="400">Iniciar la aplicación</tspan></text>
    <text x="210" y="145" font-weight="700" textLength="342" lengthAdjust="spacingAndGlyphs">Solicitar los productos 42 y 99 en cada ejecución</text>
    <text x="210" y="172">Spring MVC → RestClient → API externa</text>
    <text x="210" y="249" font-weight="700">Guardar la salida de Prometheus</text>
    <text x="210" y="273">/actuator/prometheus</text>
    <text x="109" y="354" font-weight="700">Servidor Spring MVC</text>
    <text x="109" y="375" textLength="172" lengthAdjust="spacingAndGlyphs">Cambian nombre y etiquetas</text>
    <text x="311" y="354" font-weight="700">RestClient</text>
    <text x="311" y="375" textLength="172" lengthAdjust="spacingAndGlyphs">Igual nombre y etiquetas</text>
  </g>
</svg>
