<svg xml:lang="es" xmlns="http://www.w3.org/2000/svg" width="400" height="446" viewBox="0 0 400 446" role="img" aria-labelledby="title desc">
  <title id="title">Consulta de un pago existente y revisión de la reserva de stock</title>
  <desc id="desc">Busca la transacción existente del proveedor cuando el resultado del pago no se conoce. Si no hay respuesta, mantén los estados actuales. Si se confirma el pago, revisa la reserva vinculada y registra una solicitud de reembolso o asigna el stock para preparar el envío.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#456581"/>
    </marker>
  </defs>
  <rect width="400" height="446" rx="15" fill="#f3f6f9"/>
  <g fill="none" stroke="#456581" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M200 81V104"/>
    <path d="M96 157v28h-59v92h18"/>
    <path d="M275 157v20"/>
    <path d="M238 229v86"/>
    <path d="M355 229h20v169h-28"/>
  </g>
  <g stroke-width="1">
    <rect x="30" y="24" width="340" height="57" rx="6" fill="#e4effa" stroke="#a8c3dc"/>
    <rect x="30" y="104" width="340" height="53" rx="6" fill="#fff" stroke="#b5c6d6"/>
    <rect x="138" y="177" width="232" height="52" rx="6" fill="#fff" stroke="#b5c6d6"/>
    <rect x="55" y="251" width="151" height="52" rx="6" fill="#fff" stroke="#b5c6d6"/>
    <rect x="55" y="315" width="292" height="50" rx="6" fill="#fff1da" stroke="#dab175"/>
    <rect x="55" y="374" width="292" height="50" rx="6" fill="#e4f3eb" stroke="#97c5af"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="16" fill="#182d41" text-anchor="middle">
    <text x="200" y="48" font-weight="700">Consultar el pago existente</text>
    <text x="200" y="68" font-size="13">Usar el ID de transacción asociado al pedido</text>
    <text x="200" y="136" font-weight="700">¿Pago confirmado?</text>
    <text x="254" y="208" font-weight="700">Comprobar la reserva</text>
    <text x="130" y="269" font-size="13" font-weight="700">Pago sin confirmar</text>
    <text x="130" y="283" font-size="11">Mantener estados</text>
    <text x="130" y="296" font-size="11">de reserva y envío</text>
    <text x="201" y="337" font-weight="700" textLength="274" lengthAdjust="spacingAndGlyphs">Registrar una solicitud de reembolso</text>
    <text x="201" y="354" font-size="13" textLength="274" lengthAdjust="spacingAndGlyphs">Mantener el pedido cancelado y el envío en pausa</text>
    <text x="201" y="396" font-weight="700">Confirmar pedido y pago</text>
    <text x="201" y="413" font-size="13">Asignar stock y poner el envío en cola</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#385771">
    <text x="44" y="204">Sin respuesta</text>
    <text x="283" y="172">Confirmado</text>
    <text x="244" y="270">Liberada</text>
    <text x="367" y="267" text-anchor="end">Activa</text>
  </g>
</svg>
