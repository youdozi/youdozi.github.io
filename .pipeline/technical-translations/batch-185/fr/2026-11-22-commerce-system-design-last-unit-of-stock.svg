<svg xml:lang="fr" xmlns="http://www.w3.org/2000/svg" width="420" height="462" viewBox="0 0 420 462" role="img" aria-labelledby="title desc">
  <title id="title">Appliquer un résultat de paiement à une réservation de stock</title>
  <desc id="desc">Un paiement déjà enregistré ou en attente de remboursement ne crée aucune tâche. Un résultat indéterminé laisse la réservation en l’état. Une transaction clôturée sans débit libère la réservation. Si un paiement est confirmé, l’expédition est demandée quand le stock est réservé, ou un remboursement quand il a été libéré.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#546984"/>
    </marker>
  </defs>
  <rect width="420" height="462" rx="16" fill="#f4f7fb"/>
  <g fill="none" stroke="#546984" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M210 64V82H101V101"/>
    <path d="M210 64V82H303V101"/>
    <path d="M303 160V183H72V203"/>
    <path d="M303 160V183H210V203"/>
    <path d="M303 160V183H348V203"/>
    <path d="M348 269V298H109V322"/>
    <path d="M348 269V298H311V322"/>
  </g>
  <g stroke-width="1.2">
    <rect x="29" y="15" width="362" height="49" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="14" y="104" width="174" height="56" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="205" y="104" width="196" height="56" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="12" y="206" width="120" height="63" rx="10" fill="#fff0df" stroke="#cfa671"/>
    <rect x="150" y="206" width="120" height="63" rx="10" fill="#fff0df" stroke="#cfa671"/>
    <rect x="288" y="206" width="120" height="63" rx="10" fill="#e9f2ff" stroke="#7a9ec4"/>
    <rect x="13" y="325" width="192" height="107" rx="10" fill="#e7f5eb" stroke="#7ca98e"/>
    <rect x="215" y="325" width="192" height="107" rx="10" fill="#e9f2ff" stroke="#7a9ec4"/>
  </g>
  <g fill="#172f48" font-family="system-ui, sans-serif" text-anchor="middle" font-size="16">
    <text x="210" y="45" font-weight="700" textLength="342" lengthAdjust="spacingAndGlyphs">Lire le paiement vérifié et l’état de la commande</text>
    <text x="101" y="128" font-size="14" font-weight="700">Payé ou à rembourser</text>
    <text x="101" y="149" textLength="156" lengthAdjust="spacingAndGlyphs">Aucune nouvelle tâche</text>
    <text x="303" y="139" font-weight="700" textLength="178" lengthAdjust="spacingAndGlyphs">Résultat de paiement vérifié</text>
    <text x="72" y="230" font-weight="700">Indéterminé</text>
    <text x="72" y="252" textLength="108" lengthAdjust="spacingAndGlyphs">Garder la réserve</text>
    <text x="210" y="230" font-weight="700" textLength="108" lengthAdjust="spacingAndGlyphs">Clos sans débit</text>
    <text x="210" y="252" textLength="108" lengthAdjust="spacingAndGlyphs">Libérer le stock</text>
    <text x="348" y="242" font-weight="700">Payé</text>
    <text x="109" y="355" font-weight="700">Stock réservé</text>
    <text x="109" y="380">Confirmer, affecter</text>
    <text x="109" y="405" textLength="174" lengthAdjust="spacingAndGlyphs">Mettre en file d’expédition</text>
    <text x="311" y="355" font-weight="700">Stock déjà libéré</text>
    <text x="311" y="380" textLength="174" lengthAdjust="spacingAndGlyphs">Garder la commande annulée</text>
    <text x="311" y="405" textLength="174" lengthAdjust="spacingAndGlyphs">Planifier le remboursement</text>
  </g>
</svg>
