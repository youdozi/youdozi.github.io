<svg xml:lang="fr" xmlns="http://www.w3.org/2000/svg" width="420" height="382" viewBox="0 0 420 382" role="img" aria-labelledby="title desc">
  <title id="title">Accès aux modèles Claude selon le compte et la tâche</title>
  <desc id="desc">Les abonnés à une offre payante peuvent sélectionner Fable 5.2. Les dépôts Enterprise sont examinés avec Claude Security. L’accès direct à Mythos nécessite une autorisation du compte.</desc>
  <rect width="420" height="382" rx="16" fill="#f6f5f1"/>
  <g fill="#fff" stroke="#c9c5bb">
    <rect x="18" y="16" width="384" height="49" rx="8"/>
    <rect x="44" y="84" width="358" height="80" rx="8"/>
    <rect x="44" y="178" width="358" height="80" rx="8"/>
    <rect x="44" y="272" width="358" height="91" rx="8"/>
  </g>
  <path d="M29 65V307 M29 123H44 M29 217H44 M29 307H44" fill="none" stroke="#8d7763" stroke-width="1.6"/>
  <g fill="#241e19" font-family="system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <text x="38" y="47" font-size="18" font-weight="700">Que souhaitez-vous faire ?</text>
    <text x="62" y="111" font-size="17" font-weight="700">Programmer avec une offre payante</text>
    <text x="62" y="140" font-size="16">Chercher Fable 5.2 dans le sélecteur</text>
    <text x="62" y="205" font-size="17" font-weight="700">Vérifier la sécurité d’un dépôt Enterprise</text>
    <text x="62" y="234" font-size="16">Utiliser Claude Security si le service est actif</text>
    <text x="62" y="300" font-size="17" font-weight="700">Utiliser directement le modèle Mythos</text>
    <text x="62" y="327" font-size="16">Vérifier l’autorisation et le canal</text>
    <text x="62" y="349" font-size="14">Par exemple, Claude Code ou l’API Claude</text>
  </g>
</svg>
