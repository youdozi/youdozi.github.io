<svg xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="420" height="370" viewBox="0 0 420 370" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL で注文明細の在庫を予約する</title>
  <desc id="desc">注文明細から SKU と数量を読み取り、対応する在庫行を条件付きで更新します。一行更新できたら予約を挿入して true を返します。更新できなければ予約は挿入せず false を返します。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#536983"/>
    </marker>
  </defs>
  <rect width="420" height="370" rx="16" fill="#f4f7fb"/>
  <g fill="none" stroke="#536983" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M210 74V106"/>
    <path d="M210 178V202H110V220"/>
    <path d="M210 178V202H310V220"/>
    <path d="M110 280V304"/>
    <path d="M310 280V304"/>
  </g>
  <g stroke-width="1.2">
    <rect x="35" y="16" width="350" height="58" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="35" y="109" width="350" height="69" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="15" y="223" width="190" height="57" rx="10" fill="#e7f5eb" stroke="#7ca98e"/>
    <rect x="215" y="223" width="190" height="57" rx="10" fill="#fff0df" stroke="#cfa671"/>
    <rect x="15" y="307" width="190" height="45" rx="10" fill="#fff" stroke="#7ca98e"/>
    <rect x="215" y="307" width="190" height="45" rx="10" fill="#fff" stroke="#cfa671"/>
  </g>
  <g fill="#172f48" font-family="system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif" text-anchor="middle" font-size="16">
    <text x="210" y="40" font-weight="700">order_item · 注文明細</text>
    <text x="210" y="62">SKU と数量を読む</text>
    <text x="210" y="136" font-weight="700">inventory · 条件付き UPDATE</text>
    <text x="210" y="161">十分な在庫があれば予約数を増やす</text>
    <text x="110" y="247" font-weight="700">1 行を更新</text>
    <text x="110" y="269">予約を挿入</text>
    <text x="310" y="247" font-weight="700">0 行を更新</text>
    <text x="310" y="269">予約なし</text>
    <text x="110" y="334" font-weight="700">true · 予約成功</text>
    <text x="310" y="334" font-weight="700">false · 予約失敗</text>
  </g>
</svg>
