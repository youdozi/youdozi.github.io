<svg xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="400" height="446" viewBox="0 0 400 446" role="img" aria-labelledby="title desc">
  <title id="title">既存の決済の照会と在庫予約の処理</title>
  <desc id="desc">決済結果が未確定の注文について、決済事業者に既存の取引を照会します。応答がなければ状態を変えません。支払いが確定したら在庫予約を確認し、返金依頼を記録するか、出荷処理用に在庫を引き当てます。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#456581"/>
    </marker>
  </defs>
  <rect width="400" height="446" rx="15" fill="#f3f6f9"/>
  <g fill="none" stroke="#456581" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M200 81V104"/>
    <path d="M96 157v28h-59v92h18"/>
    <path d="M275 157v20"/>
    <path d="M238 229v86"/>
    <path d="M355 229h20v169h-28"/>
  </g>
  <g stroke-width="1">
    <rect x="30" y="24" width="340" height="57" rx="6" fill="#e4effa" stroke="#a8c3dc"/>
    <rect x="30" y="104" width="340" height="53" rx="6" fill="#fff" stroke="#b5c6d6"/>
    <rect x="138" y="177" width="232" height="52" rx="6" fill="#fff" stroke="#b5c6d6"/>
    <rect x="55" y="251" width="151" height="52" rx="6" fill="#fff" stroke="#b5c6d6"/>
    <rect x="55" y="315" width="292" height="50" rx="6" fill="#fff1da" stroke="#dab175"/>
    <rect x="55" y="374" width="292" height="50" rx="6" fill="#e4f3eb" stroke="#97c5af"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="16" fill="#182d41" text-anchor="middle">
    <text x="200" y="48" font-weight="700">既存の決済を照会</text>
    <text x="200" y="68" font-size="13">注文にひも付く事業者の取引 ID を使う</text>
    <text x="200" y="136" font-weight="700">支払いは確定したか？</text>
    <text x="254" y="208" font-weight="700">在庫予約を確認</text>
    <text x="130" y="269" font-size="13" font-weight="700">決済結果が未確定</text>
    <text x="130" y="283" font-size="11">在庫予約・出荷状態を</text>
    <text x="130" y="296" font-size="11">維持する</text>
    <text x="201" y="337" font-weight="700">返金依頼を記録</text>
    <text x="201" y="354" font-size="13">注文取消・出荷保留を維持</text>
    <text x="201" y="396" font-weight="700">注文と決済を確定</text>
    <text x="201" y="413" font-size="13">在庫を引き当て出荷キューに載せる</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#385771">
    <text x="44" y="204">応答なし</text>
    <text x="283" y="172">確定</text>
    <text x="244" y="270">解除済み</text>
    <text x="367" y="267" text-anchor="end">予約中</text>
  </g>
</svg>
