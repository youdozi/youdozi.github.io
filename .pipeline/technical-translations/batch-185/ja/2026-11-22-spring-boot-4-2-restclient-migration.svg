<svg xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="420" height="380" viewBox="0 0 420 380" role="img" aria-labelledby="title desc">
  <title id="title">商品照会と 404 の処理</title>
  <desc id="desc">アプリは RestClient を使って、RestTestClient が送った商品 ID を照会します。上流サーバーは ID 42 なら 200 と Keyboard、ID 99 なら 404 を返します。アプリは 200 と Keyboard、または本文が空の 404 を返します。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#51657e"/>
    </marker>
  </defs>
  <rect width="420" height="380" rx="18" fill="#f4f7fb"/>
  <g stroke="#51657e" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M210 79V108"/>
    <path d="M210 171V194H109V213"/>
    <path d="M210 171V194H311V213"/>
    <path d="M109 273V305"/>
    <path d="M311 273V305"/>
  </g>
  <g stroke-width="1.2">
    <rect x="40" y="20" width="340" height="59" rx="10" fill="#fff" stroke="#b7c6d8"/>
    <rect x="40" y="111" width="340" height="60" rx="10" fill="#fff" stroke="#b7c6d8"/>
    <rect x="14" y="216" width="190" height="57" rx="10" fill="#e7f4ed" stroke="#74a68c"/>
    <rect x="216" y="216" width="190" height="57" rx="10" fill="#fff2e2" stroke="#bd925f"/>
    <rect x="14" y="308" width="190" height="52" rx="10" fill="#fff" stroke="#74a68c"/>
    <rect x="216" y="308" width="190" height="52" rx="10" fill="#fff" stroke="#bd925f"/>
  </g>
  <g fill="#172c43" font-family="system-ui, sans-serif" text-anchor="middle" font-size="15">
    <text x="210" y="43" font-weight="700">RestTestClient → Spring MVC アプリ</text>
    <text x="210" y="65">GET /products/{id}</text>
    <text x="210" y="135" font-weight="700">アプリの RestClient → 上流 API</text>
    <text x="210" y="157">GET /items/{id}</text>
    <text x="109" y="239" font-weight="700">ID 42 · 上流は 200</text>
    <text x="109" y="260">本文：Keyboard</text>
    <text x="311" y="239" font-weight="700">ID 99 · 上流は 404</text>
    <text x="311" y="260">RestClient が例外を送出</text>
    <text x="109" y="331" font-weight="700">アプリは 200 を返す</text>
    <text x="109" y="352">本文：Keyboard</text>
    <text x="311" y="331" font-weight="700" textLength="170" lengthAdjust="spacingAndGlyphs">例外を捕捉して 404 を返す</text>
    <text x="311" y="352">空の本文</text>
  </g>
</svg>
