<svg xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="420" height="382" viewBox="0 0 420 382" role="img" aria-labelledby="title desc">
  <title id="title">アカウントと作業内容で変わる Claude のモデル利用</title>
  <desc id="desc">有料プランでは Fable 5.2 を選択できます。Enterprise のリポジトリレビューには Claude Security を使います。Mythos の直接利用にはアカウントの承認が必要です。</desc>
  <rect width="420" height="382" rx="16" fill="#f6f5f1"/>
  <g fill="#fff" stroke="#c9c5bb">
    <rect x="18" y="16" width="384" height="49" rx="8"/>
    <rect x="44" y="84" width="358" height="80" rx="8"/>
    <rect x="44" y="178" width="358" height="80" rx="8"/>
    <rect x="44" y="272" width="358" height="91" rx="8"/>
  </g>
  <path d="M29 65V307 M29 123H44 M29 217H44 M29 307H44" fill="none" stroke="#8d7763" stroke-width="1.6"/>
  <g fill="#241e19" font-family="system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <text x="38" y="47" font-size="18" font-weight="700">どんな作業をしますか？</text>
    <text x="62" y="111" font-size="17" font-weight="700">有料プランで一般的な開発</text>
    <text x="62" y="140" font-size="16">モデル選択画面で Fable 5.2 を確認</text>
    <text x="62" y="205" font-size="17" font-weight="700" textLength="330" lengthAdjust="spacingAndGlyphs">Enterprise のリポジトリのセキュリティレビュー</text>
    <text x="62" y="234" font-size="16">有効なら Claude Security を利用</text>
    <text x="62" y="300" font-size="17" font-weight="700">Mythos モデルを直接利用</text>
    <text x="62" y="327" font-size="16">アカウント承認と利用経路を確認</text>
    <text x="62" y="349" font-size="14">例：Claude Code や Claude API</text>
  </g>
</svg>
