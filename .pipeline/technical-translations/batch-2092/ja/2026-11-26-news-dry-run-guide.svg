<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 440 246" role="img" aria-labelledby="title desc">
<title id="title">GitHub Actions でニュースの下書きを公開せずに検証する方法</title>
<desc id="desc">テスト入力を正常なプレビューと AI またはリンクのエラーに分け、成功時も失敗時も原稿と状態のディレクトリが作成されていないことを確認します。</desc>
<g stroke="#55787b" stroke-width="2" fill="none">
<path d="M220 52v17H110v17m-5 -5 5 5 5 -5m105 -17h110v17m-5 -5 5 5 5 -5"/>
<path d="M110 155v23h110v15m-5 -5 5 5 5 -5m105 -33v18H221"/>
</g>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#173d4a">
<rect x="15" y="7" width="410" height="45" rx="8" fill="#eaf3f5"/>
<text x="220" y="36" font-size="18">一時ディレクトリとテスト入力</text>
<rect x="4" y="89" width="213" height="66" rx="8" fill="#e1f3e7"/>
<text x="110" y="115" font-size="15">正常なプレビュー</text>
<text x="110" y="140" font-size="16">終了コード 0</text>
<rect x="223" y="89" width="213" height="66" rx="8" fill="#fbece2"/>
<text x="330" y="115" font-size="15">AI またはリンクのエラー</text>
<text x="330" y="140" font-size="16">終了コード 1</text>
<rect x="4" y="197" width="432" height="44" rx="8" fill="#eaf3f5"/>
<text x="220" y="225" font-size="16">原稿・状態ディレクトリの有無を確認</text>
</g>
</svg>
