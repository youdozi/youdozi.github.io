<svg xmlns="http://www.w3.org/2000/svg" xml:lang="es" viewBox="0 0 440 246" role="img" aria-labelledby="title desc">
<title id="title">Cómo validar borradores de noticias en GitHub Actions sin publicarlos</title>
<desc id="desc">La vista previa válida termina correctamente y un error de la IA o de un enlace provoca un fallo. En ambos casos se comprueba si se crearon los directorios de manuscritos y de estado.</desc>
<g stroke="#55787b" stroke-width="2" fill="none">
<path d="M220 52v17H110v17m-5 -5 5 5 5 -5m105 -17h110v17m-5 -5 5 5 5 -5"/>
<path d="M110 155v23h110v15m-5 -5 5 5 5 -5m105 -33v18H221"/>
</g>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#173d4a">
<rect x="15" y="7" width="410" height="45" rx="8" fill="#eaf3f5"/>
<text x="220" y="36" font-size="18">Directorio temporal y datos de prueba</text>
<rect x="4" y="89" width="213" height="66" rx="8" fill="#e1f3e7"/>
<text x="110" y="115" font-size="15">Vista previa válida</text>
<text x="110" y="140" font-size="16">Código de salida 0</text>
<rect x="223" y="89" width="213" height="66" rx="8" fill="#fbece2"/>
<text x="330" y="115" font-size="15">Error de IA o de enlace</text>
<text x="330" y="140" font-size="16">Código de salida 1</text>
<rect x="4" y="197" width="432" height="44" rx="8" fill="#eaf3f5"/>
<text x="220" y="225" font-size="16">Comprobar los directorios de manuscritos y estado</text>
</g>
</svg>
