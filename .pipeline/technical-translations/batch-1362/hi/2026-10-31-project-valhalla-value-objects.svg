<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">रिकॉर्ड की पहचान और समानता</title><desc id="description">साधारण रिकॉर्ड और वैल्यू रिकॉर्ड बनाएँ। क्रम से समानता, पहचान, रेफ़रेंस फ़ील्ड, सरणी के null स्लॉट और मॉनिटर की पाबंदी जाँचें।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">रिकॉर्ड की पहचान और समानता</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">दो साधारण रिकॉर्ड बनाएँ</text><text x="180" y="137" text-anchor="middle" font-size="16">दो समान वैल्यू रिकॉर्ड बनाएँ</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">== और equals() की तुलना करें</text><text x="180" y="263" text-anchor="middle" font-size="16">Objects.hasIdentity() जाँचें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">समान सामग्री की अलग स्ट्रिंग लें</text><text x="180" y="389" text-anchor="middle" font-size="16">Label पर == और equals() जाँचें</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">वैल्यू रिकॉर्ड की सरणी बनाएँ</text><text x="180" y="515" text-anchor="middle" font-size="16">पहला स्लॉट null है या नहीं देखें</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">Object के ज़रिए लॉक आज़माएँ</text><text x="180" y="641" text-anchor="middle" font-size="16">अपेक्षित IdentityException पकड़ें</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">व्यवहार की जाँच पूरी</text><text x="180" y="767" text-anchor="middle" font-size="16">लेआउट या प्रदर्शन का मापन नहीं हुआ</text></g></svg>
