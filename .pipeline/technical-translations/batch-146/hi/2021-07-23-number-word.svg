<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 609" width="420" height="609" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">अंग्रेज़ी शब्दों से अंक बनाना</title><desc id="description">zero से nine तक के शब्दों की जगह उनके अंक रखें। फिर दशमलव स्ट्रिंग को पूर्णांक में बदलें।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">अंग्रेज़ी शब्दों से अंक बनाना</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">इनपुट स्ट्रिंग से शुरू करें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">तय सूची के शब्द क्रम से लें</text><text x="180" y="263" text-anchor="middle" font-size="16">zero से nine तक</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">पूरे शब्द की जगह उसका अंक रखें</text><text x="180" y="389" text-anchor="middle" font-size="16">पहले से मौजूद अंक बने रहते हैं</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">दसों शब्दों पर यह करने के बाद</text><text x="180" y="515" text-anchor="middle" font-size="16">Integer.parseInt से int लौटाएँ</text></g></svg>
