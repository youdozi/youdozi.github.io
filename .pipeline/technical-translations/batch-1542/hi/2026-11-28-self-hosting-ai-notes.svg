<svg xmlns="http://www.w3.org/2000/svg" xml:lang="hi" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">सहेजा हुआ नोट पढ़ें</title><desc id="desc">स्थिति और खाली सूची देखें → सिर्फ़ खाली जगह वाला नोट अस्वीकार करें → पहला नोट सहेजें → प्रोसेस बंद करें → उसी डेटाबेस से फिर शुरू करें → सहेजा हुआ नोट पढ़ें।</desc>
<rect width="480" height="480" rx="18" fill="#f4f8fc"/>
<rect x="20" y="10" width="440" height="76" rx="12" fill="white" stroke="#648399"/><text x="240" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#193c4c">स्थिति और खाली सूची</text><text x="240" y="69" text-anchor="middle" font-family="monospace" font-size="18" fill="#21604b">GET /healthz · GET /notes → 200</text>
