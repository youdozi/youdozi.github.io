  <title id="title">Utiliser Orca Bot : créer un bot de blog et vérifier ses tâches et automatisations</title>
  <desc id="desc">Créez un bot et confiez-lui une première tâche. Vérifiez le résultat et décidez dans Needs you si nécessaire. Pour une tâche récurrente, définissez une heure ou un événement et consultez l&#x27;historique d&#x27;exécution.</desc>
