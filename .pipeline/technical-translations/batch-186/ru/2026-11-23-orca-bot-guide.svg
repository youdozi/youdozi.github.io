<svg xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="420" height="384" viewBox="0 0 420 384" role="img" aria-labelledby="title desc">
  <title id="title">Orca Bot: создание бота для блога и проверка задач и автоматизаций</title>
  <desc id="desc">Создайте бота и поручите ему первую задачу. Проверьте результат и при необходимости примите решение в Needs you. Для повторяющейся работы задайте время или событие и проверьте историю запусков.</desc>
