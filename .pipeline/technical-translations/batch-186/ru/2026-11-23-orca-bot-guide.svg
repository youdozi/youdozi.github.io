    <text font-size="16" x="210" y="110" font-weight="700">Отправить первую задачу</text>
    <text font-size="16" x="210" y="132">Заметка и формат результата</text>
    <text font-size="14" x="128" y="192" font-weight="700">Сверить ввод и результат</text>
