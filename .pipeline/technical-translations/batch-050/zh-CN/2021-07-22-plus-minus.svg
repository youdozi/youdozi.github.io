<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 609" width="420" height="609" role="img" aria-labelledby="title description" xml:lang="zh-CN"><title id="title">带符号数值求和</title><desc id="description">读取两个数组相同下标处的元素，应用对应符号，再对带符号的数值求和。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">带符号数值求和</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">生成下标</text><text x="180" y="137" text-anchor="middle" font-size="16">从 0 到 length - 1</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="251" text-anchor="middle" font-size="16">读取 absolutes[i] 和 signs[i]</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">true：保留绝对值</text><text x="180" y="389" text-anchor="middle" font-size="16">false：取绝对值的相反数</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">对转换后的各项求和</text><text x="180" y="515" text-anchor="middle" font-size="16">返回 int 结果</text></g></svg>
