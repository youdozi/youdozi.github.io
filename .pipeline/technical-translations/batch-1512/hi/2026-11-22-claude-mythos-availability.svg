<svg xml:lang="hi" xmlns="http://www.w3.org/2000/svg" width="420" height="382" viewBox="0 0 420 382" role="img" aria-labelledby="title desc">
  <title id="title">खाते और काम के अनुसार मॉडल की उपलब्धता</title>
  <desc id="desc">सामान्य काम के लिए Fable चुनें। Enterprise की समीक्षा के लिए Claude Security और Mythos के सीधे उपयोग के लिए खाते की अनुमति जाँचें।</desc>
  <rect width="420" height="382" rx="16" fill="#f6f5f1"/>
  <g fill="#fff" stroke="#c9c5bb">
    <rect x="18" y="16" width="384" height="49" rx="8"/>
    <rect x="44" y="84" width="358" height="80" rx="8"/>
    <rect x="44" y="178" width="358" height="80" rx="8"/>
    <rect x="44" y="272" width="358" height="91" rx="8"/>
  </g>
  <path d="M29 65V307 M29 123H44 M29 217H44 M29 307H44" fill="none" stroke="#8d7763" stroke-width="1.6"/>
  <g fill="#241e19" font-family="system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif">
    <text x="38" y="47" font-size="18" font-weight="700">आपका काम क्या है?</text>
    <text x="62" y="111" font-size="17" font-weight="700">सशुल्क खाते से कोड लिखना</text>
    <text x="62" y="140" font-size="16">मॉडल सूची में Fable 5.2 देखें</text>
    <text x="62" y="205" font-size="17" font-weight="700">कंपनी के कोड की सुरक्षा समीक्षा</text>
    <text x="62" y="234" font-size="16">सुविधा चालू हो तो Claude Security चुनें</text>
    <text x="62" y="300" font-size="17" font-weight="700">सीधे Mythos का उपयोग</text>
    <text x="62" y="327" font-size="16">खाते की मंज़ूरी और माध्यम जाँचें</text>
    <text x="62" y="349" font-size="14">जैसे Claude Code या Claude API</text>
  </g>
</svg>
