<svg xmlns="http://www.w3.org/2000/svg" xml:lang="hi" width="400" height="485" viewBox="0 0 400 485" role="img" aria-labelledby="title desc">
  <title id="title">NGINX में पैच की प्राथमिकता</title>
  <desc id="desc">वितरक के बिल्ड के लिए उसकी सूचना पढ़ें। NGINX के अपने बिल्ड में संस्करण और HTTP/2 की स्थिति देखकर पैच की प्राथमिकता तय करें।</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#4e7567"/>
    </marker>
  </defs>
  <rect width="400" height="485" rx="16" fill="#f4f8f6"/>
  <g fill="#fff" stroke="#afc9be">
    <rect x="96" y="20" width="208" height="58" rx="9"/>
    <rect x="20" y="118" width="172" height="64" rx="9"/>
    <rect x="208" y="118" width="172" height="64" rx="9"/>
    <rect x="208" y="224" width="172" height="64" rx="9"/>
    <rect x="20" y="224" width="172" height="64" rx="9"/>
    <rect x="20" y="331" width="360" height="130" rx="9" fill="#dcefe5"/>
  </g>
  <g fill="none" stroke="#4e7567" stroke-width="2" marker-end="url(#arrow)">
    <path d="M200 78V96H106V115"/>
    <path d="M200 78V96H294V115"/>
    <path d="M294 182V202H106V221"/>
    <path d="M294 182V221"/>
    <path d="M294 288V328"/>
  </g>
  <g fill="#193c31" font-family="system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">
    <text x="200" y="47" font-size="14">स्रोत और संस्करण</text>
    <text x="106" y="144">वितरक या अज्ञात</text>
    <text x="294" y="144">NGINX का बिल्ड</text>
    <text x="106" y="250">अन्य संस्करण</text>
    <text x="294" y="250">संभावित असर</text>
    <text x="200" y="358">HTTP/2 के अनुसार प्राथमिकता</text>
  </g>
  <g fill="#35584d" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
    <text x="200" y="65">HTTP/2 की स्थिति पहचानें</text>
    <text x="106" y="166">वितरक की सूचना पढ़ें</text>
    <text x="294" y="166">संस्करण की सीमा जाँचें</text>
    <text x="106" y="272">नतीजा दर्ज करें</text>
    <text x="294" y="272">संबंधित CVE चुनें</text>
    <text x="200" y="385">चालू → पैच पहले लगाएँ</text>
    <text x="200" y="409">बंद → पैच की योजना रखें</text>
    <text x="200" y="433">अज्ञात → स्थिति जाँचें और पैच लगाएँ</text>
  </g>
</svg>
