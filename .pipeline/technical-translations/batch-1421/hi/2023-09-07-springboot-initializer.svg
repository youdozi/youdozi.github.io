<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">प्रोजेक्ट बनाना और जाँचना</title><desc id="description">पूरा आर्काइव खोलकर उसका Wrapper चलाएँ। टेस्ट कॉन्टेक्स्ट और HTTP ऐप्लिकेशन का स्टार्टअप अलग जाँचें।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">प्रोजेक्ट बनाना और जाँचना</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">संगत Boot, JDK और Gradle चुनें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">पूरा आर्काइव बनाएँ और खोलें</text><text x="180" y="263" text-anchor="middle" font-size="16">Gradle Wrapper की फ़ाइलें रखें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">build.gradle और टूलचेन जाँचें</text><text x="180" y="389" text-anchor="middle" font-size="16">./gradlew --version चलाएँ</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">./gradlew test चलाएँ</text><text x="180" y="515" text-anchor="middle" font-size="16">कॉन्टेक्स्ट का स्टार्टअप जाँचें</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">bootRun अलग से चलाएँ</text><text x="180" y="641" text-anchor="middle" font-size="16">कंट्रोलर नहीं है: / पर 404 संभव है</text></g></svg>
