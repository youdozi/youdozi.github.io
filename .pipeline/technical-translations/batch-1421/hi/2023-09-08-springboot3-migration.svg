<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">Boot 3 माइग्रेशन की जाँच</title><desc id="description">मौजूदा बिल्ड से शुरू करके JDK, Jakarta, डिपेंडेंसी, प्रॉपर्टी और अनुमति जाँचें। फिर ऐप्लिकेशन के व्यवहार का परीक्षण करें।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Boot 3 माइग्रेशन की जाँच</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">2.7 पर सफल बिल्ड की पुष्टि करें</text><text x="180" y="137" text-anchor="middle" font-size="16">टेस्ट और रनटाइम सेटिंग दर्ज करें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">JDK और Gradle का निष्पादन जाँचें</text><text x="180" y="263" text-anchor="middle" font-size="16">Java 17 का परिवेश तैयार करें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">Java EE से Jakarta के बदलाव देखें</text><text x="180" y="389" text-anchor="middle" font-size="16">Java SE के javax API बनाए रखें</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">डिपेंडेंसी और प्रोसेसर के संस्करण मिलाएँ</text><text x="180" y="515" text-anchor="middle" font-size="16">कंपाइल करके क्वेरी चलाएँ</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">प्रॉपर्टी और सुरक्षा जाँचें</text><text x="180" y="641" text-anchor="middle" font-size="16">अस्थायी माइग्रेशन सहायक हटाएँ</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">ऐप्लिकेशन का व्यवहार जाँचें</text><text x="180" y="767" text-anchor="middle" font-size="16">फिर नए रनटाइम विकल्प परखें</text></g></svg>
