<svg xmlns="http://www.w3.org/2000/svg" xml:lang="hi" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">DroidDesk</title><desc id="desc">अलग APK अपने साथ आए Termux:X11 पर डेस्कटॉप दिखाता है। Termux स्क्रिप्ट इसके लिए अलग Termux:X11 ऐप या VNC का इस्तेमाल करती है।</desc>
<rect width="520" height="440" rx="16" fill="#edf4f7"/>
<g text-anchor="middle" font-family="system-ui, sans-serif">
<rect x="12" y="10" width="496" height="132" rx="10" fill="#fff"/>
<text x="260" y="39" font-weight="bold" font-size="23" fill="#18354a">बिना रूट वाला APK</text>
<text x="260" y="70" font-size="22" fill="#254e65">Termux (+ Debian / PRoot)</text>
<path d="M260 78 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#397386" stroke-width="2.5"/>
<text x="260" y="126" font-size="23" fill="#164959">ऐप का Termux:X11</text>
<rect x="12" y="150" width="496" height="132" rx="10" fill="#fff"/>
<text x="260" y="179" font-weight="bold" font-size="23" fill="#18354a">रूट वाला APK</text>
<text x="260" y="210" font-size="22" fill="#254e65">Ubuntu / chroot</text>
<path d="M260 218 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#397386" stroke-width="2.5"/>
<text x="260" y="266" font-size="23" fill="#164959">ऐप का Termux:X11</text>
<rect x="12" y="290" width="496" height="132" rx="10" fill="#fff"/>
<text x="260" y="319" font-weight="bold" font-size="23" fill="#18354a">Termux स्क्रिप्ट</text>
<text x="260" y="350" font-size="22" fill="#254e65">Termux + PRoot</text>
<path d="M260 358 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#397386" stroke-width="2.5"/>
<text x="260" y="406" font-size="23" fill="#164959">अलग Termux:X11 / VNC</text>
</g>
