<svg xmlns="http://www.w3.org/2000/svg" xml:lang="es" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">DroidDesk</title><desc id="desc">El APK independiente usa Termux:X11 integrado. El script de Termux muestra el escritorio mediante una aplicación Termux:X11 separada o por VNC.</desc>
<rect width="520" height="440" rx="16" fill="#edf4f7"/>
<g text-anchor="middle" font-family="system-ui, sans-serif">
<rect x="12" y="10" width="496" height="132" rx="10" fill="#fff"/>
<text x="260" y="39" font-weight="bold" font-size="23" fill="#18354a">APK sin root</text>
<text x="260" y="70" font-size="22" fill="#254e65">Termux (+ Debian / PRoot)</text>
<path d="M260 78 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#397386" stroke-width="2.5"/>
<text x="260" y="126" font-size="23" fill="#164959">Termux:X11 integrado</text>
<rect x="12" y="150" width="496" height="132" rx="10" fill="#fff"/>
<text x="260" y="179" font-weight="bold" font-size="23" fill="#18354a">APK con root</text>
<text x="260" y="210" font-size="22" fill="#254e65">Ubuntu / chroot</text>
<path d="M260 218 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#397386" stroke-width="2.5"/>
<text x="260" y="266" font-size="23" fill="#164959">Termux:X11 integrado</text>
<rect x="12" y="290" width="496" height="132" rx="10" fill="#fff"/>
<text x="260" y="319" font-weight="bold" font-size="23" fill="#18354a">Script de Termux</text>
<text x="260" y="350" font-size="22" fill="#254e65">Termux + PRoot</text>
<path d="M260 358 v18 m-5 -5 l5 5 5 -5" fill="none" stroke="#397386" stroke-width="2.5"/>
<text x="260" y="406" font-size="23" fill="#164959">Termux:X11 aparte / VNC</text>
</g>
</svg>
