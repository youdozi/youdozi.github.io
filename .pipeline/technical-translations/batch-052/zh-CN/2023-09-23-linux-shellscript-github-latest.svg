<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="zh-CN"><title id="title">选择一个 GitHub 发布资产</title><desc id="description">HTTP 失败会在解析 JSON 前终止脚本。有效的发布版本对象必须恰好包含一个匹配资产；选出其 URL 不等于验证下载的文件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">选择一个 GitHub 发布资产</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">校验 OWNER/REPO 参数</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">curl 保存 HTTP 响应</text><text x="180" y="263" text-anchor="middle" font-size="16">请求失败：以非零状态退出</text><path d="M 342 245 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="245" r="12" fill="#8c3a32"/><text x="384" y="251" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="278" text-anchor="middle" font-size="10">失败</text><text x="193" y="313" font-size="12">成功</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">要求一个 JSON 发布版本对象</text><text x="180" y="389" text-anchor="middle" font-size="16">检查非空标签和资产</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">匹配平台文件名</text><text x="180" y="515" text-anchor="middle" font-size="16">无匹配或多个匹配：报错停止</text><path d="M 342 497 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="497" r="12" fill="#8c3a32"/><text x="384" y="503" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="530" text-anchor="middle" font-size="10">无效</text><text x="193" y="565" font-size="12">一个匹配</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">输出标签和下载 URL</text><text x="180" y="641" text-anchor="middle" font-size="16">单独验证文件完整性</text></g></svg>
