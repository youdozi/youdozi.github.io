<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="ja"><title id="title">GitHub のリリース資産を選択</title><desc id="description">HTTP の失敗では JSON の解析前に停止します。有効なリリースオブジェクトには一致する資産がちょうど一つ必要です。その URL を選んでもダウンロードファイルの検証にはなりません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">GitHub のリリース資産を選択</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">OWNER/REPO 引数を検証</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">curl で HTTP レスポンスを保持</text><text x="180" y="263" text-anchor="middle" font-size="16">失敗時はゼロ以外で終了</text><path d="M 342 245 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="245" r="12" fill="#8c3a32"/><text x="384" y="251" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="278" text-anchor="middle" font-size="10">失敗</text><text x="193" y="313" font-size="12">成功</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">JSON リリースオブジェクトは一つ</text><text x="180" y="389" text-anchor="middle" font-size="16">空でないタグと資産を確認</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">プラットフォームのファイル名で照合</text><text x="180" y="515" text-anchor="middle" font-size="16">未一致や複数一致ならエラー終了</text><path d="M 342 497 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="497" r="12" fill="#8c3a32"/><text x="384" y="503" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="530" text-anchor="middle" font-size="10">不正</text><text x="193" y="565" font-size="12">一つ一致</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">タグとダウンロード URL を出力</text><text x="180" y="641" text-anchor="middle" font-size="16">ファイルの完全性は別途検証</text></g></svg>
