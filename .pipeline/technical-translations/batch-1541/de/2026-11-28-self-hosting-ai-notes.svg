<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">Gespeicherte Notiz lesen</title><desc id="desc">Status und leere Liste abrufen → leere Eingabe zurückweisen → erste Notiz speichern → Prozess beenden → mit derselben DB neu starten → gespeicherte Notiz lesen.</desc>
