<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1113" width="420" height="1113" role="img" aria-labelledby="title description" xml:lang="zh-CN"><title id="title">Kafka 组与重放</title><desc id="description">创建一次性 broker 和主题，发布两个事件，两组消费后直接重放，最后删容器。命令失败则停止清理。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Kafka 组与重放</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">启动一次性 broker</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="251" text-anchor="middle" font-size="16">尝试次数内 broker 就绪？</text><path d="M 342 245 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="245" r="12" fill="#8c3a32"/><text x="384" y="251" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="278" text-anchor="middle" font-size="10">失败并清理</text><text x="193" y="313" font-size="12">是</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="377" text-anchor="middle" font-size="16">创建单分区 orders.v1</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="503" text-anchor="middle" font-size="16">发布两个同键事件</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="629" text-anchor="middle" font-size="16">projection-v1 读两条记录</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="755" text-anchor="middle" font-size="16">audit-v1 读两条记录</text><path d="M 180 793 V 826" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="832" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="881" text-anchor="middle" font-size="16">分区 0 从偏移量 0 重放</text><path d="M 180 919 V 952" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="958" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="1007" text-anchor="middle" font-size="16">删除演示容器与数据</text></g></svg>
