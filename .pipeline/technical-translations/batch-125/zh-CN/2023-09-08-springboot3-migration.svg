<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="zh-CN"><title id="title">Boot 3 迁移检查</title><desc id="description">本文建议的迁移检查顺序。命令检查环境，不自动迁移应用或数据库。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Boot 3 迁移检查</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">建立通过测试的 2.7 基线</text><text x="180" y="137" text-anchor="middle" font-size="16">记录测试与运行设置</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">检查 JDK 与 Gradle 执行</text><text x="180" y="263" text-anchor="middle" font-size="16">准备 Java 17 基线</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">审查 Java EE → Jakarta</text><text x="180" y="389" text-anchor="middle" font-size="16">保留 Java SE javax API</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">对齐依赖与处理器</text><text x="180" y="515" text-anchor="middle" font-size="16">编译并执行查询</text><path d="M 180 541 V 5