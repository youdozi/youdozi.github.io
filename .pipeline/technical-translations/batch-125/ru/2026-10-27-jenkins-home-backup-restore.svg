<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="ru"><title id="title">Восстановление в другой том</title><desc id="description">Лаборатория восстанавливает архив и отдельный master.key, проверяя HTTP и выбранные файлы. Она не доказывает восстановление рабочих нагрузок и внешних систем.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Восстановление в другой том</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">Подготовить контроллер, остановить</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">Архив home без master.key</text><text x="180" y="263" text-anchor="middle" font-size="16">Ключ скопировать отдельно</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="377" text-anchor="middle" font-size="16">master.key исключён из архива?</text><path d="M 342 371 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="371" r="12" fill="#8c3a32"/><text x="384" y="377" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="404" text-anchor="middle" font-size="10">Нет: ошибка</text><text x="193" y="439" font-size="12">Да</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">Распаковать в новый том</text><text x="180" y="515" text-anchor="middle" font-size="16">Отдельно вернуть master.key</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="629" text-anchor="middle" font-size="16">HTTP, маркер и пароль совпали?</text><path d="M 342 623 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="623" r="12" fill="#8c3a32"/><text x="384" y="629" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="656" text-anchor="middle" font-size="10">Нет: ошибка</text><text x="193" y="691" font-size="12">Да</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">Сообщить ограниченный результат</text><text x="180" y="767" text-anchor="middle" font-size="16">Удалить данные и временные файлы</text></g></svg>
