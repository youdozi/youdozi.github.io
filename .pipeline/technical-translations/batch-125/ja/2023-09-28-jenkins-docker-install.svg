<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="ja"><title id="title">使い捨て Jenkins を確認</title><desc id="description">選んだ HTTP と volume の契約を調べ、実験資源を消します。設定完了や job 実行は対象外です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">使い捨て Jenkins を確認</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">image 取得と digest 解決</text><text x="180" y="137" text-anchor="middle" font-size="16">新しい名前付き home volume</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="251" text-anchor="middle" font-size="16">loopback host port で起動</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="377" text-anchor="middle" font-size="16">180s 以内に login HTTP が準備？</text><path d="M 342 371 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="371" r="12" fill="#8c3a32"/><text x="384" y="377" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="404" text-anchor="middle" font-size="10">いいえ：失敗</text><text x="193" y="439" font-size="12">はい</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">password を非出力で記録</text><text x="180" y="515" text-anchor="middle" font-size="16">marker を書き container 交換</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="629" text-anchor="middle" font-size="16">marker と password は同じ？</text><path d="M 342 623 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="623" r="12" fill="#8c3a32"/><text x="384" y="629" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="656" text-anchor="middle" font-size="10">いいえ：失敗</text><text x="193" y="691" font-size="12">はい</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">結果と digest を報告</text><text x="180" y="767" text-anchor="middle" font-size="16">自分の実験資源を全削除</text></g></svg>
