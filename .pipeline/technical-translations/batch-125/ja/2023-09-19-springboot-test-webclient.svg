<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="ja"><title id="title">HTTP 応答を検証</title><desc id="description">状態、media type の順で確認し、拒否本文を解放して JSON を decode します。StepVerifier は値と完了、エラーを確認します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">HTTP 応答を検証</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">local mock 応答を enqueue</text><text x="180" y="137" text-anchor="middle" font-size="16">client request を subscribe</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">HTTP error status？</text><text x="180" y="263" text-anchor="middle" font-size="16">はい：例外で停止</text><path d="M 342 245 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="245" r="12" fill="#8c3a32"/><text x="384" y="251" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="278" text-anchor="middle" font-size="10">はい</text><text x="193" y="313" font-size="12">いいえ</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="353" text-anchor="middle" font-size="16">application/json または</text><text x="180" y="377" text-anchor="middle" font-size="16">application/*+json？</text><text x="180" y="401" text-anchor="middle" font-size="16">その他：本文解放後 error</text><path d="M 342 371 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="371" r="12" fill="#8c3a32"/><text x="384" y="377" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="404" text-anchor="middle" font-size="10">その他</text><text x="193" y="439" font-size="12">JSON</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">対応型だけ Payload を decode</text><text x="180" y="515" text-anchor="middle" font-size="16">空や不正本文を確認</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">値と終了 signal を検証</text><text x="180" y="641" text-anchor="middle" font-size="16">method、path、Accept を確認</text></g></svg>
