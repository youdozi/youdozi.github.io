<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="ja"><title id="title">失敗した v5 を再実行</title><desc id="description">新規 schema の v5 再実行で v4 DB 移行ではありません。同 instance の失敗 Step を再実行し完了分は維持します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">失敗した v5 を再実行</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">新規 H2 Batch 5 schema</text><text x="180" y="137" text-anchor="middle" font-size="16">識別 job parameter を作る</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="251" text-anchor="middle" font-size="16">job 開始：step 1 が完了</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">step 2 が一度失敗</text><text x="180" y="389" text-anchor="middle" font-size="16">実行状態は FAILED</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">同じ parameter で開始</text><text x="180" y="515" text-anchor="middle" font-size="16">同 instance、新 execution</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">完了した step 1 を skip</text><text x="180" y="641" text-anchor="middle" font-size="16">step 2 再実行 → COMPLETED</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">step 回数 1 と 2 を確認</text><text x="180" y="767" text-anchor="middle" font-size="16">JVM 復旧の保証ではない</text></g></svg>
