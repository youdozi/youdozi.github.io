<svg xml:lang="zh-CN" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 410" role="img" aria-labelledby="title description">
  <title id="title">用 Ponytail Full 修正库存标签</title>
  <desc id="description">检查 stockLabel 的单数显示错误，复用 formatCount。测试 0、1、2 件时的标签，再确认结果。</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 6 3 0 6Z" fill="#527269"/>
    </marker>
  </defs>
  <rect width="400" height="410" rx="18" fill="#f3f7f5"/>
  <g fill="#fff" stroke="#b3c8bf">
    <rect x="28" y="20" width="344" height="60" rx="10"/>
    <rect x="28" y="98" width="344" height="60" rx="10"/>
    <rect x="28" y="176" width="344" height="60" rx="10"/>
    <rect x="28" y="254" width="344" height="60" rx="10"/>
    <rect x="28" y="332" width="344" height="58" rx="10" fill="#deeee6"/>
  </g>
  <g stroke="#527269" stroke-width="2" marker-end="url(#arrow)">
    <path d="M200 81v14"/>
    <path d="M200 159v14"/>
    <path d="M200 237v14"/>
    <path d="M200 315v14"/>
  </g>
  <g fill="#183b32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="650">
    <text x="200" y="46" font-size="16">收到库存标签修复请求</text>
    <text x="200" y="124" font-size="16">检查现有实现和测试</text>
    <text x="200" y="202" font-size="16">复用现有函数</text>
    <text x="200" y="280" font-size="16">运行回归测试</text>
    <text x="200" y="358" font-size="16">核对改动和测试结果</text>
  </g>
  <g fill="#35594e" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14">
    <text x="200" y="66">1 items → 1 item</text>
    <text x="200" y="144">stockLabel · formatCount</text>
    <text x="200" y="222">formatCount(count, 'item')</text>
    <text x="200" y="300">0 items · 1 item · 2 items</text>
    <text x="200" y="378">git diff · node --test</text>
  </g>
</svg>
