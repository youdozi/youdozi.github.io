<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="400" height="520" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">用浏览器验证咨询流程</title>
  <desc id="desc">用两种视口宽度打开介绍页面。检查是否有横向溢出，按 Tab 移到咨询链接，再按 Enter 验证是否打开咨询说明。三项均通过则输出该宽度的结果，失败则修正后重跑。</desc>
  <rect width="400" height="520" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="28" y="18" width="344" height="60" rx="9"/>
    <rect x="28" y="111" width="344" height="60" rx="9"/>
    <rect x="28" y="204" width="344" height="60" rx="9"/>
    <rect x="28" y="297" width="344" height="64" rx="9"/>
    <rect x="28" y="394" width="344" height="60" rx="9"/>
  </g>
  <path d="M200 78v29m-6-7 6 7 6-7M200 171v29m-6-7 6 7 6-7M200 264v29m-6-7 6 7 6-7M200 361v29m-6-7 6 7 6-7" fill="none" stroke="#397955" stroke-width="3"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="200" y="55">以 360px 和 1280px 打开页面</text>
    <text x="200" y="148">检查页面是否横向溢出</text>
    <text x="200" y="241">确认 Tab 能到达咨询链接</text>
    <text x="200" y="323" font-size="15">按 Enter 激活链接</text>
    <text x="200" y="346" font-size="15">检查 URL 片段和标题位置</text>
    <text x="200" y="430">按视口宽度输出 PASS</text>
    <text x="200" y="489">如果失败，修正后重新运行</text>
  </g>
</svg>
