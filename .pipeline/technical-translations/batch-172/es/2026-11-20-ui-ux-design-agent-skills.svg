<svg xmlns="http://www.w3.org/2000/svg" xml:lang="es" width="400" height="478" viewBox="0 0 400 478" role="img" aria-labelledby="title desc">
  <title id="title">Verificación del diálogo de cancelación</title>
  <desc id="desc">Al abrir el diálogo, el foco va a Conservar reserva. Escape o Conservar reserva mantienen el estado. Tab y Enter confirman y cambian el estado. En todos los casos se comprueba que el foco vuelva al botón al cerrar.</desc>
  <rect width="400" height="478" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="30" y="20" width="340" height="63" rx="10"/>
    <rect x="30" y="111" width="340" height="63" rx="10"/>
    <rect x="15" y="218" width="177" height="108" rx="10"/>
    <rect x="208" y="218" width="177" height="108" rx="10" fill="#f4e8d7"/>
    <rect x="30" y="376" width="340" height="66" rx="10"/>
  </g>
  <path d="M200 83v24m-5-6 5 6 5-6M200 174v19H103v21m-5-6 5 6 5-6M200 193h97v21m-5-6 5 6 5-6M103 326v24h97v22m-5-6 5 6 5-6M297 326v24h-97" fill="none" stroke="#397955" stroke-width="2.5"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="200" y="57">Abrir el diálogo desde la reserva</text>
    <text x="200" y="148">Foco inicial en Conservar reserva</text>
    <text x="103" y="250">Escape o Enter</text>
    <text x="103" y="273">en Conservar reserva</text>
    <text x="103" y="304">Reserva conservada</text>
    <text x="297" y="250">Tab hasta confirmar</text>
    <text x="297" y="273">Enter para cancelar</text>
    <text x="297" y="304">Reserva cancelada</text>
    <text x="200" y="403">Se cierra el diálogo</text>
    <text x="200" y="426">Foco al botón de apertura</text>
  </g>
</svg>
