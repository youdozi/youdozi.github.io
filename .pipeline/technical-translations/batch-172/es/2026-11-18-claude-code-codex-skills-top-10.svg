<svg xmlns="http://www.w3.org/2000/svg" xml:lang="es" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc">
  <title id="title">Una habilidad en dos agentes de programación</title>
  <desc id="desc">Crea un directorio de práctica y el archivo original de la habilidad. Cópialo a las rutas de Claude Code y Codex, compara con cmp y comprueba ambos resultados con la misma entrada.</desc>
  <rect width="400" height="550" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="34" y="18" width="332" height="62" rx="10"/>
    <rect x="34" y="116" width="332" height="62" rx="10"/>
    <rect x="34" y="214" width="332" height="82" rx="10"/>
    <rect x="34" y="332" width="332" height="62" rx="10"/>
    <rect x="34" y="430" width="332" height="84" rx="10"/>
  </g>
  <path d="M200 80v32m-6-7 6 7 6-7M200 178v32m-6-7 6 7 6-7M200 296v32m-6-7 6 7 6-7M200 394v32m-6-7 6 7 6-7" fill="none" stroke="#397955" stroke-width="3"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="200" y="56">Crear un directorio de práctica</text>
    <text x="200" y="154">Redactar la habilidad de notas</text>
    <text x="200" y="242">Copiar a ambas rutas de proyecto</text>
    <text x="200" y="272">.claude/skills · .agents/skills</text>
    <text x="200" y="370">Comparar las copias con cmp</text>
    <text x="200" y="460">Dar los mismos datos a ambos</text>
    <text x="200" y="489">Distinguir lo verificado y lo pendiente</text>
  </g>
</svg>
