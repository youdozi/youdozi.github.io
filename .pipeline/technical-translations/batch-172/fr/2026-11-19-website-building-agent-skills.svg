<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" width="400" height="520" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">Vérifier le parcours de contact dans le navigateur</title>
  <desc id="desc">Ouvrir la page à chacune des deux largeurs. Vérifier les débordements, atteindre le lien avec Tab, puis ouvrir la section de consultation avec Entrée. Si les trois vérifications passent, afficher le résultat pour la largeur testée. En cas d’échec, corriger et relancer.</desc>
  <rect width="400" height="520" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="28" y="18" width="344" height="60" rx="9"/>
    <rect x="28" y="111" width="344" height="60" rx="9"/>
    <rect x="28" y="204" width="344" height="60" rx="9"/>
    <rect x="28" y="297" width="344" height="64" rx="9"/>
    <rect x="28" y="394" width="344" height="60" rx="9"/>
  </g>
  <path d="M200 78v29m-6-7 6 7 6-7M200 171v29m-6-7 6 7 6-7M200 264v29m-6-7 6 7 6-7M200 361v29m-6-7 6 7 6-7" fill="none" stroke="#397955" stroke-width="3"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="200" y="55">Ouvrir la page à 360px et 1280px</text>
    <text x="200" y="148">Vérifier le débordement horizontal</text>
    <text x="200" y="241">Tab jusqu’au lien de contact</text>
    <text x="200" y="323">Ouvrir le lien avec Entrée</text>
    <text x="200" y="346">Vérifier le fragment d’URL et le titre</text>
    <text x="200" y="430">Afficher PASS pour chaque largeur</text>
    <text x="200" y="489">En cas d’échec, corriger et retester</text>
  </g>
</svg>
