<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" width="400" height="478" viewBox="0 0 400 478" role="img" aria-labelledby="title desc">
  <title id="title">Vérifier la confirmation d’annulation</title>
  <desc id="desc">Ouvrir la boîte dans le détail de la réservation place le focus sur « Conserver la réservation ». Échap ou ce bouton conserve la réservation. Tab puis Entrée confirme l’annulation. Dans chaque cas, vérifier le retour du focus après fermeture.</desc>
  <rect width="400" height="478" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="30" y="20" width="340" height="63" rx="10"/>
    <rect x="30" y="111" width="340" height="63" rx="10"/>
    <rect x="15" y="218" width="177" height="108" rx="10"/>
    <rect x="208" y="218" width="177" height="108" rx="10" fill="#f4e8d7"/>
    <rect x="30" y="376" width="340" height="66" rx="10"/>
  </g>
  <path d="M200 83v24m-5-6 5 6 5-6M200 174v19H103v21m-5-6 5 6 5-6M200 193h97v21m-5-6 5 6 5-6M103 326v24h97v22m-5-6 5 6 5-6M297 326v24h-97" fill="none" stroke="#397955" stroke-width="2.5"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="200" y="57">Ouvrir la boîte de confirmation</text>
    <text x="200" y="148">Focus sur « Conserver la réservation » ?</text>
    <text x="103" y="250">Échap ou Entrée</text>
    <text x="103" y="273">sur « Conserver »</text>
    <text x="103" y="304">Réservation active</text>
    <text x="297" y="250" font-size="15">Tab vers la confirmation</text>
    <text x="297" y="273">Entrée pour annuler</text>
    <text x="297" y="304">Réservation annulée</text>
    <text x="200" y="403">Boîte fermée</text>
    <text x="200" y="426">Retour aux options d’annulation</text>
  </g>
</svg>
