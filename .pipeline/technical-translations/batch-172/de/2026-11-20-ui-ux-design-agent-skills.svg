<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" width="400" height="478" viewBox="0 0 400 478" role="img" aria-labelledby="title desc">
  <title id="title">Prüfablauf für den Stornierungsdialog</title>
  <desc id="desc">Der Dialog in den Buchungsdetails setzt den Fokus auf „Buchung behalten“. Escape oder diese Schaltfläche lässt die Buchung bestehen. Tab und Enter bestätigen die Stornierung. Nach dem Schließen wird in jedem Fall die Rückkehr des Fokus geprüft.</desc>
  <rect width="400" height="478" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="30" y="20" width="340" height="63" rx="10"/>
    <rect x="30" y="111" width="340" height="63" rx="10"/>
    <rect x="15" y="218" width="177" height="108" rx="10"/>
    <rect x="208" y="218" width="177" height="108" rx="10" fill="#f4e8d7"/>
    <rect x="30" y="376" width="340" height="66" rx="10"/>
  </g>
  <path d="M200 83v24m-5-6 5 6 5-6M200 174v19H103v21m-5-6 5 6 5-6M200 193h97v21m-5-6 5 6 5-6M103 326v24h97v22m-5-6 5 6 5-6M297 326v24h-97" fill="none" stroke="#397955" stroke-width="2.5"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="200" y="57">Dialog in Buchungsdetails öffnen</text>
    <text x="200" y="148">Startfokus auf „Buchung behalten“?</text>
    <text x="103" y="250">Escape oder Enter</text>
    <text x="103" y="273" font-size="15">auf „Buchung behalten“</text>
    <text x="103" y="304">Buchung aktiv</text>
    <text x="297" y="250" font-size="15">Mit Tab zur Bestätigung</text>
    <text x="297" y="273">Mit Enter stornieren</text>
    <text x="297" y="304">Buchung storniert</text>
    <text x="200" y="403">Dialog geschlossen</text>
    <text x="200" y="426">Fokus zurück zu „Stornooptionen öffnen“</text>
  </g>
</svg>
