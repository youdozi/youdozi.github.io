<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc">
  <title id="title">Einen Skill in zwei Programmieragenten verwenden</title>
  <desc id="desc">Übungsverzeichnis erstellen und die Skill-Datei schreiben. In die Projektpfade von Claude Code und Codex kopieren, mit cmp vergleichen und die Ergebnisse mit derselben Eingabe prüfen.</desc>
  <rect width="400" height="550" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="34" y="18" width="332" height="62" rx="10"/>
    <rect x="34" y="116" width="332" height="62" rx="10"/>
    <rect x="34" y="214" width="332" height="82" rx="10"/>
    <rect x="34" y="332" width="332" height="62" rx="10"/>
    <rect x="34" y="430" width="332" height="84" rx="10"/>
  </g>
  <path d="M200 80v32m-6-7 6 7 6-7M200 178v32m-6-7 6 7 6-7M200 296v32m-6-7 6 7 6-7M200 394v32m-6-7 6 7 6-7" fill="none" stroke="#397955" stroke-width="3"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="200" y="56">Übungsverzeichnis erstellen</text>
    <text x="200" y="154">Release-Notes-Skill schreiben</text>
    <text x="200" y="242">In beide Projektpfade kopieren</text>
    <text x="200" y="272">.claude/skills · .agents/skills</text>
    <text x="200" y="370">Kopien mit cmp vergleichen</text>
    <text x="200" y="460">Beiden Tools dieselben Daten geben</text>
    <text x="200" y="489">Erledigte und offene Tests trennen</text>
  </g>
</svg>
