<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ru" width="400" height="520" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">Проверка пути к контактам в браузере</title>
  <desc id="desc">Откройте страницу при двух значениях ширины. Проверьте переполнение, дойдите до ссылки клавишей Tab и проверьте открытие блока по Enter. Если условия выполнены, выведите результат для этой ширины. При сбое исправьте условие и повторите тест.</desc>
  <rect width="400" height="520" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="28" y="18" width="344" height="60" rx="9"/>
    <rect x="28" y="111" width="344" height="60" rx="9"/>
    <rect x="28" y="204" width="344" height="60" rx="9"/>
    <rect x="28" y="297" width="344" height="64" rx="9"/>
    <rect x="28" y="394" width="344" height="60" rx="9"/>
  </g>
  <path d="M200 78v29m-6-7 6 7 6-7M200 171v29m-6-7 6 7 6-7M200 264v29m-6-7 6 7 6-7M200 361v29m-6-7 6 7 6-7" fill="none" stroke="#397955" stroke-width="3"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="200" y="55">Открыть на 360px и 1280px</text>
    <text x="200" y="148">Проверить переполнение по ширине</text>
    <text x="200" y="241">Дойти до ссылки клавишей Tab</text>
    <text x="200" y="323">Перейти по ссылке клавишей Enter</text>
    <text x="200" y="346">Проверить якорь и заголовок</text>
    <text x="200" y="430">Вывести PASS для каждой ширины</text>
    <text x="200" y="489">При сбое исправить и повторить</text>
  </g>
</svg>
