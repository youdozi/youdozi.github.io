<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ru" width="400" height="478" viewBox="0 0 400 478" role="img" aria-labelledby="title desc">
  <title id="title">Проверка диалога отмены брони</title>
  <desc id="desc">После открытия диалога фокус переходит на сохранение брони. Escape или сохранение оставляют состояние прежним, а Tab и Enter подтверждают отмену и меняют состояние. В каждой ветке проверьте возврат фокуса на кнопку при закрытии.</desc>
  <rect width="400" height="478" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="30" y="20" width="340" height="63" rx="10"/>
    <rect x="30" y="111" width="340" height="63" rx="10"/>
    <rect x="15" y="218" width="177" height="108" rx="10"/>
    <rect x="208" y="218" width="177" height="108" rx="10" fill="#f4e8d7"/>
    <rect x="30" y="376" width="340" height="66" rx="10"/>
  </g>
  <path d="M200 83v24m-5-6 5 6 5-6M200 174v19H103v21m-5-6 5 6 5-6M200 193h97v21m-5-6 5 6 5-6M103 326v24h97v22m-5-6 5 6 5-6M297 326v24h-97" fill="none" stroke="#397955" stroke-width="2.5"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="200" y="57">Открыть диалог из деталей брони</text>
    <text x="200" y="148">Начальный фокус на сохранении</text>
    <text x="103" y="250">Escape или Enter</text>
    <text x="103" y="273">на сохранении</text>
    <text x="103" y="304">Бронь сохранена</text>
    <text x="297" y="250">Tab к кнопке отмены</text>
    <text x="297" y="273">Enter для отмены</text>
    <text x="297" y="304">Бронь отменена</text>
    <text x="200" y="403">Диалог закрыт</text>
    <text x="200" y="426">Фокус на кнопке открытия</text>
  </g>
</svg>
