<svg xmlns="http://www.w3.org/2000/svg" xml:lang="hi" viewBox="0 0 440 410" role="img" aria-labelledby="title desc"><title id="title">नाम का पता ढूँढें</title><desc id="desc">नाम का पता ढूँढें → HTTP पोर्ट तक पहुँचें → Nginx होस्ट चुनें → ऐप का जवाब जाँचें → HTTPS और नवीनीकरण जाँचें</desc>
<rect width="440" height="410" rx="14" fill="#ecf4f5"/>
<rect x="12" y="4" width="416" height="62" rx="10" fill="#fff" stroke="#7d9ca4"/>
<text x="220" y="29" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#193c4c">नाम का पता ढूँढें</text>
<text x="220" y="54" text-anchor="middle" font-family="monospace" font-size="16" fill="#205b50">A · AAAA</text>
<path d="M220 67v16m-5 -5 5 5 5 -5" stroke="#456972" stroke-width="2" fill="none"/>
<rect x="12" y="86" width="416" height="62" rx="10" fill="#fff" stroke="#7d9ca4"/>
<text x="220" y="111" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#193c4c">HTTP पोर्ट तक पहुँचें</text>
<text x="220" y="136" text-anchor="middle" font-family="monospace" font-size="16" fill="#205b50">TCP 80</text>
<path d="M220 149v16m-5 -5 5 5 5 -5" stroke="#456972" stroke-width="2" fill="none"/>
<rect x="12" y="168" width="416" height="62" rx="10" fill="#fff" stroke="#7d9ca4"/>
<text x="220" y="193" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#193c4c">Nginx होस्ट चुनें</text>
<text x="220" y="218" text-anchor="middle" font-family="monospace" font-size="16" fill="#205b50">server_name</text>
<path d="M220 231v16m-5 -5 5 5 5 -5" stroke="#456972" stroke-width="2" fill="none"/>
<rect x="12" y="250" width="416" height="62" rx="10" fill="#fff" stroke="#7d9ca4"/>
<text x="220" y="275" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#193c4c">ऐप का जवाब जाँचें</text>
<text x="220" y="300" text-anchor="middle" font-family="monospace" font-size="16" fill="#205b50">127.0.0.1:8080</text>
<path d="M220 313v16m-5 -5 5 5 5 -5" stroke="#456972" stroke-width="2" fill="none"/>
<rect x="12" y="332" width="416" height="62" rx="10" fill="#fff" stroke="#7d9ca4"/>
<text x="220" y="357" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#193c4c">HTTPS और नवीनीकरण जाँचें</text>
<text x="220" y="382" text-anchor="middle" font-family="monospace" font-size="16" fill="#205b50">TCP 443 · renew --dry-run</text>
</svg>
