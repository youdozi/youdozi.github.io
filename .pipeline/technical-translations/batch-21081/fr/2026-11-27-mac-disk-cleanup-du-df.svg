<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" viewBox="0 0 440 308" role="img" aria-labelledby="title description">
  <title id="title">Espace occupé par répertoire · Espace libre du volume de données</title>
  <desc id="description">Mesure des répertoires retenus et comparaison de l’espace disponible sur le volume de données avant et après nettoyage</desc>
  <rect x="6" y="8" width="428" height="82" rx="10" fill="#f2f6fa" stroke="#577186"/>
  <text x="220" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#17384e">Espace occupé par répertoire</text>
  <text x="220" y="70" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#153c52">du -sh</text>
  <path d="M220 92v16m-5 -5 5 5 5 -5" fill="none" stroke="#466a80" stroke-width="2"/>
  <rect x="6" y="112" width="428" height="82" rx="10" fill="#f2f6fa" stroke="#577186"/>
  <text x="220" y="144" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#17384e">Régénérable et inutilisé</text>
  <text x="220" y="174" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#153c52">20 répertoires retenus · 1,61 GiB</text>
  <path d="M220 196v16m-5 -5 5 5 5 -5" fill="none" stroke="#466a80" stroke-width="2"/>
  <rect x="6" y="216" width="428" height="82" rx="10" fill="#f2f6fa" stroke="#577186"/>
  <text x="220" y="248" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#17384e">Espace libre du volume de données</text>
  <text x="220" y="278" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#153c52">df -h   ·   6,41 → 7,46 GiB</text>
</svg>
