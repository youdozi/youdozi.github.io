<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" viewBox="0 0 400 308" role="img" aria-labelledby="title desc"><title id="title">Eine Notiz speichern und nach dem Deployment lesen</title><desc id="desc">Token und Text prüfen → Notiz speichern → Mit derselben DB neu deployen → Neueste Notizen lesen</desc>
<rect x="5" y="4" width="390" height="60" rx="9" fill="#f0f5f2" stroke="#728e80"/>
<text x="200" y="29" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#214037">Token und Text prüfen</text>
<text x="200" y="52" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#214037">POST /api/notes · 401 / 400</text>
<path d="M200 64v16m-5 -5 5 5 5 -5" stroke="#416453" stroke-width="2" fill="none"/>
<rect x="5" y="84" width="390" height="60" rx="9" fill="#f0f5f2" stroke="#728e80"/>
<text x="200" y="109" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#214037">Notiz speichern</text>
