<text x="200" y="212" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#214037">Wrangler → Pages Functions</text>
<path d="M200 224v16m-5 -5 5 5 5 -5" stroke="#416453" stroke-width="2" fill="none"/>
<rect x="5" y="244" width="390" height="60" rx="9" fill="#f0f5f2" stroke="#728e80"/>
<text x="200" y="269" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#214037">Neueste Notizen lesen</text>
<text x="200" y="292" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#214037">GET /api/notes · SELECT → 200</text>
