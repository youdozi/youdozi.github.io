<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" viewBox="0 0 640 440" role="img">
<title>客户端请求</title>
<desc>客户端请求 → SSH 本地转发 → Mac 回环 HTTP → 测试文件响应</desc>
<rect width="640" height="440" rx="24" fill="#f5f8fc"/>
<rect x="55" y="20" width="530" height="65" rx="12" fill="#e0ecfa" stroke="#295981" stroke-width="2"/>
<text x="320" y="61" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#153651">客户端请求</text>
<path d="M320 85 v25 m-8 -8 8 8 8 -8" fill="none" stroke="#295981" stroke-width="3"/>
<rect x="55" y="125" width="530" height="65" rx="12" fill="#e0ecfa" stroke="#295981" stroke-width="2"/>
<text x="320" y="166" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#153651">SSH 本地转发</text>
<path d="M320 190 v25 m-8 -8 8 8 8 -8" fill="none" stroke="#295981" stroke-width="3"/>
<rect x="55" y="230" width="530" height="65" rx="12" fill="#e0ecfa" stroke="#295981" stroke-width="2"/>
<text x="320" y="271" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#153651">Mac 回环 HTTP</text>
<path d="M320 295 v25 m-8 -8 8 8 8 -8" fill="none" stroke="#295981" stroke-width="3"/>
<rect x="55" y="335" width="530" height="65" rx="12" fill="#e0ecfa" stroke="#295981" stroke-width="2"/>
<text x="320" y="376" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#153651">测试文件响应</text>
</svg>
