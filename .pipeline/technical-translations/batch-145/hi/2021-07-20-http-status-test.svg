<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">स्थानीय HTTP जवाब का चयन</title><desc id="description">सर्वर रूट से स्टेटस और फ़ॉर्मैट चुनता है। 204 पर बॉडी और Content-Length नहीं भेजता। बाकी रूट में घोषित बाइट लिखता है।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">स्थानीय HTTP जवाब का चयन</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">स्थानीय GET अनुरोध पढ़ें</text><text x="180" y="137" text-anchor="middle" font-size="16">समर्थित रूट चुनें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">पथ या स्टेटस अज्ञात है?</text><text x="180" y="263" text-anchor="middle" font-size="16">JSON में 404 लौटाएँ</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">204 पर हेडर पूरे करें</text><text x="180" y="389" text-anchor="middle" font-size="16">बॉडी और Content-Length न भेजें</text><path d="M 342 371 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="371" r="12" fill="#2b6044"/><text x="384" y="377" text-anchor="middle" font-size="19" fill="white">✓</text><text x="384" y="404" text-anchor="middle" font-size="10">204</text><text x="193" y="439" font-size="12">अन्य</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">अन्य रूट पर JSON या HTML चुनें</text><text x="180" y="515" text-anchor="middle" font-size="16">मीडिया टाइप और बाइट संख्या तय करें</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">हेडर और बॉडी लिखें</text><text x="180" y="641" text-anchor="middle" font-size="16">हर जवाब अलग से जाँचें</text></g></svg>
