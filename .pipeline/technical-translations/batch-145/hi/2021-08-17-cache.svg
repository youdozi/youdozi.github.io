<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">LRU कैश में ऐक्सेस का क्रम</title><desc id="description">क्षमता शून्य हो तो तुरंत लागत लौटाएँ। अन्यथा get और put से क्रम बदलें। क्षमता पार हो तो सबसे लंबे समय से इस्तेमाल न हुई कुंजी हटाएँ।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">LRU कैश में ऐक्सेस का क्रम</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">क्षमता 0 हो: 5 × अनुरोध लौटाएँ</text><text x="180" y="137" text-anchor="middle" font-size="16">अन्यथा तीर के साथ आगे बढ़ें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">ऐक्सेस क्रम वाला मैप बनाएँ</text><text x="180" y="263" text-anchor="middle" font-size="16">cost = 0 रखें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">अगला शहर पढ़ें</text><text x="180" y="389" text-anchor="middle" font-size="16">Locale.ROOT से छोटे अक्षर बनाएँ</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="479" text-anchor="middle" font-size="16">get(key): हिट पर +1</text><text x="180" y="503" text-anchor="middle" font-size="16">मिस पर +5</text><text x="180" y="527" text-anchor="middle" font-size="16">put(key): सबसे हाल का ऐक्सेस</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">क्षमता पार? पहली कुंजी हटाएँ</text><text x="180" y="641" text-anchor="middle" font-size="16">अन्यथा सभी कुंजियाँ रखें</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">और शहर बचे हैं?</text><text x="180" y="767" text-anchor="middle" font-size="16">हाँ: दोहराएँ। नहीं: लागत लौटाएँ</text><path d="M 342 749 H 386 V 371 H 342" fill="none" stroke="#2b6044" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="389" y="560" font-size="13">हाँ</text></g></svg>
