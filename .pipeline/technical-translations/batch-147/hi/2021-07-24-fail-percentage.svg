<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">चरणों की विफलता दर</title><desc id="description">रुके खिलाड़ियों को घटाने से पहले पहुँचे खिलाड़ियों की संख्या सहेजें। long में तिरछा गुणा करके दरों की तुलना करें और बराबरी पर चरण क्रमांक देखें।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">चरणों की विफलता दर</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">हर चरण पर रुके खिलाड़ी गिनें</text><text x="180" y="137" text-anchor="middle" font-size="16">N + 1 तक पहुँचे खिलाड़ियों को भी गिनें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">remaining = कुल खिलाड़ी</text><text x="180" y="263" text-anchor="middle" font-size="16">चरण 1 से N तक लें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">reached में remaining सहेजें</text><text x="180" y="389" text-anchor="middle" font-size="16">फिर रुके खिलाड़ियों की संख्या घटाएँ</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">कोई नहीं पहुँचा तो दर शून्य है</text><text x="180" y="515" text-anchor="middle" font-size="16">तुलना में हर 1 लें</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="605" text-anchor="middle" font-size="16">long में तिरछे गुणा से तुलना करें</text><text x="180" y="629" text-anchor="middle" font-size="16">पहले दर के घटते क्रम में रखें</text><text x="180" y="653" text-anchor="middle" font-size="16">बराबरी पर क्रमांक बढ़ते क्रम में रखें</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="755" text-anchor="middle" font-size="16">चरणों के क्रमांक इसी क्रम में लौटाएँ</text></g></svg>
