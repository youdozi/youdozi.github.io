<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">दो क्वेरी के व्यवहार की तुलना</title><desc id="description">एक ही डेटा पर दोनों कार्यान्वयनों के परिणाम अलग-अलग अपेक्षित सूची से मिलाएँ। टूल बदलने का निर्णय लेने के लिए एप्लिकेशन की अपनी क्वेरी भी जाँचें।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">दो क्वेरी के व्यवहार की तुलना</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">H2 में पाँच पंक्तियाँ डालें</text><text x="180" y="137" text-anchor="middle" font-size="16">दोहराए गए नाम और null शामिल करें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">Querydsl और Criteria फ़िल्टर बनाएँ</text><text x="180" y="263" text-anchor="middle" font-size="16">बराबरी और null के नियम तय करें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">दोनों परिणाम नाम से क्रमबद्ध करें</text><text x="180" y="389" text-anchor="middle" font-size="16">हर परिणाम अपेक्षित सूची से मिलाएँ</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">व्यवहार की आठ जाँचें चलाएँ</text><text x="180" y="515" text-anchor="middle" font-size="16">clean के बाद Q प्रकार फिर बनाएँ</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">एप्लिकेशन की असली क्वेरी परखें</text><text x="180" y="641" text-anchor="middle" font-size="16">केवल इन जाँचों से निर्णय नहीं होता</text></g></svg>
