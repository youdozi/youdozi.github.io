<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="ja"><title id="title">リクエストのバインドと復元</title><desc id="description">仮想スレッドのhandleRequestに沿って、入れ子の正常終了と例外終了で外側のバインディングを復元します。通常の子には継承しません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">リクエストのバインドと復元</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">仮想スレッドでリクエスト開始</text><text x="180" y="137" text-anchor="middle" font-size="16">CONTEXTが未バインドと確認</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">call()：tenant-a / trace-123をバインド</text><text x="180" y="263" text-anchor="middle" font-size="16">service()でコンテキストを読む</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">入れ子のrun()：tenant-bを読む</text><text x="180" y="389" text-anchor="middle" font-size="16">戻るとtenant-aを確認</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="479" text-anchor="middle" font-size="16">入れ子のrun()：例外を投げる</text><text x="180" y="503" text-anchor="middle" font-size="16">外側で捕捉し、</text><text x="180" y="527" text-anchor="middle" font-size="16">tenant-aの復元を確認</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">通常の仮想子スレッドを起動</text><text x="180" y="641" text-anchor="middle" font-size="16">未バインドと確認しjoinする</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">外側のcall()から戻る</text><text x="180" y="767" text-anchor="middle" font-size="16">未バインドとなりget()は例外</text></g></svg>
