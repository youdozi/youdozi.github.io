<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="de"><title id="title">Anfragekontext und Wiederherstellung</title><desc id="description">Folgt handleRequest im virtuellen Thread; normale und außergewöhnliche verschachtelte Ausstiege stellen die äußere Bindung wieder her. Ein gewöhnlicher Kind-Thread erbt sie nicht.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Anfragekontext und Wiederherstellung</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">Anfrage im virtuellen Thread starten</text><text x="180" y="137" text-anchor="middle" font-size="16">CONTEXT ist ungebunden</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">call(): tenant-a / trace-123 binden</text><text x="180" y="263" text-anchor="middle" font-size="16">Kontext in service() lesen</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">Verschachteltes run(): tenant-b lesen</text><text x="180" y="389" text-anchor="middle" font-size="16">Rückkehr: tenant-a beobachten</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">Verschachteltes run(): Ausnahme</text><text x="180" y="515" text-anchor="middle" font-size="16">Außen abfangen; tenant-a wieder da</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="605" text-anchor="middle" font-size="16">Einfachen virtuellen</text><text x="180" y="629" text-anchor="middle" font-size="16">Kind-Thread starten</text><text x="180" y="653" text-anchor="middle" font-size="16">Ungebunden; auf Kind warten</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">Äußeres call() verlassen</text><text x="180" y="767" text-anchor="middle" font-size="16">Ungebunden; get() wirft Ausnahme</text></g></svg>
