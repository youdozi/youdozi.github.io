<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1070" viewBox="0 0 640 1070" role="img" aria-labelledby="title desc" xml:lang="de">
<title id="title">Referenzaufbau einer API mit 10000 RPS</title><desc id="desc">Edge und Loadbalancer verteilen auf zustandslose API-Replikate über mehrere Zonen. Anfragezulassung sowie Cache-, Datenbank- und externe Dienstparallelität sind begrenzt. Eine optionale DB-Outbox speist Warteschlange und idempotente Worker.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2d654c"/></marker></defs><rect width="640" height="1070" fill="#f7f7f2"/>
<g stroke="#2d654c" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M320 155V195"/><path d="M320 280V320"/><path d="M90 430V525H170"/><path d="M90 525V655H170"/><path d="M90 655V785H170"/><path d="M385 700H620V870H320V910" stroke-dasharray="8 7"/></g>
<rect x="40" y="60" width="560" height="95" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="91.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">CDN / WAF / Ratenlimits pro Client</text>
<text x="320.0" y="123.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Edge-Cache nur für geeignete öffentliche Antworten</text>
<rect x="40" y="195" width="560" height="85" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="221.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Loadbalancer</text>
<text x="320.0" y="253.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Zustandsprüfungen / zonenbewusste Verteilung</text>
<rect x="40" y="320" width="560" height="110" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="343.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Zustandslose JDK-API-Replikate</text>
<text x="320.0" y="375.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Mehrere Zonen / Anfragezulassung</text>
<text x="320.0" y="407.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Virtuelle Threads / Anfragefristen</text>
<rect x="170" y="480" width="430" height="90" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="385.0" y="509.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Lesecache (optional)</text>
<text x="385.0" y="541.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Trefferquote / TTL / Miss-Bündelung</text>
<rect x="170" y="610" width="430" height="90" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="385.0" y="639.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">DB-Pools / Lese- und Schreibpfade</text>
<text x="385.0" y="671.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="21">Gesamtverbindungsbudget / Abfragezeitlimit</text>
<rect x="170" y="740" width="430" height="90" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="385.0" y="769.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Parallelitätsgrenzen pro Abhängigkeit</text>
<text x="385.0" y="801.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Fristen / Wiederholungsbudgets</text>
<rect x="40" y="910" width="560" height="100" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="944.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">DB-Outbox → Queue → Worker (optional)</text>
<text x="320.0" y="976.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Zustellung nach Commit / Replay / Idempotenz</text>
<text x="320" y="1044" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#35443a">Referenzentwurf: Instanzen und Grenzen mit Lasttests dimensionieren</text></svg>
