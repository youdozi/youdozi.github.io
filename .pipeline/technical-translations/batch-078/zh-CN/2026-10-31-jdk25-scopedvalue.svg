<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="zh-CN"><title id="title">请求上下文的绑定与恢复</title><desc id="description">沿虚拟线程中的 handleRequest 执行。嵌套作用域无论正常还是异常退出，都会恢复外层绑定。普通子线程不会继承绑定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">请求上下文的绑定与恢复</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">在虚拟线程中开始请求</text><text x="180" y="137" text-anchor="middle" font-size="16">观察 CONTEXT 尚未绑定</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">call()：绑定 tenant-a / trace-123</text><text x="180" y="263" text-anchor="middle" font-size="16">在 service() 中读取上下文</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">嵌套 run()：读取 tenant-b</text><text x="180" y="389" text-anchor="middle" font-size="16">返回后观察 tenant-a</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">嵌套 run()：抛出异常</text><text x="180" y="515" text-anchor="middle" font-size="16">在外部捕获；恢复 tenant-a</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">启动普通虚拟子线程</text><text x="180" y="641" text-anchor="middle" font-size="16">观察未绑定；等待子线程</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">从外层 call() 返回</text><text x="180" y="767" text-anchor="middle" font-size="16">观察未绑定；get() 抛异常</text></g></svg>
