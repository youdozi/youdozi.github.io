<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 483" width="420" height="483" role="img" aria-labelledby="title description" xml:lang="fr"><title id="title">Enregistrer le processus courant</title><desc id="description">L’application exemple importe un collecteur, lit les propriétés de son propre runtime et émet du JSON. Aucune décompression ni décision sur le correctif.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Enregistrer le processus courant</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">Démarrer app.mjs</text><text x="180" y="137" text-anchor="middle" font-size="16">Importer runtimeEvidence</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">Lire PID, exécutable et versions</text><text x="180" y="263" text-anchor="middle" font-size="16">Lire système et architecture</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">Afficher ce processus en JSON</text><text x="180" y="389" text-anchor="middle" font-size="16">Aucun verdict ni décompression</text></g></svg>
