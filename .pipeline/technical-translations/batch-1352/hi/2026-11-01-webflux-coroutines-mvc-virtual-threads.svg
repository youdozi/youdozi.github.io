<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1113" width="420" height="1113" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">Kotlin से Java पर माइग्रेशन</title><desc id="description">समयसीमा और सीखने का खर्च देखकर Java चुनें। रिएक्टिव पथ पहचानें। सामान्य अनुरोध को अडैप्टर और सिंक्रोनस स्टोरेज पर ले जाएँ। वर्चुअल थ्रेड और अनुबंध जाँचकर ट्रैफ़िक धीरे-धीरे बढ़ाएँ।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Kotlin से Java पर माइग्रेशन</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">समयसीमा और सीखने का खर्च देखें</text><text x="180" y="137" text-anchor="middle" font-size="16">Java को लक्ष्य भाषा चुनें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">स्ट्रीमिंग और बैकप्रेशर वाले</text><text x="180" y="263" text-anchor="middle" font-size="16">अनुरोध पथ पहचानें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">सीमित जवाब वाला एक API चुनें</text><text x="180" y="389" text-anchor="middle" font-size="16">अनुबंध और आधार माप दर्ज करें</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">Kotlin से Java MVC पर जाएँ</text><text x="180" y="515" text-anchor="middle" font-size="16">स्टोरेज बदलाव अलग जाँचें</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">वर्चुअल थ्रेड जाँचें</text><text x="180" y="641" text-anchor="middle" font-size="16">डेटाबेस की सीमाएँ देखें</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">समान लोड पर लेटेंसी, त्रुटियाँ</text><text x="180" y="767" text-anchor="middle" font-size="16">और प्रतीक्षा की तुलना करें</text><path d="M 180 793 V 826" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="832" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="869" text-anchor="middle" font-size="16">क्या सेवा के तय मानदंड</text><text x="180" y="893" text-anchor="middle" font-size="16">पूरे हुए?</text><path d="M 342 875 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="875" r="12" fill="#8c3a32"/><text x="384" y="881" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="908" text-anchor="middle" font-size="10">रोकें</text><text x="193" y="943" font-size="12">हाँ</text><path d="M 180 919 V 952" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="958" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="995" text-anchor="middle" font-size="16">ट्रैफ़िक छोटे चरणों में</text><text x="180" y="1019" text-anchor="middle" font-size="16">बढ़ाएँ</text></g></svg>
