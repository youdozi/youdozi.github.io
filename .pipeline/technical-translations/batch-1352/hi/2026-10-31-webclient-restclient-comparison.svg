<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">HTTP कॉल और सब्सक्रिप्शन</title><desc id="description">मुख्य प्रोग्राम RestClient की अंतिम क्रिया पूरी करता है, WebClient का Mono बनाता है, दो अलग अनुरोधों के लिए दो बार सब्सक्राइब करता है और दोनों क्लाइंट में 404 और 503 त्रुटियाँ जाँचता है।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">HTTP कॉल और सब्सक्रिप्शन</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">RestClient.retrieve() बनाएँ</text><text x="180" y="137" text-anchor="middle" font-size="16">अनुरोध संख्या 0</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">body(String.class) से प्रतीक्षा</text><text x="180" y="263" text-anchor="middle" font-size="16">पहला अनुरोध पूरा: 1</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">WebClient का Mono बनाएँ</text><text x="180" y="389" text-anchor="middle" font-size="16">अभी सब्सक्रिप्शन नहीं: 1</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">पहला block सब्सक्राइब करके रुके</text><text x="180" y="515" text-anchor="middle" font-size="16">अनुरोध संख्या 2</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">दूसरा block फिर सब्सक्राइब करे</text><text x="180" y="641" text-anchor="middle" font-size="16">अनुरोध संख्या 3</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">दोनों क्लाइंट में 404 और 503 जाँचें</text><text x="180" y="767" text-anchor="middle" font-size="16">4 और अनुरोध, कुल 7</text></g></svg>
