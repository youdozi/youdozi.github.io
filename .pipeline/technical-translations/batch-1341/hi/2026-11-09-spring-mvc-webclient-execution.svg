<rect x="30" y="376" width="300" height="68" rx="8" fill="#e6f0e8" stroke="#53675c"/>
<text x="180.0" y="402" font-size="12">अनुरोध थ्रेड फिर चलता है</text>
<text x="180.0" y="422" font-size="12">MVC रिस्पॉन्स को सीरियलाइज़ करके लिखता है</text>
<text x="180" y="479" font-size="12">② Mono लौटाने का रास्ता</text>
<rect x="30" y="496" width="300" height="48" rx="8" fill="#e6f0e8" stroke="#53675c"/>
