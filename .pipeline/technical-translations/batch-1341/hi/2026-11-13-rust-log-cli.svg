<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1170" viewBox="0 0 360 1170" role="img" aria-labelledby="title desc" xml:lang="hi">
  <title id="title">Rust CLI में लॉग की गणना</title>
  <desc id="desc">main फ़ाइल का आर्ग्युमेंट जाँचकर BufReader से विश्लेषण शुरू करता है। मौजूदा पंक्ति से अधिकतम 4097 बाइट पढ़ता है और EOF पर गणना लौटाता है। पढ़ने में विफलता, 4096 बाइट से लंबी पंक्ति या अमान्य UTF-8 पर त्रुटि मिलती है। वैध रिकॉर्ड पर स्टेटस की गिनती बढ़ती है, अन्यथा invalid बढ़ता है। अगली पंक्ति के लिए लूप दोहरता है। main क्रमबद्ध परिणाम प्रिंट करके उपयुक्त एग्ज़िट कोड 0, 1 या 2 देता है।</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="1170" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="19" font-weight="bold">फ़ाइल → गिनती → एग्ज़िट कोड</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="25" y="60" width="310" height="74" rx="8" />
      <rect x="25" y="174" width="310" height="100" rx="8" />
      <rect x="25" y="314" width="310" height="100" rx="8" />
      <rect x="25" y="454" width="310" height="74" rx="8" />
      <rect x="25" y="568" width="145" height="90" rx="8" />
      <rect x="190" y="568" width="145" height="90" rx="8" />
      <rect x="25" y="740" width="310" height="82" rx="8" />
      <rect x="25" y="862" width="310" height="82" rx="8" />
      <rect x="25" y="1010" width="310" height="100" rx="8" fill="#f8e8dd" />
    </g>
    <text x="180" y="90">main: आर्ग्युमेंट जाँचें · फ़ाइल खोलें</text>
    <text x="180" y="116">फ़ाइल → BufReader → analyze</text>
    <text x="180" y="202">पंक्ति से अधिकतम 4097 बाइट पढ़ें</text>
    <text x="180" y="229">रीड विफल: Err · शून्य: EOF</text>
    <text x="180" y="255">अन्यथा लंबाई और UTF-8 जाँचें ↓</text>
    <text x="180" y="342">4096 बाइट से अधिक?</text>
    <text x="180" y="369">अमान्य UTF-8?</text>
    <text x="180" y="396">दोनों में से किसी पर Err</text>
    <text x="180" y="484">स्टेटस कोड और पथ जाँचें</text>
    <text x="180" y="510">स्टेटस 100–599 · पथ / से शुरू</text>
    <text x="97" y="595">वैध प्रारूप</text><text x="97" y="620">valid + 1</text><text x="97" y="644">स्टेटस की गिनती + 1</text>
    <text x="262" y="595">अमान्य प्रारूप</text><text x="262" y="620">invalid + 1</text><text x="262" y="644">पंक्ति न सहेजें</text>
    <text x="180" y="698">दोनों रास्ते अगली पंक्ति पढ़ते हैं ↑</text>
    <text x="180" y="768">EOF: Ok(Stats) → main</text><text x="180" y="797">अब आउटपुट शुरू करें</text>
    <text x="180" y="890">स्टेटस क्रम से लिखें · flush</text><text x="180" y="919">invalid = 0: कोड 0 / अन्यथा: कोड 1</text>
    <text x="180" y="1040" font-size="13.2">त्रुटि: आर्ग्युमेंट · फ़ाइल · विश्लेषण · आउटपुट</text>
    <text x="180" y="1069">main: stderr पर कारण · कोड 2</text>
    <text x="180" y="1095">विश्लेषण विफल तो कोई गणना नहीं</text>
    <text x="180" y="1144" font-size="13">EOF और त्रुटि के रास्ते अलग हैं</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M180 134V174" /><path d="M180 274V314" /><path d="M180 414V454" />
    <path d="M180 528V548H97V568" /><path d="M180 548H262V568" />
    <path d="M97 658V675H12V224H25" /><path d="M262 658V675H97" />
    <path d="M335 250H348V781H335" /><path d="M180 822V862" />
  </g>
</svg>