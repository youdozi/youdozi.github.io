<svg xmlns="http://www.w3.org/2000/svg" xml:lang="hi" viewBox="0 0 440 310" role="img" aria-labelledby="title description">
  <title id="title">Docker का कैश हटाने पर भी Mac में खाली जगह क्यों नहीं बढ़ती?</title>
  <desc id="description">पहले Docker इंजन में इस्तेमाल हुई जगह देखें, फिर चुने हुए बिल्डर का कैश और अंत में Mac के फ़ाइल सिस्टम पर खाली जगह देखें।</desc>
  <rect x="6" y="8" width="428" height="82" rx="10" fill="#f2f6fa" stroke="#577186"/>
  <text x="220" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#17384e">Docker इंजन में इस्तेमाल हुई जगह</text>
  <text x="220" y="70" text-anchor="middle" font-family="monospace" font-size="18" fill="#153c52">docker system df -v</text>
  <path d="M220 92v16m-5 -5 5 5 5 -5" fill="none" stroke="#466a80" stroke-width="2"/>
  <rect x="6" y="112" width="428" height="82" rx="10" fill="#f2f6fa" stroke="#577186"/>
  <text x="220" y="144" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#17384e">चुने हुए बिल्डर का कैश</text>
  <text x="220" y="174" text-anchor="middle" font-family="monospace" font-size="18" fill="#153c52">docker buildx du</text>
  <path d="M220 196v16m-5 -5 5 5 5 -5" fill="none" stroke="#466a80" stroke-width="2"/>
  <rect x="6" y="216" width="428" height="82" rx="10" fill="#f2f6fa" stroke="#577186"/>
  <text x="220" y="248" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#17384e">Mac के फ़ाइल सिस्टम पर खाली जगह</text>
  <text x="220" y="278" text-anchor="middle" font-family="monospace" font-size="18" fill="#153c52">df -k /</text>
</svg>
