<svg xmlns="http://www.w3.org/2000/svg" width="640" height="626" viewBox="0 0 640 626" role="img" aria-labelledby="title desc" xml:lang="fr">
  <title id="title">Choisir un Mac pour les agents IA</title>
  <desc id="desc">Commencez par Mac mini M6 pour une configuration stationnaire ou MacBook Air M5 pour la mobilité. Vérifiez les besoins en mémoire des modèles locaux.</desc>
  <rect x="2" y="2" width="636" height="622" rx="24" fill="#f8fafc" stroke="#b7c7d7" stroke-width="4"/>
  <g font-family="system-ui, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#132438">
    <text x="320" y="62" font-size="28" font-weight="700" textLength="530" lengthAdjust="spacingAndGlyphs">Où l'agent travaillera-t-il ?</text>
    <g fill="none" stroke="#526980" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M320 86v33H171v30m149-30h149v30"/>
      <path d="m160 138 11 11 11-11m276 0 11 11 11-11"/>
      <path d="M171 352v27h298v-27m-149 27v35m-11-11 11 11 11-11"/>
    </g>
    <rect x="29" y="157" width="284" height="187" rx="18" fill="#e1efeb" stroke="#397568" stroke-width="3"/>
    <rect x="327" y="157" width="284" height="187" rx="18" fill="#e6eefb" stroke="#536f9c" stroke-width="3"/>
    <text x="171" y="208" font-size="32" textLength="250" lengthAdjust="spacingAndGlyphs">Stationnaire</text>
    <text x="171" y="259" font-size="25" font-weight="700" textLength="250" lengthAdjust="spacingAndGlyphs">Mac mini M6</text>
    <text x="171" y="307" font-size="22" textLength="250" lengthAdjust="spacingAndGlyphs">Programmé · à distance</text>
    <text x="469" y="208" font-size="32" textLength="250" lengthAdjust="spacingAndGlyphs">Mobile</text>
    <text x="469" y="259" font-size="25" font-weight="700" textLength="250" lengthAdjust="spacingAndGlyphs">MacBook Air M5</text>
    <text x="469" y="307" font-size="22" textLength="250" lengthAdjust="spacingAndGlyphs">Voyages · travail à distance</text>
    <rect x="29" y="426" width="582" height="165" rx="18" fill="#fff3dc" stroke="#836b36" stroke-width="3"/>
    <text x="320" y="477" font-size="28" font-weight="700" textLength="530" lengthAdjust="spacingAndGlyphs">Exécuter un modèle local ?</text>
    <text x="320" y="526" font-size="23" textLength="530" lengthAdjust="spacingAndGlyphs">Utiliser le modèle et le contexte réels</text>
    <text x="320" y="563" font-size="23" textLength="530" lengthAdjust="spacingAndGlyphs">Vérifier les besoins en mémoire</text>
  </g>
</svg>
