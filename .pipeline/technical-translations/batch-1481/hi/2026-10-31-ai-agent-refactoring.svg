<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">रीफ़ैक्टरिंग के बाद शिपिंग शुल्क</title><desc id="description">उप-योग, सदस्यता और क्षेत्र पढ़ें। ऋणात्मक राशि पर वही अपवाद दें। मूल और अतिरिक्त शुल्क निकालकर उनका जोड़ लौटाएँ।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">रीफ़ैक्टरिंग के बाद शिपिंग शुल्क</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">उप-योग, सदस्यता और क्षेत्र लें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="251" text-anchor="middle" font-size="16">उप-योग शून्य या अधिक है?</text><path d="M 342 245 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="245" r="12" fill="#8c3a32"/><text x="384" y="251" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="278" text-anchor="middle" font-size="10">वही अपवाद</text><text x="193" y="313" font-size="12">हाँ</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">सदस्य या उप-योग ≥ 50,000?</text><text x="180" y="389" text-anchor="middle" font-size="16">हाँ तो मूल शुल्क 0, वरना 3,000</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">दूरस्थ क्षेत्र है तो 3,000 जोड़ें</text><text x="180" y="515" text-anchor="middle" font-size="16">वरना अतिरिक्त शुल्क 0</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="629" text-anchor="middle" font-size="16">मूल और अतिरिक्त शुल्क का जोड़ लौटाएँ</text></g></svg>
