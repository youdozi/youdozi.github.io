<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1113" width="420" height="1113" role="img" aria-labelledby="title description" xml:lang="ru"><title id="title">Миграция Kotlin → Java</title><desc id="description">Выделите реактивные пути, переносите обычные запросы поэтапно и расширяйте или откатывайте по результатам наблюдений.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Миграция Kotlin → Java</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">Сжатые сроки, освоение Kotlin</text><text x="180" y="137" text-anchor="middle" font-size="16">Выбрать Java целевым языком</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">Выделить потоковую передачу</text><text x="180" y="263" text-anchor="middle" font-size="16">и пути с обратным давлением</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="353" text-anchor="middle" font-size="16">Выбрать один конечный API</text><text x="180" y="377" text-anchor="middle" font-size="16">Зафиксировать контракт</text><text x="180" y="401" text-anchor="middle" font-size="16">и базовый уровень</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">Перенести Kotlin на Java MVC</text><text x="180" y="515" text-anchor="middle" font-size="16">Отделить изменения хранения</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">Проверить виртуальные потоки</text><text x="180" y="641" text-anchor="middle" font-size="16">и лимиты базы данных</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">При равной нагрузке сравнить</text><text x="180" y="767" text-anchor="middle" font-size="16">задержки, ошибки и ожидания</text><path d="M 180 793 V 826" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="832" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="881" text-anchor="middle" font-size="16">Критерии сервиса выполнены?</text><path d="M 342 875 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="875" r="12" fill="#8c3a32"/><text x="384" y="881" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="908" text-anchor="middle" font-size="10">стоп</text><text x="193" y="943" font-size="12">да</text><path d="M 180 919 V 952" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="958" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="995" text-anchor="middle" font-size="16">Расширять трафик</text><text x="180" y="1019" text-anchor="middle" font-size="16">небольшими шагами</text></g></svg>
