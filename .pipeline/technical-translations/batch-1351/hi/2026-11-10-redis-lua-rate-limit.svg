<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" xml:lang="hi" role="img" aria-labelledby="title desc">
<title id="title">Redis Lua में निश्चित विंडो से अनुरोध सीमा</title>
<desc id="desc">विश्वसनीय पहचान से कुंजी तय करें। Lua नीति, काउंटर और TTL जाँचता है। अनुमति पर SET PX या INCR गिनती दर्ज करता है और 200 मिलता है। सीमा पार होने पर स्थिति बदले बिना 429 और Retry-After मिलते हैं। कनेक्शन या स्थिति की त्रुटि पर 503 मिलता है।</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#476455"/></marker></defs>
<rect width="360" height="1000" rx="16" fill="#f5f7f2"/>
<g font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#203a2c">
<text x="180" y="33" font-size="12" font-weight="700">Lua में निर्णय और अपडेट एक साथ</text>
<rect x="24" y="54" width="312" height="66" rx="9" fill="#e0ecdf" stroke="#829b83"/>
<text x="180" y="80">अनुरोध → सर्वर कुंजी चुने</text><text x="180" y="103">डेमो: सभी अनुरोध एक खाते के</text>
<path d="M180 120V149" stroke="#476455" marker-end="url(#arrow)"/>
<rect x="24" y="153" width="312" height="78" rx="9" fill="#e5edf4" stroke="#839aae"/>
<text x="180" y="180">Redis Lua शुरू</text><text x="180" y="203">नीति जाँचें → GET → PTTL</text><text x="180" y="222" font-size="12">बीच में अन्य कमांड नहीं चलती</text>
<path d="M180 231V260" stroke="#476455" marker-end="url(#arrow)"/>
<rect x="24" y="264" width="312" height="60" rx="9" fill="#e5edf4" stroke="#839aae"/>
<text x="180" y="289">कुंजी नहीं, या काउंटर और TTL वैध</text><text x="180" y="311">कोटा शेष है?</text>
<path d="M112 324V365" stroke="#476455" marker-end="url(#arrow)"/><text x="87" y="350">हाँ</text>
<path d="M270 324V365" stroke="#476455" marker-end="url(#arrow)"/><text x="296" y="350">नहीं</text>
<rect x="16" y="370" width="185" height="113" rx="9" fill="#e0ecdf" stroke="#829b83"/>
<text x="108" y="396">कुंजी नहीं: SET 1 PX</text><text x="108" y="419">कुंजी है: INCR</text><text x="108" y="443">TTL नहीं बढ़ती</text><text x="108" y="466">अनुमति / शेष / TTL लौटाएँ</text>
<rect x="214" y="370" width="130" height="113" rx="9" fill="#fae8d8" stroke="#b58b60"/>
<text x="279" y="399">कोई लेखन नहीं</text><text x="279" y="425">अस्वीकृत · 0 · TTL</text><text x="279" y="451">लौटाएँ</text>
<path d="M108 483V520" stroke="#476455" marker-end="url(#arrow)"/>
<path d="M279 483V520" stroke="#476455" marker-end="url(#arrow)"/>
<rect x="16" y="525" width="185" height="67" rx="9" fill="#e0ecdf" stroke="#829b83"/>
<text x="108" y="552">काम शुरू करें</text><text x="108" y="576">डेमो: HTTP 200</text>
<rect x="214" y="525" width="130" height="67" rx="9" fill="#fae8d8" stroke="#b58b60"/>
<text x="279" y="552">HTTP 429</text><text x="279" y="576">Retry-After</text>
<path d="M24 190H8V614H180V624" fill="none" stroke="#ba817c" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="24" y="628" width="312" height="112" rx="9" fill="#f5e1df" stroke="#ba817c"/>
<text x="180" y="656" font-weight="700">त्रुटि होने पर</text>
<text x="180" y="681">कनेक्शन विफल, टाइमआउट या अमान्य काउंटर</text><text x="180" y="704">→ HTTP 503, काम शुरू नहीं होता</text><text x="180" y="727" font-size="12">त्रुटि पिछला लेखन वापस नहीं करती</text>
<rect x="24" y="775" width="312" height="137" rx="9" fill="#fff" stroke="#a9b3a7"/>
<text x="180" y="805" font-weight="700">10 सेकंड में 3 अनुरोध वाली नीति</text><text x="180" y="833">पहली अनुमति पर विंडो शुरू</text><text x="180" y="859">TTL समाप्त: अगला अनुरोध नई विंडो खोले</text><text x="180" y="885">हर चलती 10 सेकंड की अवधि की सीमा नहीं</text>
<text x="180" y="957" font-size="12">धारणा: सभी अनुरोध एक स्वस्थ Redis पर</text>
</g></svg>
