<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">Rust の金額集計 CLIの処理フロー</title>
  <desc id="desc">main はその引数文字列を所有しており、それらを要約するために貸し出します。空の入力は失敗します。各値は u64 として解析され、checked_add で蓄積されます。エラーはすぐに返されます。成功すると概要が返されます。 main は成功を 0 出口で stdout に送信し、エラーを 1 出口で stderr に送信します。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="1040" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1e352d">
    <text x="180" y="31" font-size="19" font-weight="bold">所有→借用→結果</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="20" y="55" width="215" height="68" rx="8" />
      <rect x="20" y="155" width="215" height="68" rx="8" />
      <rect x="20" y="270" width="215" height="64" rx="8" />
      <rect x="20" y="385" width="215" height="64" rx="8" />
      <rect x="20" y="505" width="215" height="64" rx="8" />
      <rect x="20" y="625" width="215" height="64" rx="8" />
      <rect x="20" y="745" width="215" height="64" rx="8" />
      <rect x="20" y="865" width="215" height="68" rx="8" />
      <rect x="250" y="736" width="96" height="78" rx="8" fill="#f8e8dd" />
      <rect x="250" y="865" width="96" height="68" rx="8" fill="#f8e8dd" />
    </g>
    <text x="127" y="82">main：引数を集める</text><text x="127" y="106">Vec&lt;String&gt; を所有</text>
    <text x="127" y="181">summarize(&amp;inputs)</text><text x="127" y="205">文字列スライスを借用</text>
    <text x="127" y="308">入力が空ですか?</text>
    <text x="127" y="411">次の値はあるか？</text><text x="127" y="434">参照で各文字列を読む</text>
    <text x="127" y="531">u64 として解析します</text><text x="127" y="554">数値と範囲を確認</text>
    <text x="127" y="651">checked_add で合算</text><text x="127" y="674">合計のオーバーフローを確認</text>
    <text x="127" y="772">Ok(Summary) を返す</text><text x="127" y="795">カウントと合計</text>
    <text x="127" y="891">main：標準出力</text><text x="127" y="916">終了コード 0</text>
    <text x="298" y="763">Err を返す</text><text x="298" y="788" font-size="12">早期リターン</text>
    <text x="298" y="891">標準エラー</text><text x="298" y="916">終了コード 1</text>
    <text x="148" y="362">いいえ</text><text x="148" y="479">はい</text>
    <text x="148" y="598">成功</text><text x="283" y="296">はい</text>
    <text x="288" y="495">失敗</text><text x="288" y="617">失敗</text>
    <text x="88" y="704" font-size="13">成功: 繰り返します</text>
    <text x="55" y="740" font-size="13">残りの値なし</text>
    <text x="116" y="975">次の値について繰り返します</text>
    <text x="180" y="1006" font-size="12.6">すべてのエラー経路は main の Err 分岐へ</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M127 123V155" /><path d="M127 223V270" /><path d="M127 334V385" />
    <path d="M127 449V505" /><path d="M127 569V625" />
    <path d="M20 417H8V777H20" />
    <path d="M127 689V710H3V365H127V385" />
    <path d="M235 302H337V736" />
    <path d="M235 537H309V736" /><path d="M235 657H280V736" />
    <path d="M127 809V865" /><path d="M298 814V865" />
  </g>
</svg>