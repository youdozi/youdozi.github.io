<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1050" viewBox="0 0 360 1050" xml:lang="ja" role="img" aria-labelledby="title desc">
<title id="title">T3 Codeの小さなコード変更の検証</title>
<desc id="desc">スターター コードと固定されたテストを Git に保存し、失敗を観察します。 T3 Codeでプロジェクトと認証されたプロバイダーを選択し、監視モードで制限されたプロンプトを送信します。エージェントのファイル変更を確認して承認し、テストコマンドを確認して承認します。差分、元のテスト、および実際の結果を比較します。修正を要求するか、自分でコミットしてください。 AI の出力は例示であり、リファレンス ソリューションは個別にテストされました。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57"/></marker></defs>
<rect width="360" height="1050" rx="16" fill="#f5f7f2"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="15" fill="#203a2c">
<text x="180" y="35" font-size="20" font-weight="700">T3 Code の演習フロー</text>
<rect x="24" y="58" width="312" height="88" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="86">初期コード・固定テスト・Git</text><text x="180" y="111">npm test: 8/19 が失敗しました</text><text x="180" y="134" font-size="12">参考実装の前に実行</text>
<path d="M180 146V179" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="184" width="312" height="96" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="212">T3 Code：プロジェクトと提供者を選択</text><text x="180" y="238">Supervised 権限モードを確認</text><text x="180" y="263" textLength="280" lengthAdjust="spacingAndGlyphs">範囲と完了基準を示すプロンプト</text>
<path d="M180 280V315" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="320" width="312" height="105" rx="9" fill="#faecd6" stroke="#bca274"/>
<text x="180" y="349">プロバイダーエージェントが読み取り・編集</text><text x="180" y="376">ファイル変更とコマンドのスコープを確認する</text><text x="180" y="403">作業を承認し npm test を実行</text>
<path d="M180 425V461" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="466" width="312" height="105" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="495" textLength="300" lengthAdjust="spacingAndGlyphs">ユーザー：差分と固定テストを比較</text><text x="180" y="523">実際の出力と終了ステータスを確認する</text><text x="180" y="549">テストと設定は不変か？</text>
<path d="M95 571V617" stroke="#496b57" marker-end="url(#arrow)"/><text x="68" y="600">はい</text>
<path d="M272 571V617" stroke="#496b57" marker-end="url(#arrow)"/><text x="301" y="600">いいえ</text>
<rect x="16" y="622" width="157" height="86" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="94" y="652" textLength="145" lengthAdjust="spacingAndGlyphs">完全な差分を再確認する</text><text x="94" y="681">Gitでコミットする</text>
<rect x="186" y="622" width="158" height="86" rx="9" fill="#f5e1df" stroke="#b88880"/>
<text x="265" y="652">失敗を特定する</text><text x="265" y="681">修正をリクエストする</text>
<path d="M344 665H352V371H338" fill="none" stroke="#b88880" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="24" y="755" width="312" height="137" rx="9" fill="#fff" stroke="#a8b6a7"/>
<text x="180" y="786" font-weight="700">検証範囲の例</text><text x="180" y="814">初期：8 失敗 / 参考：19 成功</text><text x="180" y="841" textLength="300" lengthAdjust="spacingAndGlyphs">テストは変更されず、外部 API 呼び出しはありません</text><text x="180" y="870" textLength="280" lengthAdjust="spacingAndGlyphs">提供者の AI は解法を生成していない</text>
<text x="180" y="949" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">T3 Code がタスク・権限・確認を接続</text>
<text x="180" y="981" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">選択したエージェントがコード・ツールを実行</text>
</g></svg>
