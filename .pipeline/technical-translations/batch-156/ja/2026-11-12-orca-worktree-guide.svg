<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1050" viewBox="0 0 360 1050" xml:lang="ja" role="img" aria-labelledby="title desc">
<title id="title">Orca プロジェクト、ワークツリー、ターミナル、ブラウザーのワークフロー</title>
<desc id="desc">Orca でサンプルの Git リポジトリを開き、ワークツリーを作成します。そのパスと分岐を確認し、エージェントに 一 つのファイルを変更するように依頼します。同じワークツリー内で固定されたテストを実行し、組み込みブラウザで開発サーバーを開き、差分をベース ブランチと比較し、条件が満たされていればコミットし、そうでなければ修正を要求します。ワークツリー ファイルの分離は、実行権限とは別のものです。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57"/></marker></defs>
<rect width="360" height="1050" rx="16" fill="#f5f7f2"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="15" fill="#203a2c">
<text x="180" y="36" font-size="20" font-weight="700">Orca タスクのワークフロー</text>
<rect x="24" y="62" width="312" height="72" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="90">「リポジトリの追加」で Git リポジトリを開く</text><text x="180" y="116">main：初期コードと固定テスト</text>
<path d="M180 134V166" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="171" width="312" height="88" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="199">タスクワークツリーを作成する</text><text x="180" y="224">まずそのフォルダーとブランチを確認します</text><text x="180" y="246" font-size="12" textLength="280" lengthAdjust="spacingAndGlyphs">UI の選択は既存のシェル cwd と異なる場合があります</text>
<path d="M180 259V291" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="296" width="312" height="83" rx="9" fill="#faecd6" stroke="#bca274"/>
<text x="180" y="324" textLength="280" lengthAdjust="spacingAndGlyphs">選択したエージェントへ一ファイルの変更を依頼</text><text x="180" y="349" textLength="280" lengthAdjust="spacingAndGlyphs">スコープ、権限、完了を指定する</text><text x="180" y="370" font-size="12">プロンプトではツールの権限が付与されません</text>
<path d="M180 379V412" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="417" width="312" height="108" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="447">同じワークツリーで npm test を実行します</text><text x="180" y="473">開発サーバーを起動 → ポートを検査</text><text x="180" y="499">実際のUIを組み込みブラウザで確認する</text>
<path d="M180 525V558" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="563" width="312" height="82" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="592">main と差分・テストを比較</text><text x="180" y="620">変更はポリシーを満たすか？</text>
<path d="M98 645V690" stroke="#496b57" marker-end="url(#arrow)"/><text x="70" y="674">はい</text>
<path d="M268 645V690" stroke="#496b57" marker-end="url(#arrow)"/><text x="297" y="674">いいえ</text>
<rect x="16" y="695" width="158" height="77" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="95" y="724">変更されたファイル</text><text x="95" y="751">自分でコミット</text>
<rect x="187" y="695" width="157" height="77" rx="9" fill="#f5e1df" stroke="#b88880"/>
<text x="265" y="724">失敗を絞り込む</text><text x="265" y="751">修正を依頼する</text>
<path d="M344 733H352V338H338" fill="none" stroke="#b88880" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="24" y="820" width="312" height="118" rx="9" fill="#fff" stroke="#a8b6a7"/>
<text x="180" y="850" font-weight="700">タスク分離境界</text><text x="180" y="878">worktree：ファイル・ブランチ・作業ビュー</text><text x="180" y="906" textLength="280" lengthAdjust="spacingAndGlyphs">ポート、DB、アカウント、アクセスも考慮してください</text>
<text x="180" y="992" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">プロジェクト → 作業パス → 結果 → レビュー</text>
</g></svg>
