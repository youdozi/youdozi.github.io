<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">公開セキュリティプログラムの検証</title>
  <desc id="desc">公開プログラム JS とリリースプルーフは、公式検証者への入力です。ファイルのハッシュ、リリース署名、透明性ログの証拠をチェックします。元の v42 はコード 0 で成功します。 一 バイトを追加すると、source_hash エラーが発生し、コード 1 が発生します。実稼働ノードの構成証明とインストールされたアプリのバイナリは別個のチェックです。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="640" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="16.3" font-weight="bold">公開セキュリティプログラムを検証</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="18" y="65" width="151" height="76" rx="8" />
      <rect x="191" y="65" width="151" height="76" rx="8" />
      <rect x="25" y="205" width="310" height="110" rx="8" />
      <rect x="18" y="395" width="151" height="100" rx="8" />
      <rect x="191" y="395" width="151" height="100" rx="8" fill="#f8e8dd" />
    </g>
    <text x="93" y="96">プログラム JS</text><text x="93" y="121" font-size="13.7">元のファイル / 変更後</text>
    <text x="266" y="96">リリース証明 JSON</text><text x="266" y="121">公開 v42 データ</text>
    <text x="180" y="232">credential-enclave-verify</text>
    <text x="180" y="257">ファイルハッシュ・リリース署名</text>
    <text x="180" y="282">透明性ログの証明</text>
    <text x="180" y="305" font-size="12">順に検証・失敗で停止</text>
    <text x="93" y="424">元ファイル：成功</text><text x="93" y="452">バージョン 42 · ok</text><text x="93" y="479">終了コード 0</text>
    <text x="266" y="424">一バイト追加</text><text x="266" y="452" font-size="14.5">source_hash 不一致</text><text x="266" y="479">終了コード 1</text>
    <text x="180" y="555" font-size="14.2">本番ノードの証明は別途検証</text>
    <text x="180" y="583" font-size="15.0">インストール済み iOS も別途検証</text>
    <text x="180" y="616" font-size="11.1">ローカル実行と同じ入力、分岐、出力</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M93 141V170H180V205" /><path d="M266 141V170H180" />
    <path d="M180 315V355H93V395" /><path d="M180 355H266V395" />
  </g>
</svg>