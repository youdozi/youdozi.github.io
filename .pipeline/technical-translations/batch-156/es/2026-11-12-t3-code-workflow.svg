<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1050" viewBox="0 0 360 1050" xml:lang="es" role="img" aria-labelledby="title desc">
<title id="title">Verificar un cambio pequeño con T3 Code</title>
<desc id="desc">Guarda el código inicial y las pruebas fijas en Git y observa los fallos. Selecciona un proyecto y proveedor autenticado en T3 Code y envía un prompt acotado en modo Supervised. Revisa y aprueba los cambios de archivos y los comandos de prueba del agente. Compara el diff, las pruebas originales y los resultados reales; solicita correcciones o haz el commit tú mismo. La salida de IA es ilustrativa y la solución de referencia se probó por separado.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57"/></marker></defs>
<rect width="360" height="1050" rx="16" fill="#f5f7f2"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="15" fill="#203a2c">
<text x="180" y="35" font-size="20" font-weight="700">Flujo del ejercicio T3 Code</text>
<rect x="24" y="58" width="312" height="88" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="86">Código inicial + pruebas fijas + Git</text><text x="180" y="111">npm test: fallan 8 de 19</text><text x="180" y="134" font-size="12">Ejecución real antes de la solución</text>
<path d="M180 146V179" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="184" width="312" height="96" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="212">T3 Code: elegir proyecto y proveedor</text><text x="180" y="238">Comprobar permisos Supervised</text><text x="180" y="263" textLength="280" lengthAdjust="spacingAndGlyphs">Prompt con alcance y finalización</text>
<path d="M180 280V315" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="320" width="312" height="105" rx="9" fill="#faecd6" stroke="#bca274"/>
<text x="180" y="349">Agente: leer y modificar código</text><text x="180" y="376">Comprobar alcance de archivos y comandos</text><text x="180" y="403">Aprobar tareas y ejecutar npm test</text>
<path d="M180 425V461" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="466" width="312" height="105" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="495">Usuario: comparar diff y pruebas</text><text x="180" y="523">Comprobar salida y estado reales</text><text x="180" y="549">¿Pruebas y configuración intactas?</text>
<path d="M95 571V617" stroke="#496b57" marker-end="url(#arrow)"/><text x="68" y="600">Sí</text>
<path d="M272 571V617" stroke="#496b57" marker-end="url(#arrow)"/><text x="301" y="600">No</text>
<rect x="16" y="622" width="157" height="86" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="94" y="652" textLength="130" lengthAdjust="spacingAndGlyphs">Revisar diff completo</text><text x="94" y="681" textLength="130" lengthAdjust="spacingAndGlyphs">Hacer commit en Git</text>
<rect x="186" y="622" width="158" height="86" rx="9" fill="#f5e1df" stroke="#b88880"/>
<text x="265" y="652">Precisar fallos</text><text x="265" y="681">Pedir corrección</text>
<path d="M344 665H352V371H338" fill="none" stroke="#b88880" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="24" y="755" width="312" height="137" rx="9" fill="#fff" stroke="#a8b6a7"/>
<text x="180" y="786" font-weight="700">Alcance de verificación</text><text x="180" y="814">Inicial: 8 fallos / referencia: 19 pasan</text><text x="180" y="841">Pruebas intactas · sin llamadas API</text><text x="180" y="870" textLength="280" lengthAdjust="spacingAndGlyphs">La solución no procede de un turno de IA</text>
<text x="180" y="949" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">T3 Code une tarea, permisos y revisión</text>
<text x="180" y="981" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">El agente elegido escribe y ejecuta</text>
</g></svg>
