<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc" xml:lang="es">
  <title id="title">Delegación de claves y límites de credenciales Pickle</title>
  <desc id="desc">Durante la configuración, el programa público de seguridad del iPhone crea claves, verifica la atestación del nodo y cifra la clave de usuario para un Nitro Enclave verificado. Los registros se almacenan cifrados. Antes del uso, el nodo comprueba la delegación activa y el guardado del registro. Los tokens OAuth permanecen en el nodo para las API; las contraseñas y tarjetas de Vault salen en texto claro al worker operativo para el formulario web. El enmascaramiento posterior del worker y de los resultados de IA es otro límite.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="1120" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="18" font-weight="bold">Delegación y uso de claves</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="25" y="60" width="310" height="85" rx="8" />
      <rect x="25" y="185" width="310" height="85" rx="8" />
      <rect x="25" y="310" width="310" height="85" rx="8" />
      <rect x="25" y="480" width="310" height="110" rx="8" />
      <rect x="18" y="655" width="151" height="105" rx="8" />
      <rect x="191" y="655" width="151" height="105" rx="8" fill="#f8e8dd" />
      <rect x="18" y="805" width="151" height="85" rx="8" />
      <rect x="191" y="805" width="151" height="85" rx="8" fill="#f8e8dd" />
    </g>
    <text x="180" y="86">iPhone: crear clave maestra</text>
    <text x="180" y="112">Guardar en iCloud Keychain</text>
    <text x="180" y="135" font-size="13">El protocolo distingue claves derivadas</text>
    <text x="180" y="212" font-size="15.0">Comprobar atestación, medición y clave</text>
    <text x="180" y="238">Fallo → no delegar clave</text>
    <text x="180" y="260" font-size="13">Cifrar clave solo para nodo verificado</text>
    <text x="180" y="337">Servidor: registros cifrados</text>
    <text x="180" y="365" font-size="15.0">Memoria Enclave: clave temporal</text>
    <text x="180" y="386" font-size="13">No se delega la clave maestra</text>
    <text x="180" y="451" font-size="12.6">El uso requiere delegación válida</text>
    <text x="180" y="508" font-size="15.0" textLength="300" lengthAdjust="spacingAndGlyphs">Solicitud → comprobar delegación y registro</text>
    <text x="180" y="535">Enclave descifra · crea registro de uso</text>
    <text x="180" y="562" font-size="15.0">Usar o liberar tras confirmar registro</text>
    <text x="180" y="582" font-size="13">Fallo → no usar ni liberar</text>
    <text x="93" y="682">OAuth: forward</text>
    <text x="93" y="710" font-size="14.5" textLength="130" lengthAdjust="spacingAndGlyphs">Token queda en nodo</text>
    <text x="93" y="738" font-size="13.7" textLength="130" lengthAdjust="spacingAndGlyphs">Se usa en API permitida</text>
    <text x="266" y="682">Vault: release</text>
    <text x="266" y="710" font-size="13.1" textLength="130" lengthAdjust="spacingAndGlyphs">Contraseña · tarjeta</text>
    <text x="266" y="738" font-size="14.5" textLength="130" lengthAdjust="spacingAndGlyphs">Texto claro al worker</text>
    <text x="93" y="834" font-size="14.5" textLength="130" lengthAdjust="spacingAndGlyphs">TLS al proveedor API</text><text x="93" y="861" font-size="12.5" textLength="130" lengthAdjust="spacingAndGlyphs">Se devuelve respuesta</text>
    <text x="266" y="834" textLength="130" lengthAdjust="spacingAndGlyphs">worker → formulario web</text><text x="266" y="861">Fuera del nodo</text>
    <text x="180" y="951" font-size="13.2" font-weight="bold">Ocultar en resultados IA: afirma servicio</text>
    <text x="180" y="983">Aplicación en worker y app</text>
    <text x="180" y="1008" font-size="14.2">no se demuestra solo con Enclave</text>
    <text x="180" y="1060" font-size="13">Resumen conceptual del código público</text>
    <text x="180" y="1086" font-size="13">No verifica producción ni app instalada</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M180 145V185" /><path d="M180 270V310" />
    <path d="M180 590V620H93V655" /><path d="M180 620H266V655" />
    <path d="M93 760V805" /><path d="M266 760V805" />
  </g>
  <path d="M20 420H340" stroke="#a7b7ac" stroke-dasharray="5 5" />
</svg>