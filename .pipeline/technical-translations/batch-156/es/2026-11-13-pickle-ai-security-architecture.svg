<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc" xml:lang="es">
  <title id="title">Verificar el programa público de seguridad</title>
  <desc id="desc">El verificador recibe el programa público JS y la prueba JSON, comprueba hash, firma y registro de transparencia. La versión original v42 termina con código 0; al añadir un byte, source_hash falla con código 1. La atestación del nodo y la app instalada requieren otras verificaciones.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="640" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="16.3" font-weight="bold">Verificar programa público de seguridad</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="18" y="65" width="151" height="76" rx="8" />
      <rect x="191" y="65" width="151" height="76" rx="8" />
      <rect x="25" y="205" width="310" height="110" rx="8" />
      <rect x="18" y="395" width="151" height="100" rx="8" />
      <rect x="191" y="395" width="151" height="100" rx="8" fill="#f8e8dd" />
    </g>
    <text x="93" y="96">Programa JS</text><text x="93" y="121" font-size="13.7" textLength="145" lengthAdjust="spacingAndGlyphs">Original o modificado</text>
    <text x="266" y="96" textLength="145" lengthAdjust="spacingAndGlyphs">Prueba JSON de versión</text><text x="266" y="121">Datos públicos v42</text>
    <text x="180" y="232">credential-enclave-verify program</text>
    <text x="180" y="257">Hash del archivo · firma de versión</text>
    <text x="180" y="282">Prueba del registro de transparencia</text>
    <text x="180" y="305" font-size="12">Comprobar en orden · parar al fallar</text>
    <text x="93" y="424">Original: éxito</text><text x="93" y="452">version 42 · ok</text><text x="93" y="479">Código de salida 0</text>
    <text x="266" y="424">Un byte añadido</text><text x="266" y="452" font-size="14.5">Fallo source_hash</text><text x="266" y="479">Código de salida 1</text>
    <text x="180" y="555" font-size="14.2">Atestación del nodo real: paso separado</text>
    <text x="180" y="583" font-size="15.0">Binario iOS instalado: otro alcance</text>
    <text x="180" y="616" font-size="11.1" textLength="300" lengthAdjust="spacingAndGlyphs">Mismas entradas, ramas y salidas de la prueba</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M93 141V170H180V205" /><path d="M266 141V170H180" />
    <path d="M180 315V355H93V395" /><path d="M180 355H266V395" />
  </g>
</svg>