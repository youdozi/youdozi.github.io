<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1050" viewBox="0 0 360 1050" xml:lang="fr" role="img" aria-labelledby="title desc">
<title id="title">Flux Orca du projet au worktree</title>
<desc id="desc">Ouvrir un dépôt Git d’exemple et créer un worktree. Vérifier chemin et branche, demander la modification d’un fichier, puis vérifier tests et navigateur dans ce worktree. Comparer le diff à la branche de base et committer si les conditions sont remplies ou demander une correction.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57" /></marker></defs>
<rect width="360" height="1050" rx="16" fill="#f5f7f2" />
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="15" fill="#203a2c">
<text x="180" y="36" font-size="20" font-weight="700">Flux de tâche Orca</text>
<rect x="24" y="62" width="312" height="72" rx="9" fill="#deebdf" stroke="#86a18b" />
<text x="180" y="90">Ouvrir le dépôt Git avec Add Repo</text><text x="180" y="116">main : code initial + tests fixes</text>
<path d="M180 134V166" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="171" width="312" height="88" rx="9" fill="#e5edf4" stroke="#839bae" />
<text x="180" y="199">Créer le worktree de la tâche</text><text x="180" y="224">Vérifier dossier et branche</text><text x="180" y="246" font-size="12" textLength="280" lengthAdjust="spacingAndGlyphs">Interface et shell ouvert peuvent différer</text>
<path d="M180 259V291" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="296" width="312" height="83" rx="9" fill="#faecd6" stroke="#bca274" />
<text x="180" y="324" textLength="280" lengthAdjust="spacingAndGlyphs" font-size="13.8">Demander la modification d’un fichier</text><text x="180" y="349" textLength="280" lengthAdjust="spacingAndGlyphs">Préciser périmètre, droits et fin</text><text x="180" y="370" font-size="12">Un prompt ne donne pas les permissions</text>
<path d="M180 379V412" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="417" width="312" height="108" rx="9" fill="#deebdf" stroke="#86a18b" />
<text x="180" y="447">Lancer npm test dans ce worktree</text><text x="180" y="473">Serveur de dev → vérifier le port</text><text x="180" y="499" font-size="13.1" textLength="280" lengthAdjust="spacingAndGlyphs">Vérifier l’interface dans le navigateur</text>
<path d="M180 525V558" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="563" width="312" height="82" rx="9" fill="#e5edf4" stroke="#839bae" />
<text x="180" y="592">Comparer diff et tests avec main</text><text x="180" y="620" font-size="15.0" textLength="280" lengthAdjust="spacingAndGlyphs">Changements conformes aux règles ?</text>
<path d="M98 645V690" stroke="#496b57" marker-end="url(#arrow)" /><text x="70" y="674">Oui</text>
<path d="M268 645V690" stroke="#496b57" marker-end="url(#arrow)" /><text x="297" y="674">Non</text>
<rect x="16" y="695" width="158" height="77" rx="9" fill="#deebdf" stroke="#86a18b" />
<text x="95" y="724">Fichier modifié</text><text x="95" y="751" font-size="13.1">Committer soi-même</text>
<rect x="187" y="695" width="157" height="77" rx="9" fill="#f5e1df" stroke="#b88880" />
<text x="265" y="724" font-size="14.8" textLength="130" lengthAdjust="spacingAndGlyphs">Préciser l’échec</text><text x="265" y="751" font-size="11" textLength="130" lengthAdjust="spacingAndGlyphs">Demander une correction</text>
<path d="M344 733H352V338H338" fill="none" stroke="#b88880" stroke-dasharray="4 4" marker-end="url(#arrow)" />
<rect x="24" y="820" width="312" height="118" rx="9" fill="#fff" stroke="#a8b6a7" />
<text x="180" y="850" font-weight="700">Limites de l’isolation</text><text x="180" y="878" font-size="14.5">Worktree : fichiers, branche et vue</text><text x="180" y="906" textLength="280" lengthAdjust="spacingAndGlyphs" font-size="13.8">Tenir compte des ports, DB, comptes et accès</text>
<text x="180" y="992" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">Projet → chemin → résultats → revue</text>
</g></svg>