<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" xml:lang="fr" role="img" aria-labelledby="title desc">
<title id="title">Limite de requêtes Redis Lua</title>
<desc id="desc">L’application choisit une clé puis Redis Lua vérifie compteur et TTL. Si la requête est autorisée, SET PX ou INCR écrit et l’application renvoie 200. Un dépassement renvoie 429 et Retry-After sans modifier l’état. Les erreurs de connexion ou d’état renvoient 503.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#476455" /></marker></defs>
<rect width="360" height="1000" rx="16" fill="#f5f7f2" />
<g font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#203a2c">
<text x="180" y="33" font-size="12" font-weight="700">Décider et mettre à jour avec Lua</text>
<rect x="24" y="54" width="312" height="66" rx="9" fill="#e0ecdf" stroke="#829b83" />
<text x="180" y="80" font-size="14.5">Requête → le serveur choisit la clé</text><text x="180" y="103">Démo : un compte pour toutes</text>
<path d="M180 120V149" stroke="#476455" marker-end="url(#arrow)" />
<rect x="24" y="153" width="312" height="78" rx="9" fill="#e5edf4" stroke="#839aae" />
<text x="180" y="180">Exécuter Redis Lua</text><text x="180" y="203">Vérifier règle → GET → PTTL</text><text x="180" y="222" font-size="12">Aucune autre commande ne s’intercale</text>
<path d="M180 231V260" stroke="#476455" marker-end="url(#arrow)" />
<rect x="24" y="264" width="312" height="60" rx="9" fill="#e5edf4" stroke="#839aae" />
<text x="180" y="289" font-size="13.4" textLength="280" lengthAdjust="spacingAndGlyphs">Clé absente ou compteur et TTL valides</text><text x="180" y="311">Autorisation restante ?</text>
<path d="M112 324V365" stroke="#476455" marker-end="url(#arrow)" /><text x="87" y="350">Oui</text>
<path d="M270 324V365" stroke="#476455" marker-end="url(#arrow)" /><text x="296" y="350">Non</text>
<rect x="16" y="370" width="185" height="113" rx="9" fill="#e0ecdf" stroke="#829b83" />
<text x="108" y="396" font-size="11" textLength="130" lengthAdjust="spacingAndGlyphs">Clé absente : SET 1 PX</text><text x="108" y="419" font-size="12.4">Clé présente : INCR</text><text x="108" y="443" font-size="13.9">TTL non prolongée</text><text x="108" y="466" font-size="11" textLength="130" lengthAdjust="spacingAndGlyphs">Autoriser / reste / TTL</text>
<rect x="214" y="370" width="130" height="113" rx="9" fill="#fae8d8" stroke="#b58b60" />
<text x="279" y="399">Aucune écriture</text><text x="279" y="425">Refus · 0 · TTL</text><text x="279" y="451">retour</text>
<path d="M108 483V520" stroke="#476455" marker-end="url(#arrow)" />
<path d="M279 483V520" stroke="#476455" marker-end="url(#arrow)" />
<rect x="16" y="525" width="185" height="67" rx="9" fill="#e0ecdf" stroke="#829b83" />
<text x="108" y="552" font-size="11.3" textLength="130" lengthAdjust="spacingAndGlyphs">Poursuivre le travail</text><text x="108" y="576">Démo : HTTP 200</text>
<rect x="214" y="525" width="130" height="67" rx="9" fill="#fae8d8" stroke="#b58b60" />
<text x="279" y="552">HTTP 429</text><text x="279" y="576">Retry-After</text>
<path d="M24 190H8V614H180V624" fill="none" stroke="#ba817c" stroke-dasharray="4 4" marker-end="url(#arrow)" />
<rect x="24" y="628" width="312" height="112" rx="9" fill="#f5e1df" stroke="#ba817c" />
<text x="180" y="656" font-weight="700">Chemin d’erreur</text>
<text x="180" y="681" font-size="13.8" textLength="280" lengthAdjust="spacingAndGlyphs">Connexion, délai ou compteur invalide</text><text x="180" y="704">→ HTTP 503 ; travail non effectué</text><text x="180" y="727" font-size="12">Les écritures passées ne sont pas annulées</text>
<rect x="24" y="775" width="312" height="137" rx="9" fill="#fff" stroke="#a9b3a7" />
<text x="180" y="805" font-weight="700">Limites : 3 par 10 secondes</text><text x="180" y="833">Fenêtre dès la première admission</text><text x="180" y="859" font-size="15.0" textLength="280" lengthAdjust="spacingAndGlyphs">Après expiration, nouvelle fenêtre</text><text x="180" y="885" font-size="11" textLength="280" lengthAdjust="spacingAndGlyphs">Pas une limite de toute période glissante de 10 s</text>
<text x="180" y="957" font-size="12">Suppose un Redis sain partagé</text>
</g></svg>