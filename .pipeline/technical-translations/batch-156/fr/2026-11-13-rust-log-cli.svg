<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1170" viewBox="0 0 360 1170" role="img" aria-labelledby="title desc" xml:lang="fr">
  <title id="title">Flux de la CLI Rust de journal</title>
  <desc id="desc">main vérifie un argument de fichier, ouvre le fichier et transmet un BufReader à analyze. Chaque itération consomme au plus 4097 octets ; erreur de lecture, ligne trop longue et UTF-8 invalide échouent. Les enregistrements valides et invalides sont comptés séparément. À EOF, main affiche les totaux triés et renvoie 0 ou 1 ; une erreur renvoie 2.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="1170" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="18.9" font-weight="bold" textLength="280" lengthAdjust="spacingAndGlyphs">Fichier → comptage → sortie</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="25" y="60" width="310" height="74" rx="8" />
      <rect x="25" y="174" width="310" height="100" rx="8" />
      <rect x="25" y="314" width="310" height="100" rx="8" />
      <rect x="25" y="454" width="310" height="74" rx="8" />
      <rect x="25" y="568" width="145" height="90" rx="8" />
      <rect x="190" y="568" width="145" height="90" rx="8" />
      <rect x="25" y="740" width="310" height="82" rx="8" />
      <rect x="25" y="862" width="310" height="82" rx="8" />
      <rect x="25" y="1010" width="310" height="100" rx="8" fill="#f8e8dd" />
    </g>
    <text x="180" y="90" font-size="14.5">main : argument · ouvrir le fichier</text>
    <text x="180" y="116">File → BufReader → analyze</text>
    <text x="180" y="202">Lire au plus 4097 octets de ligne</text>
    <text x="180" y="229">Échec : Err · zéro : EOF</text>
    <text x="180" y="255">Sinon vérifier taille et UTF-8 ↓</text>
    <text x="180" y="342">Plus de 4096 octets ?</text>
    <text x="180" y="369">UTF-8 invalide ?</text>
    <text x="180" y="396">Chaque condition renvoie Err</text>
    <text x="180" y="484">Vérifier le statut et le chemin</text>
    <text x="180" y="510" font-size="13.4" textLength="280" lengthAdjust="spacingAndGlyphs">Statut 100–599 · chemin commence par /</text>
    <text x="97" y="595">Format valide</text><text x="97" y="620">valid + 1</text><text x="97" y="644">Statut + 1</text>
    <text x="262" y="595">Format invalide</text><text x="262" y="620">invalid + 1</text><text x="262" y="644" font-size="11" textLength="140" lengthAdjust="spacingAndGlyphs">Ne pas conserver la ligne</text>
    <text x="180" y="698" font-size="14.1">Les deux branches : ligne suivante ↑</text>
    <text x="180" y="768">EOF : Ok(Stats) → main</text><text x="180" y="797">Afficher seulement après EOF</text>
    <text x="180" y="890" font-size="15.0" textLength="280" lengthAdjust="spacingAndGlyphs">Afficher les statuts triés · flush</text><text x="180" y="919">invalid = 0 : code 0 / sinon : 1</text>
    <text x="180" y="1040" font-size="11.1" textLength="280" lengthAdjust="spacingAndGlyphs">Erreur : argument · fichier · analyse · sortie</text>
    <text x="180" y="1069">main signale sur stderr · code 2</text>
    <text x="180" y="1095">Aucun total si l’analyse échoue</text>
    <text x="180" y="1144" font-size="13">EOF et erreurs résumés séparément</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M180 134V174" /><path d="M180 274V314" /><path d="M180 414V454" />
    <path d="M180 528V548H97V568" /><path d="M180 548H262V568" />
    <path d="M97 658V675H12V224H25" /><path d="M262 658V675H97" />
    <path d="M335 250H348V781H335" /><path d="M180 822V862" />
  </g>
</svg>