<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1050" viewBox="0 0 360 1050" xml:lang="fr" role="img" aria-labelledby="title desc">
<title id="title">Vérifier une petite modification dans T3 Code</title>
<desc id="desc">Enregistrer le code et les tests fixes dans Git et observer les échecs. Choisir projet et fournisseur authentifié dans T3 Code, puis envoyer un prompt borné en mode Supervised. Vérifier et approuver les changements et commandes ; comparer diff, tests et résultats puis committer ou demander une correction.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57" /></marker></defs>
<rect width="360" height="1050" rx="16" fill="#f5f7f2" />
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="15" fill="#203a2c">
<text x="180" y="35" font-size="20" font-weight="700">Exercice T3 Code</text>
<rect x="24" y="58" width="312" height="88" rx="9" fill="#deebdf" stroke="#86a18b" />
<text x="180" y="86">Code initial + tests fixes + Git</text><text x="180" y="111">npm test : 8 échecs sur 19</text><text x="180" y="134" font-size="12">Exécution réelle avant la référence</text>
<path d="M180 146V179" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="184" width="312" height="96" rx="9" fill="#e5edf4" stroke="#839bae" />
<text x="180" y="212">T3 Code : projet et fournisseur</text><text x="180" y="238">Vérifier le mode Supervised</text><text x="180" y="263" textLength="280" lengthAdjust="spacingAndGlyphs" font-size="13.8">Prompt : périmètre et critères de fin</text>
<path d="M180 280V315" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="320" width="312" height="105" rx="9" fill="#faecd6" stroke="#bca274" />
<text x="180" y="349">Agent : lire et modifier le code</text><text x="180" y="376">Vérifier fichiers et commandes</text><text x="180" y="403">Approuver puis lancer npm test</text>
<path d="M180 425V461" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="466" width="312" height="105" rx="9" fill="#deebdf" stroke="#86a18b" />
<text x="180" y="495" font-size="14.5">Comparer le diff et les tests fixes</text><text x="180" y="523">Vérifier sortie réelle et statut</text><text x="180" y="549" font-size="15.0" textLength="280" lengthAdjust="spacingAndGlyphs">Tests et configuration inchangés ?</text>
<path d="M95 571V617" stroke="#496b57" marker-end="url(#arrow)" /><text x="68" y="600">Oui</text>
<path d="M272 571V617" stroke="#496b57" marker-end="url(#arrow)" /><text x="301" y="600">Non</text>
<rect x="16" y="622" width="157" height="86" rx="9" fill="#deebdf" stroke="#86a18b" />
<text x="94" y="652" font-size="11" textLength="130" lengthAdjust="spacingAndGlyphs">Revérifier tout le diff</text><text x="94" y="681" font-size="13.1">Committer dans Git</text>
<rect x="186" y="622" width="158" height="86" rx="9" fill="#f5e1df" stroke="#b88880" />
<text x="265" y="652" font-size="12.4">Préciser les échecs</text><text x="265" y="681" font-size="11" textLength="130" lengthAdjust="spacingAndGlyphs">Demander une correction</text>
<path d="M344 665H352V371H338" fill="none" stroke="#b88880" stroke-dasharray="4 4" marker-end="url(#arrow)" />
<rect x="24" y="755" width="312" height="137" rx="9" fill="#fff" stroke="#a8b6a7" />
<text x="180" y="786" font-weight="700">Périmètre de vérification</text><text x="180" y="814" font-size="12.1">Initial : 8 échecs / référence : 19 succès</text><text x="180" y="841" font-size="14.5">Tests inchangés · pas d’API externe</text><text x="180" y="870" textLength="280" lengthAdjust="spacingAndGlyphs" font-size="13.8">Aucun tour IA n’a produit la solution</text>
<text x="180" y="949" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">T3 Code relie tâche, droits et revue</text>
<text x="180" y="981" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">L’agent écrit et exécute les outils</text>
</g></svg>