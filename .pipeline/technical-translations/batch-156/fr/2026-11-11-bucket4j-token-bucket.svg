<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" xml:lang="fr" role="img" aria-labelledby="title desc">
<title id="title">Limite locale par seau à jetons Bucket4j</title>
<desc id="desc">Un seau singleton Spring de capacité et de quantité initiale 5 est partagé par toutes les requêtes de démonstration. Greedy remplit 5 jetons en 10 secondes. Chaque requête tente atomiquement d’en consommer un. Succès : 200 ; refus : 429 et Retry-After arrondi. Les seaux locaux ne partagent pas leur limite.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57" /></marker></defs>
<rect width="360" height="1000" rx="16" fill="#f5f7f2" />
<g fill="#203a2c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="15">
<text x="180" y="35" font-size="20" font-weight="700">Seau à jetons Bucket4j</text>
<rect x="24" y="59" width="312" height="83" rx="9" fill="#deebdf" stroke="#86a18b" />
<text x="180" y="86">Créer le seau au démarrage</text><text x="180" y="109">Réutiliser le singleton Spring</text><text x="180" y="132" font-size="13">Toutes les requêtes /demo le partagent</text>
<path d="M180 142V174" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="179" width="312" height="89" rx="9" fill="#e5edf4" stroke="#839bae" />
<text x="180" y="205">Capacité 5 · initialement 5</text><text x="180" y="230">Greedy : remplir 5 en 10 secondes</text><text x="180" y="254">Consommer 5 à t=0 → 1 à t=2s</text>
<path d="M180 268V302" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="307" width="312" height="98" rx="9" fill="#e5edf4" stroke="#839bae" />
<text x="180" y="335" font-size="14.5">Requête → appliquer le temps écoulé</text><text x="180" y="361" font-size="12.7">Tenter atomiquement de consommer 1 jeton</text><text x="180" y="388" font-size="12">tryConsumeAndReturnRemaining(1)</text>
<path d="M100 405V453" stroke="#496b57" marker-end="url(#arrow)" /><text x="74" y="435">Succès</text>
<path d="M265 405V453" stroke="#496b57" marker-end="url(#arrow)" /><text x="294" y="435">Insuffisant</text>
<rect x="16" y="458" width="159" height="110" rx="9" fill="#deebdf" stroke="#86a18b" />
<text x="95" y="486" font-size="14.4">Consommer 1 jeton</text><text x="95" y="513" font-size="11.7" textLength="135" lengthAdjust="spacingAndGlyphs">Poursuivre le travail</text><text x="95" y="542">Démo : HTTP 200</text>
<rect x="187" y="458" width="157" height="110" rx="9" fill="#f9e8d9" stroke="#ba946e" />
<text x="265" y="486" textLength="135" lengthAdjust="spacingAndGlyphs" font-size="11">Ne pas attendre le remplissage</text><text x="265" y="513">HTTP 429</text><text x="265" y="542" textLength="135" lengthAdjust="spacingAndGlyphs" font-size="11">Retry-After : attente en secondes</text>
<rect x="24" y="608" width="312" height="113" rx="9" fill="#fff" stroke="#a9b6a8" />
<text x="180" y="636" font-weight="700" font-size="14.5">Remplissage calculé du temps écoulé</text><text x="180" y="663">Ne pas créer un seau par requête</text><text x="180" y="689">Aucun ordonnanceur séparé</text><text x="180" y="710" font-size="12">Ce schéma couvre une JVM locale</text>
<rect x="24" y="759" width="312" height="147" rx="9" fill="#f4e2df" stroke="#b88880" />
<text x="180" y="789" font-weight="700">Deux seaux locaux séparés</text><text x="180" y="817" textLength="280" lengthAdjust="spacingAndGlyphs" font-size="13.1">Seau A : initial 5 / seau B : initial 5</text><text x="180" y="846" font-size="13.1" textLength="280" lengthAdjust="spacingAndGlyphs">Sans état partagé : jusqu’à 10 au total</text><text x="180" y="875" font-size="14.5">Limite globale : stockage distribué</text>
<text x="180" y="954" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">Capacité et remplissage sont distincts</text>
</g></svg>