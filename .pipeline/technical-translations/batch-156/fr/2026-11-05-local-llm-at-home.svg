<svg xmlns="http://www.w3.org/2000/svg" width="360" height="936" viewBox="0 0 360 936" role="img" aria-labelledby="title description" xml:lang="fr">
<title id="title">Un LLM local à la maison</title>
<desc id="description">Installer Ollama et télécharger le modèle, avec communication externe. Créer une configuration, vérifier une note choisie et l’envoyer à l’API locale. Valider la réponse et la comparer à l’original. Le modèle doit être local et les fonctions cloud désactivées.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#475569" /></marker></defs>
<rect width="360" height="936" rx="12" fill="#f8fafc" />
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f172a">
<text x="180" y="32" font-size="12" font-weight="600">LLM local à la maison</text>
<rect x="16" y="64" width="328" height="86" rx="10" fill="#dbeafe" stroke="#64748b" />
<text x="180" y="99" font-size="12">Installer Ollama / télécharger le modèle</text>
<text x="180" y="123" font-size="12">Préparation : communication externe</text>
<path d="M180 150V176" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<rect x="16" y="183" width="328" height="86" rx="10" fill="#dbeafe" stroke="#64748b" />
<text x="180" y="218" font-size="12">Créer une configuration Modelfile</text>
<text x="180" y="242" font-size="12">home-assistant</text>
<path d="M180 269V295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<rect x="16" y="302" width="328" height="86" rx="10" fill="#fef3c7" stroke="#64748b" />
<text x="180" y="337" font-size="12">Note : UTF-8, 2000 caractères au plus</text>
<text x="180" y="361" font-size="12">Vide ou trop longue : erreur</text>
<path d="M180 388V414" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<rect x="16" y="421" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b" />
<text x="180" y="456" font-size="12">POST vers l’API locale</text>
<text x="180" y="480" font-size="12">127.0.0.1:11434/api/chat</text>
<path d="M180 507V533" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<rect x="16" y="540" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b" />
<text x="180" y="575" font-size="12">Inférence du modèle local</text>
<text x="180" y="599" font-size="12">CPU/GPU selon l’appareil</text>
<path d="M180 626V652" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<rect x="16" y="659" width="328" height="86" rx="10" fill="#fef3c7" stroke="#64748b" />
<text x="180" y="694" font-size="12">Vérifier HTTP, fin et taille de sortie</text>
<text x="180" y="718" font-size="12">Échec : sortie en erreur</text>
<path d="M180 745V771" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />
<rect x="16" y="778" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b" />
<text x="180" y="813" font-size="12">Comparer le résultat à la note</text>
<text x="180" y="837" font-size="12">Aucun fichier modifié ni commande auto</text>
<text x="180" y="918" font-size="13">Modèle local, cloud désactivé requis</text>
</g></svg>