<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc" xml:lang="fr">
  <title id="title">Délégation de clés et usages des identifiants Pickle</title>
  <desc id="desc">À la configuration, l’iPhone vérifie le nœud et délègue une clé utilisateur chiffrée à une Nitro Enclave. À l’usage, la délégation et la sauvegarde du journal sont vérifiées. Les jetons OAuth restent dans le nœud pour les API ; les mots de passe et cartes Vault sortent en clair vers le worker après release. Le masquage ultérieur est une autre limite.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="1120" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="15.0" font-weight="bold" textLength="280" lengthAdjust="spacingAndGlyphs">Délégation et utilisation des clés</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="25" y="60" width="310" height="85" rx="8" />
      <rect x="25" y="185" width="310" height="85" rx="8" />
      <rect x="25" y="310" width="310" height="85" rx="8" />
      <rect x="25" y="480" width="310" height="110" rx="8" />
      <rect x="18" y="655" width="151" height="105" rx="8" />
      <rect x="191" y="655" width="151" height="105" rx="8" fill="#f8e8dd" />
      <rect x="18" y="805" width="151" height="85" rx="8" />
      <rect x="191" y="805" width="151" height="85" rx="8" fill="#f8e8dd" />
    </g>
    <text x="180" y="86">iPhone : créer la clé maîtresse</text>
    <text x="180" y="112">Stocker dans iCloud Keychain</text>
    <text x="180" y="135" font-size="12.7">Le protocole distingue les clés dérivées</text>
    <text x="180" y="212" font-size="14.5">Vérifier attestation, mesure et clé</text>
    <text x="180" y="238">Échec → aucune délégation</text>
    <text x="180" y="260" font-size="13">Chiffrer pour le nœud vérifié</text>
    <text x="180" y="337" font-size="15.0" textLength="280" lengthAdjust="spacingAndGlyphs">Serveur : enregistrements chiffrés</text>
    <text x="180" y="365" font-size="14.1">Enclave : clé utilisateur temporaire</text>
    <text x="180" y="386" font-size="13">La clé maîtresse n’est pas déléguée</text>
    <text x="180" y="451" font-size="12.6">Le flux exige une délégation valide</text>
    <text x="180" y="508" font-size="12.7">Requête → vérifier délégation et données</text>
    <text x="180" y="535" font-size="14.5">Enclave déchiffre · crée le journal</text>
    <text x="180" y="562" font-size="13.4" textLength="280" lengthAdjust="spacingAndGlyphs">Utiliser après confirmation du journal</text>
    <text x="180" y="582" font-size="13">Échec → aucune utilisation ou sortie</text>
    <text x="93" y="682">OAuth : forward</text>
    <text x="93" y="710" font-size="14.1">Jeton dans le nœud</text>
    <text x="93" y="738" font-size="13.7">API autorisée</text>
    <text x="266" y="682">Vault : release</text>
    <text x="266" y="710" font-size="12.7">Mot de passe · carte</text>
    <text x="266" y="738" font-size="12.7">Clair vers le worker</text>
    <text x="93" y="834" font-size="11.1" textLength="140" lengthAdjust="spacingAndGlyphs">TLS vers le fournisseur</text><text x="93" y="861" font-size="12.5">Retour des données</text>
    <text x="266" y="834" font-size="11.1" textLength="140" lengthAdjust="spacingAndGlyphs">worker → formulaire web</text><text x="266" y="861">Hors du nœud</text>
    <text x="180" y="951" font-size="13.2" font-weight="bold">Masquage IA : affirmation du service</text>
    <text x="180" y="983" font-size="14.5">Application dans le worker et l’app</text>
    <text x="180" y="1008" font-size="13.8" textLength="280" lengthAdjust="spacingAndGlyphs">non prouvée par le seul dépôt Enclave</text>
    <text x="180" y="1060" font-size="13">Résumé conceptuel du code public</text>
    <text x="180" y="1086" font-size="13">Pas une vérification de production</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M180 145V185" /><path d="M180 270V310" />
    <path d="M180 590V620H93V655" /><path d="M180 620H266V655" />
    <path d="M93 760V805" /><path d="M266 760V805" />
  </g>
  <path d="M20 420H340" stroke="#a7b7ac" stroke-dasharray="5 5" />
</svg>