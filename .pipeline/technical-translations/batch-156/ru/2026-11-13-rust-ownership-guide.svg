<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc" xml:lang="ru">
  <title id="title">Владение в Rust и обработка сумм</title>
  <desc id="desc">main владеет аргументами и предоставляет их summarize по ссылке. Пустой ввод, недопустимое значение или переполнение приводят к ошибке. При успехе функция возвращает количество и сумму, а main определяет вывод и код завершения.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="1040" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1e352d">
    <text x="180" y="31" font-size="19" font-weight="bold" textLength="320" lengthAdjust="spacingAndGlyphs">Владение → заимствование → результат</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="20" y="55" width="215" height="68" rx="8" />
      <rect x="20" y="155" width="215" height="68" rx="8" />
      <rect x="20" y="270" width="215" height="64" rx="8" />
      <rect x="20" y="385" width="215" height="64" rx="8" />
      <rect x="20" y="505" width="215" height="64" rx="8" />
      <rect x="20" y="625" width="215" height="64" rx="8" />
      <rect x="20" y="745" width="215" height="64" rx="8" />
      <rect x="20" y="865" width="215" height="68" rx="8" />
      <rect x="250" y="736" width="96" height="78" rx="8" fill="#f8e8dd" />
      <rect x="250" y="865" width="96" height="68" rx="8" fill="#f8e8dd" />
    </g>
    <text x="127" y="82" textLength="130" lengthAdjust="spacingAndGlyphs">main: собрать аргументы</text><text x="127" y="106" textLength="130" lengthAdjust="spacingAndGlyphs">Владеет Vec&lt;String&gt;</text>
    <text x="127" y="181">summarize(&amp;inputs)</text><text x="127" y="205" textLength="130" lengthAdjust="spacingAndGlyphs">Заимствовать срез строк</text>
    <text x="127" y="308">Ввод пуст?</text>
    <text x="127" y="411" textLength="130" lengthAdjust="spacingAndGlyphs">Есть следующее значение?</text><text x="127" y="434" textLength="130" lengthAdjust="spacingAndGlyphs">Читать строки по ссылке</text>
    <text x="127" y="531">Разобрать как u64</text><text x="127" y="554" textLength="130" lengthAdjust="spacingAndGlyphs">Проверить число и диапазон</text>
    <text x="127" y="651" textLength="130" lengthAdjust="spacingAndGlyphs">Накопить через checked_add</text><text x="127" y="674" textLength="130" lengthAdjust="spacingAndGlyphs">Проверить переполнение суммы</text>
    <text x="127" y="772" textLength="130" lengthAdjust="spacingAndGlyphs">Вернуть Ok(Summary)</text><text x="127" y="795">Количество и сумма</text>
    <text x="127" y="891" textLength="130" lengthAdjust="spacingAndGlyphs">main: стандартный вывод</text><text x="127" y="916">Код завершения 0</text>
    <text x="298" y="763">Вернуть Err</text><text x="298" y="788" font-size="12" textLength="90" lengthAdjust="spacingAndGlyphs">Досрочный возврат</text>
    <text x="298" y="891" textLength="90" lengthAdjust="spacingAndGlyphs">Стандартный поток ошибок</text><text x="298" y="916" textLength="90" lengthAdjust="spacingAndGlyphs">Код завершения 1</text>
    <text x="148" y="362">Нет</text><text x="148" y="479">Да</text>
    <text x="148" y="598">Успех</text><text x="283" y="296">Да</text>
    <text x="288" y="495">Ошибка</text><text x="288" y="617">Ошибка</text>
    <text x="88" y="704" font-size="13">Успех: повтор</text>
    <text x="55" y="740" font-size="13" textLength="100" lengthAdjust="spacingAndGlyphs">Значений больше нет</text>
    <text x="116" y="975" textLength="130" lengthAdjust="spacingAndGlyphs">Повтор для следующего значения</text>
    <text x="180" y="1006" font-size="12.6" textLength="300" lengthAdjust="spacingAndGlyphs">Все пути ошибок сходятся в Err функции main.</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M127 123V155" /><path d="M127 223V270" /><path d="M127 334V385" />
    <path d="M127 449V505" /><path d="M127 569V625" />
    <path d="M20 417H8V777H20" />
    <path d="M127 689V710H3V365H127V385" />
    <path d="M235 302H337V736" />
    <path d="M235 537H309V736" /><path d="M235 657H280V736" />
    <path d="M127 809V865" /><path d="M298 814V865" />
  </g>
</svg>