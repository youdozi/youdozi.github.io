<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1050" viewBox="0 0 360 1050" xml:lang="ru" role="img" aria-labelledby="title desc">
<title id="title">Работа с проектом, worktree и браузером Orca</title>
<desc id="desc">Откройте пример Git-репозитория в Orca, создайте worktree и проверьте путь и ветку. Попросите агента изменить один файл, выполните тесты в той же worktree и откройте сервер в браузере. Сравните diff с базовой веткой и сделайте коммит при выполнении условий либо запросите исправление. Разделение файлов не равно ограничению разрешений.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57"/></marker></defs>
<rect width="360" height="1050" rx="16" fill="#f5f7f2"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="15" fill="#203a2c">
<text x="180" y="36" font-size="20" font-weight="700">Процесс работы Orca</text>
<rect x="24" y="62" width="312" height="72" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="90">Открыть Git-репозиторий: Add Repo</text><text x="180" y="116" textLength="300" lengthAdjust="spacingAndGlyphs">main: исходный код и фиксированные тесты</text>
<path d="M180 134V166" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="171" width="312" height="88" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="199">Создать рабочую worktree</text><text x="180" y="224">Проверить папку и ветку</text><text x="180" y="246" font-size="12" textLength="280" lengthAdjust="spacingAndGlyphs">Выбор в UI и cwd shell могут отличаться</text>
<path d="M180 259V291" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="296" width="312" height="83" rx="9" fill="#faecd6" stroke="#bca274"/>
<text x="180" y="324" textLength="280" lengthAdjust="spacingAndGlyphs">Попросить агента изменить один файл</text><text x="180" y="349" textLength="280" lengthAdjust="spacingAndGlyphs">Задать область, разрешения и результат</text><text x="180" y="370" font-size="12">Запрос не предоставляет разрешения</text>
<path d="M180 379V412" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="417" width="312" height="108" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="447">Запустить npm test в той же worktree</text><text x="180" y="473">Запустить сервер → проверить порт</text><text x="180" y="499" textLength="300" lengthAdjust="spacingAndGlyphs">Проверить страницу во встроенном браузере</text>
<path d="M180 525V558" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="563" width="312" height="82" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="592">Сравнить diff и тесты с main</text><text x="180" y="620">Изменения соответствуют политике?</text>
<path d="M98 645V690" stroke="#496b57" marker-end="url(#arrow)"/><text x="70" y="674">Да</text>
<path d="M268 645V690" stroke="#496b57" marker-end="url(#arrow)"/><text x="297" y="674">Нет</text>
<rect x="16" y="695" width="158" height="77" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="95" y="724" textLength="130" lengthAdjust="spacingAndGlyphs">Только изменённый файл</text><text x="95" y="751">Коммит вручную</text>
<rect x="187" y="695" width="157" height="77" rx="9" fill="#f5e1df" stroke="#b88880"/>
<text x="265" y="724">Уточнить ошибку</text><text x="265" y="751" textLength="130" lengthAdjust="spacingAndGlyphs">Запросить исправление</text>
<path d="M344 733H352V338H338" fill="none" stroke="#b88880" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="24" y="820" width="312" height="118" rx="9" fill="#fff" stroke="#a8b6a7"/>
<text x="180" y="850" font-weight="700">Границы изоляции задачи</text><text x="180" y="878">Worktree: файлы, ветка и представление</text><text x="180" y="906" textLength="280" lengthAdjust="spacingAndGlyphs">Учесть порты, БД, аккаунты и доступ</text>
<text x="180" y="992" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">Проект → путь → результат → проверка</text>
</g></svg>
