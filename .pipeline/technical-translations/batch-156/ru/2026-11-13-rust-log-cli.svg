<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1170" viewBox="0 0 360 1170" role="img" aria-labelledby="title desc" xml:lang="ru">
  <title id="title">Агрегация HTTP-статусов на Rust</title>
  <desc id="desc">main открывает файл; analyze читает строки с лимитом 4097 байт. Ошибка чтения, неверный UTF-8 или длина свыше 4096 байт завершают анализ ошибкой. Верные записи увеличивают счётчик статуса, неверные — invalid. При EOF main печатает отсортированные итоги и возвращает 0, 1 или 2.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="1170" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="19" font-weight="bold">Файл → подсчёт → код выхода</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="25" y="60" width="310" height="74" rx="8" />
      <rect x="25" y="174" width="310" height="100" rx="8" />
      <rect x="25" y="314" width="310" height="100" rx="8" />
      <rect x="25" y="454" width="310" height="74" rx="8" />
      <rect x="25" y="568" width="145" height="90" rx="8" />
      <rect x="190" y="568" width="145" height="90" rx="8" />
      <rect x="25" y="740" width="310" height="82" rx="8" />
      <rect x="25" y="862" width="310" height="82" rx="8" />
      <rect x="25" y="1010" width="310" height="100" rx="8" fill="#f8e8dd" />
    </g>
    <text x="180" y="90">main: проверить аргумент · открыть файл</text>
    <text x="180" y="116">File → BufReader → analyze</text>
    <text x="180" y="202">Прочитать до 4097 байт строки</text>
    <text x="180" y="229">Ошибка: Err · ноль: EOF</text>
    <text x="180" y="255">Иначе проверить длину и UTF-8 ↓</text>
    <text x="180" y="342">Более 4096 байт?</text>
    <text x="180" y="369">Неверный UTF-8?</text>
    <text x="180" y="396">Любое условие даёт Err</text>
    <text x="180" y="484">Проверить статус и путь</text>
    <text x="180" y="510">Статус 100–599 · путь начинается с /</text>
    <text x="97" y="595">Верный формат</text><text x="97" y="620">valid + 1</text><text x="97" y="644">Статус + 1</text>
    <text x="262" y="595">Неверный формат</text><text x="262" y="620">invalid + 1</text><text x="262" y="644" textLength="130" lengthAdjust="spacingAndGlyphs">Строка не сохраняется</text>
    <text x="180" y="698">Обе ветки читают следующую строку ↑</text>
    <text x="180" y="768">EOF: Ok(Stats) → main</text><text x="180" y="797">Только тогда начать вывод</text>
    <text x="180" y="890">Статусы по порядку · flush</text><text x="180" y="919">invalid = 0: код 0 / иначе: код 1</text>
    <text x="180" y="1040" font-size="13.2">Ошибка: аргумент · файл · анализ · вывод</text>
    <text x="180" y="1069">main сообщает в stderr · код 2</text>
    <text x="180" y="1095">Нет итогов при ошибке анализа</text>
    <text x="180" y="1144" font-size="13">EOF и ошибки показаны отдельно</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M180 134V174" /><path d="M180 274V314" /><path d="M180 414V454" />
    <path d="M180 528V548H97V568" /><path d="M180 548H262V568" />
    <path d="M97 658V675H12V224H25" /><path d="M262 658V675H97" />
    <path d="M335 250H348V781H335" /><path d="M180 822V862" />
  </g>
</svg>