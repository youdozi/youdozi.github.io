<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" xml:lang="ru" role="img" aria-labelledby="title desc">
<title id="title">Ограничение запросов с Redis Lua</title>
<desc id="desc">Сервер выбирает ключ по доверенному субъекту запроса; Lua проверяет политику, счётчик и срок действия. Разрешённый запрос записывается через начальный SET PX или последующий INCR, и возвращается 200. Отказ не меняет состояние и возвращает 429 с Retry-After. Ошибка соединения или состояния даёт 503.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#476455"/></marker></defs>
<rect width="360" height="1000" rx="16" fill="#f5f7f2"/>
<g font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#203a2c">
<text x="180" y="33" font-size="12" font-weight="700">Решить и обновить одним Lua</text>
<rect x="24" y="54" width="312" height="66" rx="9" fill="#e0ecdf" stroke="#829b83"/>
<text x="180" y="80">Запрос → выбрать ключ лимита</text><text x="180" y="103">Демо: один аккаунт для всех</text>
<path d="M180 120V149" stroke="#476455" marker-end="url(#arrow)"/>
<rect x="24" y="153" width="312" height="78" rx="9" fill="#e5edf4" stroke="#839aae"/>
<text x="180" y="180">Запустить Redis Lua</text><text x="180" y="203">Проверить политику → GET → PTTL</text><text x="180" y="222" font-size="12">Другие команды не вклиниваются</text>
<path d="M180 231V260" stroke="#476455" marker-end="url(#arrow)"/>
<rect x="24" y="264" width="312" height="60" rx="9" fill="#e5edf4" stroke="#839aae"/>
<text x="180" y="289">Нет ключа либо верный счётчик и TTL</text><text x="180" y="311">Лимит остался?</text>
<path d="M112 324V365" stroke="#476455" marker-end="url(#arrow)"/><text x="87" y="350">Да</text>
<path d="M270 324V365" stroke="#476455" marker-end="url(#arrow)"/><text x="296" y="350">Нет</text>
<rect x="16" y="370" width="185" height="113" rx="9" fill="#e0ecdf" stroke="#829b83"/>
<text x="108" y="396" textLength="130" lengthAdjust="spacingAndGlyphs">Нет ключа: SET 1 PX</text><text x="108" y="419">Есть ключ: INCR</text><text x="108" y="443" textLength="130" lengthAdjust="spacingAndGlyphs">TTL не продлевается</text><text x="108" y="466" textLength="130" lengthAdjust="spacingAndGlyphs">Вернуть допуск / остаток / TTL</text>
<rect x="214" y="370" width="130" height="113" rx="9" fill="#fae8d8" stroke="#b58b60"/>
<text x="279" y="399">Без записи</text><text x="279" y="425">Отказ · 0 · TTL</text><text x="279" y="451">вернуть</text>
<path d="M108 483V520" stroke="#476455" marker-end="url(#arrow)"/>
<path d="M279 483V520" stroke="#476455" marker-end="url(#arrow)"/>
<rect x="16" y="525" width="185" height="67" rx="9" fill="#e0ecdf" stroke="#829b83"/>
<text x="108" y="552">Перейти к работе</text><text x="108" y="576">Демо: HTTP 200</text>
<rect x="214" y="525" width="130" height="67" rx="9" fill="#fae8d8" stroke="#b58b60"/>
<text x="279" y="552">HTTP 429</text><text x="279" y="576">Retry-After</text>
<path d="M24 190H8V614H180V624" fill="none" stroke="#ba817c" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="24" y="628" width="312" height="112" rx="9" fill="#f5e1df" stroke="#ba817c"/>
<text x="180" y="656" font-weight="700">Путь ошибки</text>
<text x="180" y="681" textLength="300" lengthAdjust="spacingAndGlyphs">Сбой соединения, ожидание, неверный счётчик</text><text x="180" y="704">→ HTTP 503; работа не выполняется</text><text x="180" y="727" font-size="12" textLength="300" lengthAdjust="spacingAndGlyphs">Предыдущие записи не откатываются при ошибке</text>
<rect x="24" y="775" width="312" height="137" rx="9" fill="#fff" stroke="#a9b3a7"/>
<text x="180" y="805" font-weight="700">Границы примера 3 за 10 секунд</text><text x="180" y="833">Окно начинается с первого допуска</text><text x="180" y="859">После TTL следующий запрос начинает окно</text><text x="180" y="885">Не лимит для любых скользящих 10 секунд</text>
<text x="180" y="957" font-size="12">Запросы используют один исправный Redis</text>
</g></svg>
