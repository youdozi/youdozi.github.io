<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">验证公共安全程序</title>
  <desc id="desc">公开程序JS和发布证明作为官方验证者的输入。它检查文件哈希、发布签名和透明度日志证明。原始 v42 成功，代码为 0；添加一个字节会导致 source_hash 失败并生成代码 1。生产节点证明和安装的应用程序二进制文件是单独的检查。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="640" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="16.3" font-weight="bold">验证公共安全程序</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="18" y="65" width="151" height="76" rx="8" />
      <rect x="191" y="65" width="151" height="76" rx="8" />
      <rect x="25" y="205" width="310" height="110" rx="8" />
      <rect x="18" y="395" width="151" height="100" rx="8" />
      <rect x="191" y="395" width="151" height="100" rx="8" fill="#f8e8dd" />
    </g>
    <text x="93" y="96">程序 JS</text><text x="93" y="121" font-size="13.7">原始文件或修改文件</text>
    <text x="266" y="96">发布证明 JSON</text><text x="266" y="121">公开v42数据</text>
    <text x="180" y="232">credential-enclave-verify 程序</text>
    <text x="180" y="257">文件哈希·发布签名</text>
    <text x="180" y="282">透明日志证明</text>
    <text x="180" y="305" font-size="12">按顺序检查·故障停止</text>
    <text x="93" y="424">原始文件：成功</text><text x="93" y="452">版本 42 · ok</text><text x="93" y="479">退出代码 0</text>
    <text x="266" y="424">添加了一个字节</text><text x="266" y="452" font-size="14.5">source_hash 不匹配</text><text x="266" y="479">退出代码 1</text>
    <text x="180" y="555" font-size="14.2">生产节点证明需另行验证</text>
    <text x="180" y="583" font-size="15.0">已安装 iOS 二进制文件也需另验</text>
    <text x="180" y="616" font-size="11.1">与本地运行相同的输入、分支和输出</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M93 141V170H180V205" /><path d="M266 141V170H180" />
    <path d="M180 315V355H93V395" /><path d="M180 355H266V395" />
  </g>
</svg>