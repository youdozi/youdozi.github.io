<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
<title id="title">Bucket4j 本地令牌桶限速</title>
<desc id="desc">创建一个由所有演示请求重用的 Spring 单例存储桶。容量和初始令牌数为5；Greedy 在 10 秒内补充 5 个令牌。每个请求都会依据经过的时间原子性地尝试消耗一个令牌。成功返回200；拒绝返回 429 且 Retry-After 向上取整到秒。独立的本地桶不共享限制。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57"/></marker></defs>
<rect width="360" height="1000" rx="16" fill="#f5f7f2"/>
<g fill="#203a2c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="15">
<text x="180" y="35" font-size="20" font-weight="700">Bucket4j令牌桶</text>
<rect x="24" y="59" width="312" height="83" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="86">应用启动时创建令牌桶</text><text x="180" y="109">作为 Spring 单例 bean 重用</text><text x="180" y="132" font-size="13">所有 /demo 请求共享令牌桶</text>
<path d="M180 142V174" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="179" width="312" height="89" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="205">容量 5 · 初始令牌 5</text><text x="180" y="230">Greedy：10 秒补充 5</text><text x="180" y="254">t=0 消耗 5 → t=2s 有 1</text>
<path d="M180 268V302" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="307" width="312" height="98" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="335">请求到达 → 应用经过时间</text><text x="180" y="361">原子地尝试消耗 1 个令牌</text><text x="180" y="388" font-size="12">tryConsumeAndReturnRemaining(1)</text>
<path d="M100 405V453" stroke="#496b57" marker-end="url(#arrow)"/><text x="74" y="435">成功</text>
<path d="M265 405V453" stroke="#496b57" marker-end="url(#arrow)"/><text x="294" y="435">不足</text>
<rect x="16" y="458" width="159" height="110" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="95" y="486">消耗 1 个令牌</text><text x="95" y="513">继续业务</text><text x="95" y="542">演示：HTTP 200</text>
<rect x="187" y="458" width="157" height="110" rx="9" fill="#f9e8d9" stroke="#ba946e"/>
<text x="265" y="486" textLength="126" lengthAdjust="spacingAndGlyphs">无需等待补充</text><text x="265" y="513">HTTP 429</text><text x="265" y="542" textLength="126" lengthAdjust="spacingAndGlyphs">Retry-After：等待秒数</text>
<rect x="24" y="608" width="312" height="113" rx="9" fill="#fff" stroke="#a9b6a8"/>
<text x="180" y="636" font-weight="700">补充量是根据经过的时间计算的</text><text x="180" y="663">不要每次请求都创建令牌桶</text><text x="180" y="689">没有注册单独的调度程序</text><text x="180" y="710" font-size="12">该图涵盖了单个本地 JVM</text>
<rect x="24" y="759" width="312" height="147" rx="9" fill="#f4e2df" stroke="#b88880"/>
<text x="180" y="789" font-weight="700">两个独立本地令牌桶</text><text x="180" y="817" textLength="280" lengthAdjust="spacingAndGlyphs">令牌桶 A：初始 5 / B：初始 5</text><text x="180" y="846">无共享状态：合计最多 10 次</text><text x="180" y="875">全局限制需要分布式存储</text>
<text x="180" y="954" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">容量与补充速率是不同策略值</text>
</g></svg>
