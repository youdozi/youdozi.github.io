<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" xml:lang="zh-CN" role="img" aria-labelledby="title desc">
<title id="title">Redis Lua 固定窗口限流流程</title>
<desc id="desc">按可信主体选择请求的键，在 Lua 中检查策略、计数器与过期时间。未超限时使用首次 SET PX 或后续 INCR 记录准入并返回 200；超限时不改变状态，返回 429 与 Retry-After。连接或状态错误返回 503。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#476455"/></marker></defs>
<rect width="360" height="1000" rx="16" fill="#f5f7f2"/>
<g font-family="system-ui,sans-serif" font-size="12" text-anchor="middle" fill="#203a2c">
<text x="180" y="33" font-size="12" font-weight="700">Lua 一次判断并更新</text>
<rect x="24" y="54" width="312" height="66" rx="9" fill="#e0ecdf" stroke="#829b83"/>
<text x="180" y="80">请求 → 服务器选择限流键</text><text x="180" y="103">示例所有请求使用同一账户</text>
<path d="M180 120V149" stroke="#476455" marker-end="url(#arrow)"/>
<rect x="24" y="153" width="312" height="78" rx="9" fill="#e5edf4" stroke="#839aae"/>
<text x="180" y="180">开始执行 Redis Lua</text><text x="180" y="203">验证策略 → GET → PTTL</text><text x="180" y="222" font-size="12">其他命令无法插入执行</text>
<path d="M180 231V260" stroke="#476455" marker-end="url(#arrow)"/>
<rect x="24" y="264" width="312" height="60" rx="9" fill="#e5edf4" stroke="#839aae"/>
<text x="180" y="289">无键，或计数与 TTL 有效</text><text x="180" y="311">还有额度吗？</text>
<path d="M112 324V365" stroke="#476455" marker-end="url(#arrow)"/><text x="87" y="350">有</text>
<path d="M270 324V365" stroke="#476455" marker-end="url(#arrow)"/><text x="296" y="350">无</text>
<rect x="16" y="370" width="185" height="113" rx="9" fill="#e0ecdf" stroke="#829b83"/>
<text x="108" y="396">无键：SET 1 PX</text><text x="108" y="419">有键：INCR</text><text x="108" y="443">不延长 TTL</text><text x="108" y="466">返回允许、剩余数、TTL</text>
<rect x="214" y="370" width="130" height="113" rx="9" fill="#fae8d8" stroke="#b58b60"/>
<text x="279" y="399">不写入</text><text x="279" y="425">拒绝·0·TTL</text><text x="279" y="451">返回</text>
<path d="M108 483V520" stroke="#476455" marker-end="url(#arrow)"/>
<path d="M279 483V520" stroke="#476455" marker-end="url(#arrow)"/>
<rect x="16" y="525" width="185" height="67" rx="9" fill="#e0ecdf" stroke="#829b83"/>
<text x="108" y="552">继续处理业务</text><text x="108" y="576">示例：HTTP 200</text>
<rect x="214" y="525" width="130" height="67" rx="9" fill="#fae8d8" stroke="#b58b60"/>
<text x="279" y="552">HTTP 429</text><text x="279" y="576">Retry-After</text>
<path d="M24 190H8V614H180V624" fill="none" stroke="#ba817c" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="24" y="628" width="312" height="112" rx="9" fill="#f5e1df" stroke="#ba817c"/>
<text x="180" y="656" font-weight="700">错误路径</text>
<text x="180" y="681">连接失败、超时或计数无效</text><text x="180" y="704">→ HTTP 503，不处理业务</text><text x="180" y="727" font-size="12">出错时已有写入不会自动回滚</text>
<rect x="24" y="775" width="312" height="137" rx="9" fill="#fff" stroke="#a9b3a7"/>
<text x="180" y="805" font-weight="700">10 秒 3 次示例的边界</text><text x="180" y="833">首次允许请求时窗口开始</text><text x="180" y="859">TTL 到期后下一次请求开启窗口</text><text x="180" y="885">不限制任意连续 10 秒</text>
<text x="180" y="957" font-size="12">假设请求共享同一正常 Redis</text>
</g></svg>
