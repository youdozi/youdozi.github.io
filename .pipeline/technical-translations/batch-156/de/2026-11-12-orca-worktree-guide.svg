<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1050" viewBox="0 0 360 1050" xml:lang="de" role="img" aria-labelledby="title desc">
<title id="title">Orca-Ablauf mit Projekt und Worktree</title>
<desc id="desc">Ein Git-Beispiel öffnen und einen Worktree erstellen. Pfad und Branch prüfen, einen Agenten um Änderung einer Datei bitten und Tests sowie Browser im selben Worktree prüfen. Diff gegen den Basis-Branch vergleichen und bei erfüllten Bedingungen selbst committen, sonst Korrektur verlangen.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57" /></marker></defs>
<rect width="360" height="1050" rx="16" fill="#f5f7f2" />
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="15" fill="#203a2c">
<text x="180" y="36" font-size="20" font-weight="700">Orca-Aufgabenablauf</text>
<rect x="24" y="62" width="312" height="72" rx="9" fill="#deebdf" stroke="#86a18b" />
<text x="180" y="90" font-size="15.0" textLength="280" lengthAdjust="spacingAndGlyphs">Git-Repository mit Add Repo öffnen</text><text x="180" y="116">main: Startcode + feste Tests</text>
<path d="M180 134V166" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="171" width="312" height="88" rx="9" fill="#e5edf4" stroke="#839bae" />
<text x="180" y="199" font-size="15.0" textLength="280" lengthAdjust="spacingAndGlyphs">Worktree für die Aufgabe erstellen</text><text x="180" y="224">Zuerst Ordner und Branch prüfen</text><text x="180" y="246" font-size="11.6" textLength="280" lengthAdjust="spacingAndGlyphs">Oberfläche und offene Shell können abweichen</text>
<path d="M180 259V291" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="296" width="312" height="83" rx="9" fill="#faecd6" stroke="#bca274" />
<text x="180" y="324" textLength="280" lengthAdjust="spacingAndGlyphs" font-size="13.4">Agenten um Änderung einer Datei bitten</text><text x="180" y="349" textLength="280" lengthAdjust="spacingAndGlyphs" font-size="13.4">Umfang, Rechte und Abschluss festlegen</text><text x="180" y="370" font-size="12">Prompt allein gewährt keine Rechte</text>
<path d="M180 379V412" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="417" width="312" height="108" rx="9" fill="#deebdf" stroke="#86a18b" />
<text x="180" y="447" font-size="14.5">npm test im selben Worktree starten</text><text x="180" y="473">Entwicklungsserver → Port prüfen</text><text x="180" y="499">Oberfläche im Browser prüfen</text>
<path d="M180 525V558" stroke="#496b57" marker-end="url(#arrow)" />
<rect x="24" y="563" width="312" height="82" rx="9" fill="#e5edf4" stroke="#839bae" />
<text x="180" y="592" font-size="14.5">Diff und Tests mit main vergleichen</text><text x="180" y="620">Erfüllen Änderungen die Regeln?</text>
<path d="M98 645V690" stroke="#496b57" marker-end="url(#arrow)" /><text x="70" y="674">Ja</text>
<path d="M268 645V690" stroke="#496b57" marker-end="url(#arrow)" /><text x="297" y="674">Nein</text>
<rect x="16" y="695" width="158" height="77" rx="9" fill="#deebdf" stroke="#86a18b" />
<text x="95" y="724">Geänderte Datei</text><text x="95" y="751" font-size="14.8" textLength="130" lengthAdjust="spacingAndGlyphs">Selbst committen</text>
<rect x="187" y="695" width="157" height="77" rx="9" fill="#f5e1df" stroke="#b88880" />
<text x="265" y="724" font-size="13.9">Fehler eingrenzen</text><text x="265" y="751" font-size="12.4">Korrektur anfordern</text>
<path d="M344 733H352V338H338" fill="none" stroke="#b88880" stroke-dasharray="4 4" marker-end="url(#arrow)" />
<rect x="24" y="820" width="312" height="118" rx="9" fill="#fff" stroke="#a8b6a7" />
<text x="180" y="850" font-weight="700">Grenzen der Trennung</text><text x="180" y="878" font-size="13.8" textLength="280" lengthAdjust="spacingAndGlyphs">Worktree: Dateien, Branch und Ansicht</text><text x="180" y="906" textLength="280" lengthAdjust="spacingAndGlyphs" font-size="12.1">Auch Ports, DB, Konten und Rechte beachten</text>
<text x="180" y="992" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">Projekt → Pfad → Ergebnisse → Prüfung</text>
</g></svg>