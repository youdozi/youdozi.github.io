<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1170" viewBox="0 0 360 1170" role="img" aria-labelledby="title desc" xml:lang="de">
  <title id="title">Ablauf der Rust-Log-CLI</title>
  <desc id="desc">main prüft ein Dateiargument, öffnet die Datei und übergibt einen BufReader an analyze. Pro Iteration werden höchstens 4097 Byte gelesen; Lesefehler, zu lange Zeilen und ungültiges UTF-8 schlagen fehl. Gültige und ungültige Datensätze werden getrennt gezählt. Bei EOF gibt main sortierte Ergebnisse und Code 0 oder 1 aus; Fehler ergeben Code 2.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="1170" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="18.2" font-weight="bold" textLength="280" lengthAdjust="spacingAndGlyphs">Datei → zählen → Exit-Status</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="25" y="60" width="310" height="74" rx="8" />
      <rect x="25" y="174" width="310" height="100" rx="8" />
      <rect x="25" y="314" width="310" height="100" rx="8" />
      <rect x="25" y="454" width="310" height="74" rx="8" />
      <rect x="25" y="568" width="145" height="90" rx="8" />
      <rect x="190" y="568" width="145" height="90" rx="8" />
      <rect x="25" y="740" width="310" height="82" rx="8" />
      <rect x="25" y="862" width="310" height="82" rx="8" />
      <rect x="25" y="1010" width="310" height="100" rx="8" fill="#f8e8dd" />
    </g>
    <text x="180" y="90" font-size="14.1">main: Argument prüfen · Datei öffnen</text>
    <text x="180" y="116">File → BufReader → analyze</text>
    <text x="180" y="202">Maximal 4097 Byte der Zeile lesen</text>
    <text x="180" y="229">Lesefehler: Err · null: EOF</text>
    <text x="180" y="255">Sonst Länge und UTF-8 prüfen ↓</text>
    <text x="180" y="342">Mehr als 4096 Byte?</text>
    <text x="180" y="369">Ungültiges UTF-8?</text>
    <text x="180" y="396">Jede Bedingung liefert Err</text>
    <text x="180" y="484">Status und Pfad prüfen</text>
    <text x="180" y="510" font-size="14.5">Status 100–599 · Pfad beginnt mit /</text>
    <text x="97" y="595">Gültiges Format</text><text x="97" y="620">valid + 1</text><text x="97" y="644">Statuszähler + 1</text>
    <text x="262" y="595" font-size="15.0" textLength="140" lengthAdjust="spacingAndGlyphs">Ungültiges Format</text><text x="262" y="620">invalid + 1</text><text x="262" y="644" font-size="12.1">Zeile nicht speichern</text>
    <text x="180" y="698">Beide Pfade: nächste Zeile ↑</text>
    <text x="180" y="768">EOF: Ok(Stats) → main</text><text x="180" y="797">Erst dann Ausgabe starten</text>
    <text x="180" y="890">Status sortiert ausgeben · flush</text><text x="180" y="919">invalid = 0: Code 0 / sonst: 1</text>
    <text x="180" y="1040" font-size="11.6" textLength="280" lengthAdjust="spacingAndGlyphs">Fehler: Argument · Datei · Analyse · Ausgabe</text>
    <text x="180" y="1069">main meldet auf stderr · Code 2</text>
    <text x="180" y="1095" font-size="15.0" textLength="280" lengthAdjust="spacingAndGlyphs">Bei Analysefehler keine Ergebnisse</text>
    <text x="180" y="1144" font-size="13">EOF und Fehler separat zusammengefasst</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M180 134V174" /><path d="M180 274V314" /><path d="M180 414V454" />
    <path d="M180 528V548H97V568" /><path d="M180 548H262V568" />
    <path d="M97 658V675H12V224H25" /><path d="M262 658V675H97" />
    <path d="M335 250H348V781H335" /><path d="M180 822V862" />
  </g>
</svg>