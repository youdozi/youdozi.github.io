<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">बिल्ड और IDE की अलग-अलग जाँच</title><desc id="description">Wrapper और IDE के नतीजे मिलाएँ। HTTP टेस्ट उपलब्ध पोर्ट पर चलता है और bootRun तय पोर्ट पर।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">बिल्ड और IDE की अलग-अलग जाँच</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">Gradle प्रोजेक्ट का मूल फ़ोल्डर खोलें</text><text x="180" y="137" text-anchor="middle" font-size="16">JDK और Wrapper जाँचें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">Wrapper बिल्ड विफल है?</text><text x="180" y="263" text-anchor="middle" font-size="16">बिल्ड, डिपेंडेंसी और कोड जाँचें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">केवल IDE में त्रुटि है?</text><text x="180" y="389" text-anchor="middle" font-size="16">Gradle रीलोड करें, रन सेटिंग जाँचें</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">HTTP टेस्ट में JSON और 404 जाँचें</text><text x="180" y="515" text-anchor="middle" font-size="16">सर्वर के लिए उपलब्ध पोर्ट लें</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">ऐप चलाएँ, /greeting पर अनुरोध भेजें</text><text x="180" y="641" text-anchor="middle" font-size="16">पथ और तय पोर्ट जाँचें</text></g></svg>
