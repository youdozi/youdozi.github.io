<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">Java 21 की स्थिर सुविधाएँ</title><desc id="description">सूची का उलटा व्यू और पैटर्न मैचिंग के परिणाम लिखें, फिर वर्चुअल थ्रेड के पूरा होने की प्रतीक्षा करें।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Java 21 की स्थिर सुविधाएँ</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">Java 21 के संगत टूल चुनें</text><text x="180" y="137" text-anchor="middle" font-size="16">प्रीव्यू फ़्लैग के बिना कंपाइल करें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">सूची और उसका उलटा व्यू बनाएँ</text><text x="180" y="263" text-anchor="middle" font-size="16">मूल सूची का पहला तत्व बदलें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">पहला और आखिरी तत्व लिखें</text><text x="180" y="389" text-anchor="middle" font-size="16">उलटा व्यू भी लिखें</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">Point रिकॉर्ड और null का मिलान करें</text><text x="180" y="515" text-anchor="middle" font-size="16">switch के दोनों नतीजे लिखें</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="605" text-anchor="middle" font-size="16">वर्चुअल थ्रेड चलाएँ</text><text x="180" y="629" text-anchor="middle" font-size="16">join से पूरा होने की प्रतीक्षा करें</text><text x="180" y="653" text-anchor="middle" font-size="16">आउटपुट के बाद ही लौटें</text></g></svg>
