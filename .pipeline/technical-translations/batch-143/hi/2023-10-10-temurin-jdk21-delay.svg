<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">बाइनरी का मेटाडेटा जाँचें</title><desc id="description">प्लैटफ़ॉर्म और Java संस्करण जाँचें। चेकसम के प्रारूप और URL की जाँच में आर्काइव डाउनलोड नहीं होता।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">बाइनरी का मेटाडेटा जाँचें</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">curl से एसेट का JSON लें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">ठीक एक एसेट होना चाहिए</text><text x="180" y="263" text-anchor="middle" font-size="16">linux/x64/jdk/hotspot जाँचें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="377" text-anchor="middle" font-size="16">Java का मेजर संस्करण 21 होना चाहिए</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">SHA-256 का प्रारूप जाँचें</text><text x="180" y="515" text-anchor="middle" font-size="16">अपेक्षित HTTPS URL की पुष्टि करें</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="605" text-anchor="middle" font-size="16">संस्करण, नाम, URL और चेकसम लिखें</text><text x="180" y="629" text-anchor="middle" font-size="16">इसमें डाउनलोड की गई फ़ाइल का</text><text x="180" y="653" text-anchor="middle" font-size="16">हैश नहीं जाँचा जाता</text></g></svg>
