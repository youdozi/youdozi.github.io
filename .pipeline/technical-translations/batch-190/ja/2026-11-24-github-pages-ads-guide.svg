<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ja" viewBox="0 0 600 360" role="img" aria-labelledby="title"><title id="title">AdSense の設定と確認</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#486b9b"/></marker></defs><g font-family="sans-serif" fill="#152d4d"><rect x="30" y="35" width="540" height="55" rx="10" fill="#edf3fb" stroke="#486b9b"/><text x="300" y="69" text-anchor="middle" font-size="20">共通 head にアカウントのコードを追加</text><path d="M300 90v20" stroke="#486b9b" marker-end="url(#arrow)"/><rect x="30" y="117" width="540" height="55" rx="10" fill="#edf3fb" stroke="#486b9b"/><text x="300" y="151" text-anchor="middle" font-size="20">ホストのルートに ads.txt を公開</text><path d="M300 172v20" stroke="#486b9b" marker-end="url(#arrow)"/><rect x="30" y="199" width="540" height="55" rx="10" fill="#edf3fb" stroke="#486b9b"/><text x="300" y="233" text-anchor="middle" font-size="20">公開 URL を確認</text><path d="M300 254v20" stroke="#486b9b" marker-end="url(#arrow)"/><rect x="30" y="281" width="540" height="55" rx="10" fill="#edf3fb" stroke="#486b9b"/><text x="300" y="315" text-anchor="middle" font-size="20">所有権を確認して審査を申請</text></g></svg>
