<svg xmlns="http://www.w3.org/2000/svg" width="360" height="936" viewBox="0 0 360 936" role="img" aria-labelledby="title description" xml:lang="hi">
<title id="title">घर पर स्थानीय LLM चलाने का क्रम</title>
<desc id="description">ऑनलाइन स्थापना और डाउनलोड के बाद अपना मॉडल बनाएँ। चुना हुआ नोट जाँचकर स्थानीय API और मॉडल को भेजें। उत्तर जाँचकर मूल से मिलाएँ। जाँच विफल होने पर त्रुटि आती है। उत्तर चलाने के लिए कोई टूल नहीं है।</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#475569"/></marker></defs>
<rect width="360" height="936" rx="12" fill="#f8fafc"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f172a">
<text x="180" y="32" font-size="12" font-weight="600">घर पर स्थानीय LLM</text>
<rect x="16" y="64" width="328" height="86" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="180" y="99" font-size="12">Ollama स्थापित करें, मॉडल डाउनलोड करें</text>
<text x="180" y="123" font-size="12">तैयारी में बाहरी संचार</text>
<path d="M180 150V176" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="183" width="328" height="86" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="180" y="218" font-size="12">Modelfile से कॉन्फ़िगरेशन बनाएँ</text>
<text x="180" y="242" font-size="12">home-assistant</text>
<path d="M180 269V295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="302" width="328" height="86" rx="10" fill="#fef3c7" stroke="#64748b"/>
<text x="180" y="337" font-size="12">चुना नोट: UTF-8, अधिकतम 2000 वर्ण</text>
<text x="180" y="361" font-size="12">खाली या बहुत लंबा इनपुट: त्रुटि</text>
<path d="M180 388V414" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="421" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="180" y="456" font-size="12">स्थानीय API को POST</text>
<text x="180" y="480" font-size="12">127.0.0.1:11434/api/chat</text>
<path d="M180 507V533" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="540" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="180" y="575" font-size="12">चुना हुआ स्थानीय मॉडल चलाएँ</text>
<text x="180" y="599" font-size="12">डिवाइस के अनुसार CPU/GPU</text>
<path d="M180 626V652" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="659" width="328" height="86" rx="10" fill="#fef3c7" stroke="#64748b"/>
<text x="180" y="694" font-size="12">HTTP, समापन और उत्तर की लंबाई जाँचें</text>
<text x="180" y="718" font-size="12">विफलता पर त्रुटि</text>
<path d="M180 745V771" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="778" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="180" y="813" font-size="12">परिणाम को मूल नोट से मिलाएँ</text>
<text x="180" y="837" font-size="12">न फ़ाइल बदलती है, न कमांड चलती है</text>
<text x="180" y="918" font-size="13">स्थानीय मॉडल चुनें, क्लाउड बंद रखें</text>
</g></svg>
