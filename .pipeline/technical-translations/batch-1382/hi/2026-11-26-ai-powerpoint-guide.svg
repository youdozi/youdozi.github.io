<svg xmlns="http://www.w3.org/2000/svg" xml:lang="hi" viewBox="0 0 440 310" role="img" aria-labelledby="title desc">
<title id="title">AI से PowerPoint: रूपरेखा से संपादन योग्य स्लाइड तक</title>
<desc id="desc">श्रोता और निर्णय तय करें, रूपरेखा जाँचें और संपादन योग्य स्लाइड बनाएँ। स्रोत से मिलाकर स्लाइड शो में देखें।</desc>
<rect width="440" height="310" rx="12" fill="#f3f6fa"/>
<g font-family="system-ui, sans-serif" fill="#163849">
<rect x="12" y="12" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="44" font-size="22" font-weight="700">रूपरेखा बनाएँ</text>
<text x="28" y="72" font-size="17">श्रोता, निर्णय और आधार</text>
<path d="M220 93v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="114" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="146" font-size="22" font-weight="700">PowerPoint बनाएँ</text>
<text x="28" y="174" font-size="17">संपादन योग्य तालिकाएँ, आकृतियाँ और वक्ता के नोट्स</text>
<path d="M220 195v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="216" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="248" font-size="22" font-weight="700">स्लाइड जाँचें</text>
<text x="28" y="276" font-size="17">स्रोत से मिलाएँ, संपादन और स्लाइड शो में देखें</text>
</g>
</svg>
