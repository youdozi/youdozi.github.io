<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="de"><title id="title">Allokation und Referenzen</title><desc id="description">64 Slots anlegen, Allokation, Byte-Setzung, Referenztausch und Prüfsummenbildung 8192-mal wiederholen, dann das Ergebnis ausgeben. Die JVM bestimmt die Speicherfreigabe; sie ist kein expliziter Codeschritt.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Allokation und Referenzen</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">64 Referenzslots anlegen</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="251" text-anchor="middle" font-size="16">Array mit 128 KiB allokieren</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">Erstes Byte setzen</text><text x="180" y="389" text-anchor="middle" font-size="16">Zyklische Slotreferenz ersetzen</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">Prüfsumme aufsummieren</text><text x="180" y="515" text-anchor="middle" font-size="16">8192 Iterationen durchlaufen</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">Slots und Prüfsumme ausgeben</text><text x="180" y="641" text-anchor="middle" font-size="16">JVM bestimmt Speicherfreigabe</text><path d="M 342 497 H 386 V 245 H 342" fill="none" stroke="#2b6044" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="389" y="371" font-size="13">↻</text></g></svg>
