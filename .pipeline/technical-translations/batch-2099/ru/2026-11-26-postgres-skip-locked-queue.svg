<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ru" viewBox="0 0 424 290" role="img" aria-labelledby="title desc">
<title id="title">Очередь задач в PostgreSQL с SKIP LOCKED: что будет, если обработчик остановится?</title>
<desc id="desc">A блокирует задачу 1, а B пропускает её и берёт задачу 2. Когда B фиксирует транзакцию, а A откатывает свою, первая задача снова ждёт обработки, а вторая остаётся в работе.</desc>
<g font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#183d49">
<rect x="4" y="5" width="416" height="43" rx="7" fill="#eaf3f5"/>
<text x="212" y="32" font-size="15">Две задачи в очереди</text>
<path d="M212 48v12m-4 -4 4 4 4 -4" fill="none" stroke="#50717a" stroke-width="2"/>
<rect x="4" y="63" width="416" height="43" rx="7" fill="#f9efdc"/>
<text x="212" y="90" font-size="15">A блокирует задачу 1</text>
<path d="M212 106v12m-4 -4 4 4 4 -4" fill="none" stroke="#50717a" stroke-width="2"/>
<rect x="4" y="121" width="416" height="43" rx="7" fill="#f9efdc"/>
<text x="212" y="148" font-size="15">B пропускает задачу 1 и блокирует 2</text>
<path d="M212 164v12m-4 -4 4 4 4 -4" fill="none" stroke="#50717a" stroke-width="2"/>
<rect x="4" y="179" width="416" height="43" rx="7" fill="#eaf3f5"/>
<text x="212" y="206" font-size="15">Фиксация B → откат A → отключение B</text>
<path d="M212 222v12m-4 -4 4 4 4 -4" fill="none" stroke="#50717a" stroke-width="2"/>
<rect x="4" y="237" width="416" height="43" rx="7" fill="#dfefe6"/>
<text x="212" y="264" font-size="15">1 · pending     /     2 · running</text>
</g>
</svg>
