<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">लॉग से जाँच के संकेत</title><desc id="description">एक ही पहचान और कार्य में बाहरी सामग्री पढ़ने के बाद 300 सेकंड तक अस्वीकृत ट्रांसफ़र खोजें।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">लॉग से जाँच के संकेत</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">घटनाएँ समयक्रम में रखें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">हर घटना पढ़ें</text><text x="180" y="263" text-anchor="middle" font-size="16">पढ़ने का नवीनतम समय रखें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="377" text-anchor="middle" font-size="16">क्या बाहर डेटा भेजने पर रोक लगी?</text><path d="M 342 371 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="371" r="12" fill="#2b6044"/><text x="384" y="377" text-anchor="middle" font-size="19" fill="white">✓</text><text x="384" y="404" text-anchor="middle" font-size="10">आगे बढ़ें</text><text x="193" y="439" font-size="12">हाँ</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">इसी पहचान और कार्य में पढ़ाई हुई?</text><text x="180" y="515" text-anchor="middle" font-size="16">समय का अंतर 0 से 300 सेकंड है?</text><path d="M 342 497 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="497" r="12" fill="#2b6044"/><text x="384" y="503" text-anchor="middle" font-size="19" fill="white">✓</text><text x="384" y="530" text-anchor="middle" font-size="10">आगे बढ़ें</text><text x="193" y="565" font-size="12">हाँ</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">जाँच के लिए घटना दर्ज करें</text><text x="180" y="641" text-anchor="middle" font-size="16">अगली घटना देखें</text></g></svg>
