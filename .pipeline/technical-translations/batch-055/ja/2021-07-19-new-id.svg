<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 987" width="420" height="987" role="img" aria-labelledby="title description" xml:lang="ja"><title id="title">ID 正規化の順序</title><desc id="description">図は Optional 版の流れです。ループ版はフィルターと連続するドットの圧縮をまとめ、同じ規則を保ちます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">ID 正規化の順序</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">Locale.ROOT で小文字化</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">許可しない文字を削除</text><text x="180" y="263" text-anchor="middle" font-size="16">a-z、0-9、ドット、_、- を保持</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="377" text-anchor="middle" font-size="16">連続するドットを圧縮</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="503" text-anchor="middle" font-size="16">先頭と末尾のドットを削除</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="629" text-anchor="middle" font-size="16">空なら a に置換</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">最大 15 文字に切り詰め</text><text x="180" y="767" text-anchor="middle" font-size="16">その後で末尾のドットを削除</text><path d="M 180 793 V 826" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="832" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="869" text-anchor="middle" font-size="16">3 文字未満なら末尾を繰り返す</text><text x="180" y="893" text-anchor="middle" font-size="16">正規化した ID を返す</text></g></svg>
