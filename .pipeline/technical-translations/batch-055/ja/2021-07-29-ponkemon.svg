<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 609" width="420" height="609" role="img" aria-labelledby="title description" xml:lang="ja"><title id="title">異なる種類と選択枠</title><desc id="description">異なる種類の数と N/2 の選択制限は、どちらも上限です。問題の条件では、その小さい方を達成できます。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">異なる種類と選択枠</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">すべての種類 ID を読む</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">HashSet に挿入する</text><text x="180" y="263" text-anchor="middle" font-size="16">同じ ID は種類を増やさない</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">kinds = 集合のサイズ</text><text x="180" y="389" text-anchor="middle" font-size="16">slots = nums.length / 2</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">min(kinds, slots) を返す</text><text x="180" y="515" text-anchor="middle" font-size="16">選んだ部分集合ではなく個数</text></g></svg>
