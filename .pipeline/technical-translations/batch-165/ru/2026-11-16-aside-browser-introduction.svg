<svg xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="400" height="460" viewBox="0 0 400 460" role="img" aria-labelledby="title desc"><title id="title">Пример чтения публичной страницы Aside</title><desc id="desc">Вводится публичный URL, через REPL открывается вкладка. Читается снимок, выводятся заголовок и адрес, затем пользователь сверяет их с целевой страницей.</desc><rect width="400" height="460" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="60" rx="9"/><rect x="35" y="111" width="330" height="60" rx="9"/><rect x="35" y="204" width="330" height="60" rx="9"/><rect x="35" y="297" width="330" height="60" rx="9"/></g><rect x="35" y="390" width="330" height="52" rx="9" fill="#f5e9d9"/><text x="200" y="54">Ввод: URL публичной страницы</text><text x="200" y="147">Открыть вкладку в REPL</text><text x="200" y="240">Прочитать снимок страницы</text><text x="200" y="333">Вывести заголовок и URL</text><text x="200" y="422">Сверить с запросом пользователя</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 78v30m-6-8 6 8 6-8M200 171v30m-6-8 6 8 6-8M200 264v30m-6-8 6 8 6-8M200 357v30m-6-8 6 8 6-8"/></g></g></svg>
