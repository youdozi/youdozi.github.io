<svg xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-labelledby="title desc">
<title id="title">Запрос и подтверждение задачи Pickle</title><desc id="desc">Задать условия, отправить запрос и проверить нужные данные и карточку подтверждения. Если условия не подходят, остановиться; если подходят, продолжить и проверить внешний результат.</desc>
<rect width="400" height="500" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#183a2c"><rect x="40" y="15" width="320" height="62" rx="10" fill="#dcf1e5"/><text x="200" y="42">Цель, условия и запреты</text><text x="200" y="65">в запросе через чат</text><path d="M200 77v32" stroke="#357858" stroke-width="3"/><path d="M193 101l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="40" y="112" width="320" height="64" rx="10" fill="#dcf1e5"/><text x="200" y="138">Проверить вопросы и варианты</text><text x="200" y="161">Прочитать условия карточки</text><path d="M200 176v32" stroke="#357858" stroke-width="3"/><path d="M193 200l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="40" y="211" width="320" height="58" rx="10" fill="#e8eee9"/><text x="200" y="246">Можно принять условия?</text><path d="M110 269v30 M290 269v30" stroke="#357858" stroke-width="3"/><text x="110" y="322">Нет</text><text x="290" y="322">Да</text><rect x="30" y="339" width="150" height="61" rx="10" fill="#f6e6dc"/><text x="105" y="365">Не одобрять,</text><text x="105" y="388" font-size="15">изменить условия</text><rect x="220" y="339" width="150" height="61" rx="10" fill="#dcf1e5"/><text x="295" y="365">Одобрить</text><text x="295" y="388">и выполнить</text><path d="M295 400v27" stroke="#357858" stroke-width="3"/><path d="M288 419l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="125" y="432" width="245" height="48" rx="10" fill="#dcf1e5"/><text x="247" y="461" font-size="12">Сверить результат и подтверждение</text></g></svg>
