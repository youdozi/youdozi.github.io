<svg xml:lang="ru" xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc"><title id="title">Проверка результатов исследования Aside</title><desc id="desc">Указываются три официальных URL и формат вывода. Созданный CSV проверяется кодом и исправляется при ошибке. Даже прошедший проверку файл сравнивают по смыслу с оригиналом.</desc><rect width="400" height="550" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="64" rx="9"/><rect x="35" y="120" width="330" height="64" rx="9"/><rect x="35" y="222" width="330" height="64" rx="9"/></g><rect x="35" y="324" width="330" height="68" rx="9" fill="#f5e9d9"/><rect x="35" y="430" width="330" height="92" rx="9" fill="#dcefe4"/><text x="200" y="45">Ввод: три официальных URL</text><text x="200" y="69">Задать формат и рабочую папку</text><text x="200" y="147">Поручить исследование Aside</text><text x="200" y="171">Проверить сохранение CSV</text><text x="200" y="249">Проверить столбцы, строки, URL</text><text x="200" y="273">Запустить check_report.py</text><text x="200" y="351">Ошибка: исправить файл, запрос</text><text x="200" y="377">Успех: сравнить с оригиналом</text><text x="200" y="458">Проверить факты, условия, пропуски</text><text x="200" y="484">Человек сверяет ссылки оригинала</text><text x="200" y="509">Проверки кодом недостаточно</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 82v35m-6-8 6 8 6-8M200 184v35m-6-8 6 8 6-8M200 286v35m-6-8 6 8 6-8M200 392v35m-6-8 6 8 6-8"/></g></g></svg>
