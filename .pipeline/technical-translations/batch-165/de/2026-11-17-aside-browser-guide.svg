<svg xml:lang="de" xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc"><title id="title">Aside: Rechercheergebnisse prüfen</title><desc id="desc">Drei offizielle URLs und das Ausgabeformat vorgeben. Die erzeugte CSV per Code prüfen und Fehler korrigieren. Auch bestandene Dateien mit dem Sinn des Originals vergleichen.</desc><rect width="400" height="550" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="64" rx="9"/><rect x="35" y="120" width="330" height="64" rx="9"/><rect x="35" y="222" width="330" height="64" rx="9"/></g><rect x="35" y="324" width="330" height="68" rx="9" fill="#f5e9d9"/><rect x="35" y="430" width="330" height="92" rx="9" fill="#dcefe4"/><text x="200" y="45">Eingabe: drei offizielle URLs</text><text x="200" y="69">Format und Arbeitsordner angeben</text><text x="200" y="147">Recherche bei Aside anfragen</text><text x="200" y="171">Gespeicherte CSV prüfen</text><text x="200" y="249">Spalten, Zeilen und URLs prüfen</text><text x="200" y="273">check_report.py ausführen</text><text x="200" y="351">Fehler: Datei und Auftrag ändern</text><text x="200" y="377">Bestanden: Original vergleichen</text><text x="200" y="458">Fakten, Bedingungen, Lücken prüfen</text><text x="200" y="484">Originalquellen selbst abgleichen</text><text x="200" y="509">Codeprüfung allein genügt nicht</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 82v35m-6-8 6 8 6-8M200 184v35m-6-8 6 8 6-8M200 286v35m-6-8 6 8 6-8M200 392v35m-6-8 6 8 6-8"/></g></g></svg>
