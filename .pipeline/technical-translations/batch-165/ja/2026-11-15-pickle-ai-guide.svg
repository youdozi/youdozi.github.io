<svg xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-labelledby="title desc">
<title id="title">Pickle の作業依頼と確認の流れ</title><desc id="desc">条件を決めて依頼し、必要な情報と確認カードを確認する。同意できなければ止め、同意できれば進めて外部の結果を確認する。</desc>
<rect width="400" height="500" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#183a2c"><rect x="40" y="15" width="320" height="62" rx="10" fill="#dcf1e5"/><text x="200" y="42">目標・条件・禁止行動を</text><text x="200" y="65">チャットで依頼</text><path d="M200 77v32" stroke="#357858" stroke-width="3"/><path d="M193 101l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="40" y="112" width="320" height="64" rx="10" fill="#dcf1e5"/><text x="200" y="138">追加質問と選択肢を確認</text><text x="200" y="161">確認カードの条件を見る</text><path d="M200 176v32" stroke="#357858" stroke-width="3"/><path d="M193 200l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="40" y="211" width="320" height="58" rx="10" fill="#e8eee9"/><text x="200" y="246">条件に同意できるか？</text><path d="M110 269v30 M290 269v30" stroke="#357858" stroke-width="3"/><text x="110" y="322">いいえ</text><text x="290" y="322">はい</text><rect x="30" y="339" width="150" height="61" rx="10" fill="#f6e6dc"/><text x="105" y="365">承認せずに</text><text x="105" y="388">条件を修正</text><rect x="220" y="339" width="150" height="61" rx="10" fill="#dcf1e5"/><text x="295" y="365">承認して</text><text x="295" y="388">作業を進める</text><path d="M295 400v27" stroke="#357858" stroke-width="3"/><path d="M288 419l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="125" y="432" width="245" height="48" rx="10" fill="#dcf1e5"/><text x="247" y="461">結果と外部の確認内容を照合</text></g></svg>
