<svg xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="400" height="460" viewBox="0 0 400 460" role="img" aria-labelledby="title desc"><title id="title">Aside の公開ページ参照例</title><desc id="desc">公開 URL を入力し、REPL でタブを開く。スナップショットを読んでタイトルと URL を出力し、ユーザーが対象ページと照合する。</desc><rect width="400" height="460" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="60" rx="9"/><rect x="35" y="111" width="330" height="60" rx="9"/><rect x="35" y="204" width="330" height="60" rx="9"/><rect x="35" y="297" width="330" height="60" rx="9"/></g><rect x="35" y="390" width="330" height="52" rx="9" fill="#f5e9d9"/><text x="200" y="54">入力：公開ページの URL</text><text x="200" y="147">REPL でタブを開く</text><text x="200" y="240">ページスナップショットを読む</text><text x="200" y="333">タイトルと URL を出力</text><text x="200" y="422">ユーザーが依頼対象と照合</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 78v30m-6-8 6 8 6-8M200 171v30m-6-8 6 8 6-8M200 264v30m-6-8 6 8 6-8M200 357v30m-6-8 6 8 6-8"/></g></g></svg>
