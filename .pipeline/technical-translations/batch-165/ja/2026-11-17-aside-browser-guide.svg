<svg xml:lang="ja" xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc"><title id="title">Aside の調査結果を確認する流れ</title><desc id="desc">三つの公式 URL と出力形式を依頼する。生成された CSV をコードで検査し、失敗したら修正する。通過したファイルも原文の意味と照合する。</desc><rect width="400" height="550" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="64" rx="9"/><rect x="35" y="120" width="330" height="64" rx="9"/><rect x="35" y="222" width="330" height="64" rx="9"/></g><rect x="35" y="324" width="330" height="68" rx="9" fill="#f5e9d9"/><rect x="35" y="430" width="330" height="92" rx="9" fill="#dcefe4"/><text x="200" y="45">入力：三つの公式 URL</text><text x="200" y="69">出力形式・作業フォルダー指定</text><text x="200" y="147">Aside に調査を依頼</text><text x="200" y="171">CSV の保存結果を確認</text><text x="200" y="249">コードで列・行・URL を検査</text><text x="200" y="273">check_report.py を実行</text><text x="200" y="351">失敗：ファイルと依頼を修正</text><text x="200" y="377">通過：原文の照合に進む</text><text x="200" y="458">要約の事実・条件・欠落を確認</text><text x="200" y="484">人が原文リンクと照合</text><text x="200" y="509">コード通過だけで完了にしない</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 82v35m-6-8 6 8 6-8M200 184v35m-6-8 6 8 6-8M200 286v35m-6-8 6 8 6-8M200 392v35m-6-8 6 8 6-8"/></g></g></svg>
