<svg xml:lang="es" xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc"><title id="title">Verificación de investigación con Aside</title><desc id="desc">Se indican tres URL oficiales y el formato de salida. El CSV se verifica con código y se corrige si falla. Incluso si pasa, se compara su significado con el original.</desc><rect width="400" height="550" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="64" rx="9"/><rect x="35" y="120" width="330" height="64" rx="9"/><rect x="35" y="222" width="330" height="64" rx="9"/></g><rect x="35" y="324" width="330" height="68" rx="9" fill="#f5e9d9"/><rect x="35" y="430" width="330" height="92" rx="9" fill="#dcefe4"/><text x="200" y="45">Entrada: tres URL oficiales</text><text x="200" y="69">Definir formato y carpeta</text><text x="200" y="147">Pedir investigación a Aside</text><text x="200" y="171">Comprobar el CSV guardado</text><text x="200" y="249">Validar columnas, filas y URL</text><text x="200" y="273">Ejecutar check_report.py</text><text x="200" y="351">Fallo: corregir archivo y solicitud</text><text x="200" y="377">Pasa: contrastar con el original</text><text x="200" y="458" font-size="16">Revisar hechos, condiciones y omisiones</text><text x="200" y="484">Una persona coteja fuentes originales</text><text x="200" y="509">Pasar el código no basta para terminar</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 82v35m-6-8 6 8 6-8M200 184v35m-6-8 6 8 6-8M200 286v35m-6-8 6 8 6-8M200 392v35m-6-8 6 8 6-8"/></g></g></svg>
