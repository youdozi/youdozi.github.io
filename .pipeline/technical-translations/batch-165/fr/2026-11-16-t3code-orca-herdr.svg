<svg xml:lang="fr" xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470" role="img" aria-labelledby="title desc">
<title id="title">Worktrees et revue des tâches parallèles</title><desc id="desc">Créer deux worktrees à partir du commit initial. Y écrire des valeurs différentes, puis vérifier le fichier initial et les deux fichiers modifiés. Examiner ensuite les conflits.</desc>
<rect width="480" height="470" fill="#f8faf8"/><g font-family="sans-serif" font-size="18" fill="#193b2d" text-anchor="middle"><rect x="75" y="15" width="330" height="52" rx="10" fill="#dcefe4"/><text x="240" y="48">Dépôt et commit de départ</text><path d="M240 67v27 M120 94h240 M120 94v26 M360 94v26" fill="none" stroke="#397955" stroke-width="3"/><rect x="20" y="122" width="200" height="84" rx="10" fill="#e5f0fa"/><text x="120" y="153">Worktree A</text><text x="120" y="185">Écrire task A</text><rect x="260" y="122" width="200" height="84" rx="10" fill="#e5f0fa"/><text x="360" y="153">Worktree B</text><text x="360" y="185">Écrire task B</text><path d="M120 206v38 M360 206v38" stroke="#397955" stroke-width="3"/><rect x="20" y="248" width="200" height="65" rx="10" fill="#dcefe4"/><text x="120" y="276">Vérifier fichier A</text><text x="120" y="301">et modifications</text><rect x="260" y="248" width="200" height="65" rx="10" fill="#dcefe4"/><text x="360" y="276">Vérifier fichier B</text><text x="360" y="301">et modifications</text><path d="M120 313v30h240v-30 M240 343v22" fill="none" stroke="#397955" stroke-width="3"/><rect x="55" y="368" width="370" height="72" rx="10" fill="#f5e9d9"/><text x="240" y="397">Vérifier la base, comparer les changements</text><text x="240" y="423">Examiner la fusion réelle séparément</text></g></svg>
