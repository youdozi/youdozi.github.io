<svg xml:lang="fr" xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc"><title id="title">Aside : vérifier les résultats de recherche</title><desc id="desc">Indiquer trois URL officielles et le format de sortie. Vérifier le CSV généré par code, corriger les échecs, puis comparer même le fichier validé au sens de l’original.</desc><rect width="400" height="550" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="64" rx="9"/><rect x="35" y="120" width="330" height="64" rx="9"/><rect x="35" y="222" width="330" height="64" rx="9"/></g><rect x="35" y="324" width="330" height="68" rx="9" fill="#f5e9d9"/><rect x="35" y="430" width="330" height="92" rx="9" fill="#dcefe4"/><text x="200" y="45">Entrée : trois URL officielles</text><text x="200" y="69">Préciser format et dossier</text><text x="200" y="147">Demander la recherche à Aside</text><text x="200" y="171">Vérifier le CSV enregistré</text><text x="200" y="249">Vérifier colonnes, lignes et URL</text><text x="200" y="273">Exécuter check_report.py</text><text x="200" y="351">Échec : corriger fichier et demande</text><text x="200" y="377">Réussite : comparer à l’original</text><text x="200" y="458">Vérifier faits, conditions et oublis</text><text x="200" y="484">Comparer aux sources soi-même</text><text x="200" y="509">Le code seul ne suffit pas</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 82v35m-6-8 6 8 6-8M200 184v35m-6-8 6 8 6-8M200 286v35m-6-8 6 8 6-8M200 392v35m-6-8 6 8 6-8"/></g></g></svg>
