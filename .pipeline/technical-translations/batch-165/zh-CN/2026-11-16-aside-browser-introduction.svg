<svg xml:lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="400" height="460" viewBox="0 0 400 460" role="img" aria-labelledby="title desc"><title id="title">Aside 查询公开页面的示例</title><desc id="desc">输入公开 URL，通过 REPL 打开标签页。读取快照并输出标题和地址，再由用户与目标页面核对。</desc><rect width="400" height="460" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="60" rx="9"/><rect x="35" y="111" width="330" height="60" rx="9"/><rect x="35" y="204" width="330" height="60" rx="9"/><rect x="35" y="297" width="330" height="60" rx="9"/></g><rect x="35" y="390" width="330" height="52" rx="9" fill="#f5e9d9"/><text x="200" y="54">输入：公开页面 URL</text><text x="200" y="147">在 REPL 中打开标签页</text><text x="200" y="240">读取页面快照</text><text x="200" y="333">输出标题与 URL</text><text x="200" y="422">用户与请求的目标核对</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 78v30m-6-8 6 8 6-8M200 171v30m-6-8 6 8 6-8M200 264v30m-6-8 6 8 6-8M200 357v30m-6-8 6 8 6-8"/></g></g></svg>
