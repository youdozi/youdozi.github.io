<svg xml:lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc"><title id="title">Aside 调查结果确认流程</title><desc id="desc">请求时指定三个官方 URL 和输出格式。用代码检查生成的 CSV，失败则修改。通过的文件仍需与原文含义核对。</desc><rect width="400" height="550" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="64" rx="9"/><rect x="35" y="120" width="330" height="64" rx="9"/><rect x="35" y="222" width="330" height="64" rx="9"/></g><rect x="35" y="324" width="330" height="68" rx="9" fill="#f5e9d9"/><rect x="35" y="430" width="330" height="92" rx="9" fill="#dcefe4"/><text x="200" y="45">输入：三个官方 URL</text><text x="200" y="69">指定输出格式和任务文件夹</text><text x="200" y="147">向 Aside 请求调查</text><text x="200" y="171">检查 CSV 保存结果</text><text x="200" y="249">用代码检查列、行、URL</text><text x="200" y="273">运行 check_report.py</text><text x="200" y="351">失败：修改文件和请求</text><text x="200" y="377">通过：进入原文核对</text><text x="200" y="458">确认摘要事实、条件及遗漏</text><text x="200" y="484">由人与原文链接核对</text><text x="200" y="509">不能仅凭代码通过就视为完成</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 82v35m-6-8 6 8 6-8M200 184v35m-6-8 6 8 6-8M200 286v35m-6-8 6 8 6-8M200 392v35m-6-8 6 8 6-8"/></g></g></svg>
