<svg xml:lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470" role="img" aria-labelledby="title desc">
<title id="title">并行任务中的工作树与审查流程</title><desc id="desc">从基准提交创建两个工作树。在各工作树中写入不同的值，分别检查基准文件和两个变更文件，之后审查冲突。</desc>
<rect width="480" height="470" fill="#f8faf8"/><g font-family="sans-serif" font-size="18" fill="#193b2d" text-anchor="middle"><rect x="75" y="15" width="330" height="52" rx="10" fill="#dcefe4"/><text x="240" y="48">基准仓库与基准提交</text><path d="M240 67v27 M120 94h240 M120 94v26 M360 94v26" fill="none" stroke="#397955" stroke-width="3"/><rect x="20" y="122" width="200" height="84" rx="10" fill="#e5f0fa"/><text x="120" y="153">工作树 A</text><text x="120" y="185">写入 task A</text><rect x="260" y="122" width="200" height="84" rx="10" fill="#e5f0fa"/><text x="360" y="153">工作树 B</text><text x="360" y="185">写入 task B</text><path d="M120 206v38 M360 206v38" stroke="#397955" stroke-width="3"/><rect x="20" y="248" width="200" height="65" rx="10" fill="#dcefe4"/><text x="120" y="276">检查 A 文件</text><text x="120" y="301">和变更列表</text><rect x="260" y="248" width="200" height="65" rx="10" fill="#dcefe4"/><text x="360" y="276">检查 B 文件</text><text x="360" y="301">和变更列表</text><path d="M120 313v30h240v-30 M240 343v22" fill="none" stroke="#397955" stroke-width="3"/><rect x="55" y="368" width="370" height="72" rx="10" fill="#f5e9d9"/><text x="240" y="397">确认基准文件后比较变更</text><text x="240" y="423">实际合并需另行审查</text></g></svg>
