<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 987" width="420" height="987" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">प्रकाशन की अनुमति</title><desc id="description">प्रकाशन के लिए नीति, अनुमोदन, दायरा, समाप्ति और दोबारा उपयोग जाँचें। पढ़ने और मसौदा संपादन की तत्काल अनुमति चित्र में नहीं दिखाई गई है।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">प्रकाशन की अनुमति</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">प्रकाशन का</text><text x="180" y="137" text-anchor="middle" font-size="16">संरचित अनुरोध</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">कार्रवाई और लक्ष्य</text><text x="180" y="263" text-anchor="middle" font-size="16">नीति में अनुमत हैं?</text><path d="M 342 245 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="245" r="12" fill="#8c3a32"/><text x="384" y="251" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="278" text-anchor="middle" font-size="10">नीति रोक</text><text x="193" y="313" font-size="12">हाँ</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">विश्वसनीय अनुमोदन</text><text x="180" y="389" text-anchor="middle" font-size="16">उपलब्ध है?</text><path d="M 342 371 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="371" r="12" fill="#8c3a32"/><text x="384" y="377" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="404" text-anchor="middle" font-size="10">अनुमति लें</text><text x="193" y="439" font-size="12">हाँ</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">पहचान और अनुरोध</text><text x="180" y="515" text-anchor="middle" font-size="16">मेल खाते हैं?</text><path d="M 342 497 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="497" r="12" fill="#8c3a32"/><text x="384" y="503" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="530" text-anchor="middle" font-size="10">बेमेल</text><text x="193" y="565" font-size="12">हाँ</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="629" text-anchor="middle" font-size="16">अनुमोदन अभी वैध है?</text><path d="M 342 623 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="623" r="12" fill="#8c3a32"/><text x="384" y="629" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="656" text-anchor="middle" font-size="10">अवधि पूरी</text><text x="193" y="691" font-size="12">हाँ</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="755" text-anchor="middle" font-size="16">अनुमोदन अब तक अप्रयुक्त है?</text><path d="M 342 749 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="749" r="12" fill="#8c3a32"/><text x="384" y="755" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="782" text-anchor="middle" font-size="10">प्रयुक्त</text><text x="193" y="817" font-size="12">हाँ</text><path d="M 180 793 V 826" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="832" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="869" text-anchor="middle" font-size="16">अनुमोदन खर्च करें</text><text x="180" y="893" text-anchor="middle" font-size="16">ALLOW लौटाएँ</text></g></svg>
