<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="zh-CN"><title id="title">选择本地 HTTP 响应</title><desc id="description">处理器先选择状态与表示，再写入响应头。204 分支不含正文或 Content-Length，其他路由写入声明的字节数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">选择本地 HTTP 响应</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">接收本地 GET 请求</text><text x="180" y="137" text-anchor="middle" font-size="16">选择受支持的路由</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">未知路径或状态？</text><text x="180" y="263" text-anchor="middle" font-size="16">使用模拟服务的 JSON 404</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">状态 204：结束响应头并返回</text><text x="180" y="389" text-anchor="middle" font-size="16">没有 Content-Length 或正文</text><path d="M 342 371 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="371" r="12" fill="#2b6044"/><text x="384" y="377" text-anchor="middle" font-size="19" fill="white">✓</text><text x="384" y="404" text-anchor="middle" font-size="10">204</text><text x="193" y="439" font-size="12">其他</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">其他状态：选择 JSON 或 HTML</text><text x="180" y="515" text-anchor="middle" font-size="16">设置媒体类型与字节长度</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">写入响应头和正文</text><text x="180" y="641" text-anchor="middle" font-size="16">分别检查每个响应</text></g></svg>
