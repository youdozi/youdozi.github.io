<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="ru"><title id="title">LRU-кеш с порядком доступа</title><desc id="description">При нулевой ёмкости результат возвращается сразу. Иначе get/put обновляют порядок обращений, а переполнение вытесняет ключ с самым давним доступом.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">LRU-кеш с порядком доступа</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">Ёмкость 0: вернуть 5 × запросы</text><text x="180" y="137" text-anchor="middle" font-size="16">Иначе следовать стрелкам</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">Один раз создать map доступа</text><text x="180" y="263" text-anchor="middle" font-size="16">Инициализировать cost = 0</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">Прочитать следующий город</text><text x="180" y="389" text-anchor="middle" font-size="16">Нижний регистр: Locale.ROOT</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="479" text-anchor="middle" font-size="16">get(key): попадание +1</text><text x="180" y="503" text-anchor="middle" font-size="16">Промах: +5</text><text x="180" y="527" text-anchor="middle" font-size="16">put(key): последний доступ</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">Сверх ёмкости? Удалить первый</text><text x="180" y="641" text-anchor="middle" font-size="16">Иначе сохранить все ключи</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="731" text-anchor="middle" font-size="16">Ещё есть города?</text><text x="180" y="755" text-anchor="middle" font-size="16">Да: повторить</text><text x="180" y="779" text-anchor="middle" font-size="16">Нет: вернуть стоимость</text><path d="M 342 749 H 386 V 371 H 342" fill="none" stroke="#2b6044" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="389" y="560" font-size="13">Да</text></g></svg>
