<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="es"><title id="title">Caché LRU por orden de acceso</title><desc id="description">Con capacidad cero se devuelve inmediatamente el resultado. En otro caso get/put actualizan el uso reciente y el desbordamiento expulsa la clave menos recientemente usada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Caché LRU por orden de acceso</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">Capacidad 0: devolver 5 × consultas</text><text x="180" y="137" text-anchor="middle" font-size="16">En otro caso seguir las flechas</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">Crear el mapa por acceso una vez</text><text x="180" y="263" text-anchor="middle" font-size="16">Inicializar cost = 0</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">Leer la siguiente ciudad</text><text x="180" y="389" text-anchor="middle" font-size="16">Minúsculas con Locale.ROOT</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">get(key): acierto +1, fallo +5</text><text x="180" y="515" text-anchor="middle" font-size="16">put(key) lo hace el más reciente</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">¿Excede capacidad? Quitar primero</text><text x="180" y="641" text-anchor="middle" font-size="16">Si no, conservar todas las claves</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">¿Quedan ciudades?</text><text x="180" y="767" text-anchor="middle" font-size="16">Sí: repetir; no: devolver coste</text><path d="M 342 749 H 386 V 371 H 342" fill="none" stroke="#2b6044" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="389" y="560" font-size="13">Sí</text></g></svg>
