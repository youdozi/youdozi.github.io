<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">Vue ऐप से JAR तक</title><desc id="description">हर Vue ऐप का अलग बिल्ड होता है। Gradle Sync केवल उनके आउटपुट इकट्ठे करता है और bootJar उन्हें अलग-अलग स्टैटिक पथ पर रखता है।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Vue ऐप से JAR तक</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">हर ऐप की लॉकफ़ाइल कमिट करें</text><text x="180" y="137" text-anchor="middle" font-size="16">तय संस्करणों की डिपेंडेंसी लें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">हर ऐप में npm ci चलाएँ</text><text x="180" y="263" text-anchor="middle" font-size="16">फिर npm run build</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">दोनों dist निर्देशिकाएँ Sync करें</text><text x="180" y="389" text-anchor="middle" font-size="16">static/project1 और project2 रखें</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">पहले फ़ाइलें जुटाएँ, फिर bootJar</text><text x="180" y="515" text-anchor="middle" font-size="16">BOOT-INF/classes में कॉपी करें</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">JAR चलाकर दोनों ऐप के पथ खोलें</text><text x="180" y="641" text-anchor="middle" font-size="16">जाँचें कि नए बंडल मिल रहे हैं</text></g></svg>
