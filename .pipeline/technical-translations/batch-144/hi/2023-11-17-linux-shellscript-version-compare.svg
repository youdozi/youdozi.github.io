<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">संख्यात्मक संस्करणों की तुलना</title><desc id="description">संस्करण का प्रारूप जाँचें, छूटे हुए हिस्से को शून्य मानें और पहली असमान जोड़ी पर रुकें। छोटा होना भी सफल तुलना का परिणाम है।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">संख्यात्मक संस्करणों की तुलना</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">ठीक दो संस्करण लें</text><text x="180" y="137" text-anchor="middle" font-size="16">बिंदुओं के बीच केवल अंक हों</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">हर हिस्से को पूर्णांक बनाएँ</text><text x="180" y="263" text-anchor="middle" font-size="16">विफलता पर कोड 2</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="377" text-anchor="middle" font-size="16">जोड़े मिलाएँ, छूटा हुआ मान = 0</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">पहला अंतर तय करता है &lt; या &gt;</text><text x="180" y="515" text-anchor="middle" font-size="16">सभी बराबर हों तो =</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">संबंध छापें और कोड 0 लौटाएँ</text><text x="180" y="641" text-anchor="middle" font-size="16">परिनियोजन की नीति अलग से लगाएँ</text></g></svg>
