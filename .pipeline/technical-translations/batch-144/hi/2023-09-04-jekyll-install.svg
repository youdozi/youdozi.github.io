<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">Jekyll बिल्ड की अलग जाँच</title><desc id="description">घोषित पुराने बंडल से दो अस्थायी पन्ने बनते हैं। पूरे संग्रह का बिल्ड और समर्थित Ruby संस्करण का चयन इस जाँच से बाहर हैं।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Jekyll बिल्ड की अलग जाँच</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">चुने हुए Ruby और Bundler जाँचें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">अलग Gemfile बनाएँ</text><text x="180" y="263" text-anchor="middle" font-size="16">Jekyll और GFM पार्सर घोषित करें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">बंडल की डिपेंडेंसी हल करें</text><text x="180" y="389" text-anchor="middle" font-size="16">बनी हुई लॉकफ़ाइल सहेजें</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">दो अस्थायी पन्ने बनाएँ</text><text x="180" y="515" text-anchor="middle" font-size="16">वास्तविक पथ और अपनी सेटिंग लें</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">शीर्षक, लिंक और लक्ष्य जाँचें</text><text x="180" y="641" text-anchor="middle" font-size="16">फिर वास्तविक साइट की जाँच करें</text></g></svg>
