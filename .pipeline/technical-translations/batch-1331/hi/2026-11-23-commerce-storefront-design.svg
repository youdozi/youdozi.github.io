<svg xml:lang="hi" xmlns="http://www.w3.org/2000/svg" width="468" height="461" viewBox="0 0 468 461" role="img" aria-labelledby="title desc">
  <title id="title">भुगतान से लौटने पर ऑर्डर की स्थिति</title>
  <desc id="desc">मौजूदा ऑर्डर जाँचें। लोड होते समय प्रतीक्षा का संदेश दें और जाँच विफल होने पर फिर लोड करने दें। स्थिति मिलने पर भुगतान और ऑर्डर के अनुसार स्थिति ताज़ा करने, शिपमेंट ट्रैक करने, उत्पाद देखने, रिफ़ंड की स्थिति ताज़ा करने या रिफ़ंड का विवरण देखने दें।</desc>
  <rect width="468" height="461" rx="16" fill="#f4f7fb"/>
  <path d="M25 66V426 M25 100H44 M25 158H44 M25 225H44 M25 283H44 M25 341H44 M25 399H44" fill="none" stroke="#7185a0" stroke-width="1.6"/>
  <g stroke="#b5c4d6">
    <rect x="15" y="14" width="438" height="52" rx="9" fill="#fff"/>
    <rect x="44" y="80" width="408" height="47" rx="8" fill="#fff"/>
    <rect x="44" y="138" width="408" height="47" rx="8" fill="#fff2e5"/>
    <rect x="44" y="197" width="408" height="56" rx="8" fill="#eef4ff"/>
    <rect x="44" y="263" width="408" height="42" rx="8" fill="#e9f5ec"/>
    <rect x="44" y="321" width="408" height="42" rx="8" fill="#fff"/>
    <rect x="44" y="379" width="408" height="64" rx="8" fill="#eef4ff"/>
  </g>
  <g fill="#203951" font-family="system-ui, sans-serif" font-size="16">
    <text x="34" y="46" font-size="18" font-weight="700">भुगतान से वापसी · ऑर्डर जाँचें</text>
    <text x="61" y="109">लोड हो रहा है · प्रतीक्षा का संदेश</text>
    <text x="61" y="167">जाँच विफल · स्थिति फिर लोड करें</text>
    <text x="61" y="220" font-weight="700">भुगतान अपुष्ट या ऑर्डर की जाँच जारी</text>
    <text x="61" y="243">ऑर्डर की स्थिति ताज़ा करें</text>
    <text x="61" y="289">भुगतान और ऑर्डर पुष्ट · शिपमेंट ट्रैक करें</text>
    <text x="61" y="347">बिना शुल्क रद्द · उत्पाद देखें</text>
    <text x="61" y="403">रिफ़ंड लंबित · रिफ़ंड की स्थिति ताज़ा करें</text>
    <text x="61" y="428">रिफ़ंड पूरा · विवरण देखें</text>
  </g>
</svg>
