<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="ja"><title id="title">DB 処理の受け入れと後処理</title><desc id="description">受け入れ許可と実行許可を順に取得します。取得失敗時は拒否するか、受け入れ許可のみ解放します。両方の許可を取得した後は、DB 処理とクリーンアップの試行が終わってから解放します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">DB 処理の受け入れと後処理</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">受け入れ許可 B+Q の取得を試行</text><text x="180" y="137" text-anchor="middle" font-size="16">空きなし：拒否</text><path d="M 342 119 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="119" r="12" fill="#8c3a32"/><text x="384" y="125" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="152" text-anchor="middle" font-size="10">拒否</text><text x="193" y="187" font-size="12">受け入れ</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">実行許可 B を待つ</text><text x="180" y="263" text-anchor="middle" font-size="16">失敗：受け入れ許可を解放</text><path d="M 342 245 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="245" r="12" fill="#8c3a32"/><text x="384" y="251" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="278" text-anchor="middle" font-size="10">失敗</text><text x="193" y="313" font-size="12">取得済み</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="353" text-anchor="middle" font-size="16">接続取得・トランザクション処理</text><text x="180" y="377" text-anchor="middle" font-size="16">コミットかロールバックを試行</text><text x="180" y="401" text-anchor="middle" font-size="16">接続のクリーンアップを試行</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">取得済みの許可を解放</text><text x="180" y="515" text-anchor="middle" font-size="16">クリーンアップ試行の終了後</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">値を返すか例外を伝播</text><text x="180" y="641" text-anchor="middle" font-size="16">キャンセルで早期解放しない</text></g></svg>
