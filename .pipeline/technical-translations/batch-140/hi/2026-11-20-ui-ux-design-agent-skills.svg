<svg xmlns="http://www.w3.org/2000/svg" xml:lang="hi" width="400" height="478" viewBox="0 0 400 478" role="img" aria-labelledby="title desc">
  <title id="title">बुकिंग रद्द करने के डायलॉग में फ़ोकस</title>
  <desc id="desc">बुकिंग विवरण से डायलॉग खोलें। फ़ोकस बुकिंग रखने के विकल्प पर हो। Escape या बुकिंग रखने से बुकिंग बनी रहती है। Tab के बाद Enter से रद्दीकरण की पुष्टि होती है। हर बार फ़ोकस मूल बटन पर लौटे।</desc>
  <rect width="400" height="478" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="30" y="20" width="340" height="63" rx="10"/>
    <rect x="30" y="111" width="340" height="63" rx="10"/>
    <rect x="15" y="218" width="177" height="108" rx="10"/>
    <rect x="208" y="218" width="177" height="108" rx="10" fill="#f4e8d7"/>
    <rect x="30" y="376" width="340" height="66" rx="10"/>
  </g>
  <path d="M200 83v24m-5-6 5 6 5-6M200 174v19H103v21m-5-6 5 6 5-6M200 193h97v21m-5-6 5 6 5-6M103 326v24h97v22m-5-6 5 6 5-6M297 326v24h-97" fill="none" stroke="#397955" stroke-width="2.5"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="200" y="57">बुकिंग विवरण से डायलॉग खोलें</text>
    <text x="200" y="148">फ़ोकस “बुकिंग रखें” पर जाँचें</text>
    <text x="103" y="250">Escape या Enter</text>
    <text x="103" y="273">“बुकिंग रखें” पर</text>
    <text x="103" y="304">बुकिंग बनी रहती है</text>
    <text x="297" y="250">Tab से पुष्टि पर जाएँ</text>
    <text x="297" y="273">Enter से रद्द करें</text>
    <text x="297" y="304">बुकिंग रद्द हुई</text>
    <text x="200" y="403">डायलॉग बंद होता है</text>
    <text x="200" y="426">फ़ोकस मूल बटन पर लौटता है</text>
  </g>
</svg>
