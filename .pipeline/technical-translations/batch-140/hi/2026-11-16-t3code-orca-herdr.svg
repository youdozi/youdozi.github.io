<svg xml:lang="hi" xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470" role="img" aria-labelledby="title desc">
<title id="title">दो worktree में बदलावों की समीक्षा</title><desc id="desc">मूल कमिट से दो worktree बनाएँ, अलग मान लिखें और मूल फ़ाइल व दोनों की बदलाव सूची जाँचें। मर्ज के टकराव अलग देखें।</desc>
<rect width="480" height="470" fill="#f8faf8"/><g font-family="sans-serif" font-size="18" fill="#193b2d" text-anchor="middle"><rect x="75" y="15" width="330" height="52" rx="10" fill="#dcefe4"/><text x="240" y="48">मूल रिपॉज़िटरी और कमिट</text><path d="M240 67v27 M120 94h240 M120 94v26 M360 94v26" fill="none" stroke="#397955" stroke-width="3"/><rect x="20" y="122" width="200" height="84" rx="10" fill="#e5f0fa"/><text x="120" y="153">Worktree A</text><text x="120" y="185">task A लिखें</text><rect x="260" y="122" width="200" height="84" rx="10" fill="#e5f0fa"/><text x="360" y="153">Worktree B</text><text x="360" y="185">task B लिखें</text><path d="M120 206v38 M360 206v38" stroke="#397955" stroke-width="3"/><rect x="20" y="248" width="200" height="65" rx="10" fill="#dcefe4"/><text x="120" y="276">A की फ़ाइल देखें</text><text x="120" y="301">और बदलाव जाँचें</text><rect x="260" y="248" width="200" height="65" rx="10" fill="#dcefe4"/><text x="360" y="276">B की फ़ाइल देखें</text><text x="360" y="301">और बदलाव जाँचें</text><path d="M120 313v30h240v-30 M240 343v22" fill="none" stroke="#397955" stroke-width="3"/><rect x="55" y="368" width="370" height="72" rx="10" fill="#f5e9d9"/><text x="240" y="397">मूल फ़ाइल से बदलाव मिलाएँ</text><text x="240" y="423">वास्तविक मर्ज की अलग समीक्षा करें</text></g></svg>
