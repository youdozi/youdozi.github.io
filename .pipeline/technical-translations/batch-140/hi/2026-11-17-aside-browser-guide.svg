<svg xml:lang="hi" xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc"><title id="title">Aside की शोध रिपोर्ट की जाँच</title><desc id="desc">तीन आधिकारिक URL और आउटपुट का प्रारूप दें। कोड से CSV जाँचें और त्रुटि सुधारें। सफल जाँच के बाद भी सारांश को मूल पेज से मिलाएँ।</desc><rect width="400" height="550" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="64" rx="9"/><rect x="35" y="120" width="330" height="64" rx="9"/><rect x="35" y="222" width="330" height="64" rx="9"/></g><rect x="35" y="324" width="330" height="68" rx="9" fill="#f5e9d9"/><rect x="35" y="430" width="330" height="92" rx="9" fill="#dcefe4"/><text x="200" y="45">तीन आधिकारिक URL दें</text><text x="200" y="69">प्रारूप और कार्य फ़ोल्डर चुनें</text><text x="200" y="147">Aside से शोध कराएँ</text><text x="200" y="171">सहेजी गई CSV देखें</text><text x="200" y="249">कॉलम, पंक्तियाँ और URL जाँचें</text><text x="200" y="273">check_report.py चलाएँ</text><text x="200" y="351">विफल हो तो फ़ाइल या अनुरोध सुधारें</text><text x="200" y="377">सफल हो तो स्रोत से मिलाएँ</text><text x="200" y="458">तथ्य और छूटी हुई शर्तें जाँचें</text><text x="200" y="484">मूल लिंक से तुलना करें</text><text x="200" y="509">केवल कोड की जाँच पर्याप्त नहीं</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 82v35m-6-8 6 8 6-8M200 184v35m-6-8 6 8 6-8M200 286v35m-6-8 6 8 6-8M200 392v35m-6-8 6 8 6-8"/></g></g></svg>
