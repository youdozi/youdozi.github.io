<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="zh-CN"><title id="title">使用标准格式化 API</title><desc id="description">图中展示的是标准 FormattingExample，而非历史预览示例。它比较三种格式化形式，并检查 MessageFormat 的单引号转义。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">使用标准格式化 API</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">设置 x = 2 与 y = 3</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="251" text-anchor="middle" font-size="16">先计算括号内的 x + y 再拼接</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">String.format 使用 Locale.ROOT</text><text x="180" y="389" text-anchor="middle" font-size="16">使用带编号的整数占位符</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">MessageFormat 使用 Locale.ROOT</text><text x="180" y="515" text-anchor="middle" font-size="16">用 Object 数组传递参数</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">模式中双写单引号</text><text x="180" y="641" text-anchor="middle" font-size="16">输出全部四个示例结果</text></g></svg>
