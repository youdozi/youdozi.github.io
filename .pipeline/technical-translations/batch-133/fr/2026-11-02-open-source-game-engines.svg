<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="fr"><title id="title">Une étape de déplacement</title><desc id="description">Recevoir la position, la direction et le temps écoulé, limiter la norme de la direction, appliquer la vitesse et le temps, contraindre le point aux limites et renvoyer la nouvelle position</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Une étape de déplacement</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">Position, direction, temps écoulé</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">Limiter la norme de la direction</text><text x="180" y="263" text-anchor="middle" font-size="16">à 1 au maximum</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">Appliquer la vitesse et le temps</text><text x="180" y="389" text-anchor="middle" font-size="16">Ajouter le déplacement à la position</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="503" text-anchor="middle" font-size="16">Contraindre le point aux limites</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="629" text-anchor="middle" font-size="16">Renvoyer la nouvelle position</text></g></svg>
