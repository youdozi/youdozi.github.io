<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">डाइजेस्ट प्रस्ताव से प्रकाशन तक</title><desc id="description">लंबित प्रस्ताव न होने पर द्विभाषी सामग्री बनाएँ, उसका कमिट जाँचें और Draft PR खोलें। समीक्षा और मर्ज के बाद main का वर्कफ़्लो डिप्लॉय करता है।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">डाइजेस्ट प्रस्ताव से प्रकाशन तक</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">मेल खाता डाइजेस्ट PR पहले से खुला है?</text><path d="M 342 119 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="119" r="12" fill="#2b6044"/><text x="384" y="125" text-anchor="middle" font-size="19" fill="white">✓</text><text x="384" y="152" text-anchor="middle" font-size="10">हाँ: रुकें</text><text x="193" y="187" font-size="12">नहीं</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">द्विभाषी प्रस्ताव बनाएँ</text><text x="180" y="263" text-anchor="middle" font-size="16">कमिट से पहले स्थानीय जाँच करें</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">प्रस्ताव वाली ब्रांच पुश करें</text><text x="180" y="389" text-anchor="middle" font-size="16">उसका कमिट SHA जाँचें</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">Draft PR और प्रीव्यू खोलें</text><text x="180" y="515" text-anchor="middle" font-size="16">समीक्षा ब्रांच पर जाँच शुरू करें</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">तथ्य और भाषा जाँचें</text><text x="180" y="641" text-anchor="middle" font-size="16">स्वीकृति के बाद तैयार प्रस्ताव मर्ज करें</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">main पर जाँच और डिप्लॉय होता है</text><text x="180" y="767" text-anchor="middle" font-size="16">सार्वजनिक परिणाम देखें</text></g></svg>
