<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 861" width="420" height="861" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">विफल v5 इंस्टेंस का रीस्टार्ट</title><desc id="description">नए स्कीमा पर v5 रीस्टार्ट के परीक्षण में उसी इंस्टेंस का नया निष्पादन केवल विफल स्टेप दोहराता है। इसमें v4 डेटाबेस का माइग्रेशन नहीं होता।</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">विफल v5 इंस्टेंस का रीस्टार्ट</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">नया H2 Batch 5 स्कीमा बनाएँ</text><text x="180" y="137" text-anchor="middle" font-size="16">पहचान तय करने वाले जॉब पैरामीटर बनाएँ</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="251" text-anchor="middle" font-size="16">जॉब शुरू करें: स्टेप 1 पूरा होता है</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">स्टेप 2 एक बार विफल होता है</text><text x="180" y="389" text-anchor="middle" font-size="16">निष्पादन की स्थिति FAILED होती है</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">उन्हीं पैरामीटर से फिर शुरू करें</text><text x="180" y="515" text-anchor="middle" font-size="16">उसी इंस्टेंस का नया निष्पादन</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">पूरा हो चुका स्टेप 1 छोड़ें</text><text x="180" y="641" text-anchor="middle" font-size="16">स्टेप 2 फिर चलता है → COMPLETED</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="743" text-anchor="middle" font-size="16">स्टेप की गिनती 1 और 2 जाँचें</text><text x="180" y="767" text-anchor="middle" font-size="16">JVM की बहाली की गारंटी नहीं</text></g></svg>
