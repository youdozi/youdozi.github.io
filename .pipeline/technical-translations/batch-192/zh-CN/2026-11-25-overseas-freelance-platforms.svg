<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" viewBox="0 0 400 426" role="img" aria-labelledby="title desc">
<title id="title">从哪里接单？</title><desc id="desc">各平台的接单方式。从合同金额扣除服务费、提案及提现成本，再除以提案、交付和验收的总工时。</desc>
<rect width="400" height="426" rx="12" fill="#f2f6fa"/>
<g font-family="system-ui, sans-serif" fill="#183345">
<text x="16" y="34" font-size="23" font-weight="700">从哪里接单？</text>
<rect x="12" y="49" width="376" height="60" rx="7" fill="white"/>
<text x="24" y="73" font-size="18" font-weight="700">Upwork</text>
<text x="24" y="97" font-size="17" font-weight="450">按项目提交提案</text>
<rect x="12" y="116" width="376" height="60" rx="7" fill="white"/>
<text x="24" y="140" font-size="18" font-weight="700">Fiverr</text>
<text x="24" y="164" font-size="17" font-weight="450">上架范围固定的服务</text>
<rect x="12" y="183" width="376" height="60" rx="7" fill="white"/>
<text x="24" y="207" font-size="18" font-weight="700">Contra</text>
<text x="24" y="231" font-size="17" font-weight="450">作品集、转介绍或项目列表</text>
<rect x="12" y="250" width="376" height="60" rx="7" fill="white"/>
<text x="24" y="274" font-size="18" font-weight="700">Freelancer.com</text>
<text x="24" y="298" font-size="17" font-weight="450">列出报价和交付阶段参与投标</text>
<rect x="12" y="327" width="376" height="86" rx="7" fill="#d8eee7"/>
<text x="22" y="358" font-size="15" font-weight="450">合同额 − 服务费 − 提案成本 − 提现费</text>
<text x="22" y="391" font-size="20" font-weight="700">剩余金额 ÷ 总工时</text>
</g>
</svg>
