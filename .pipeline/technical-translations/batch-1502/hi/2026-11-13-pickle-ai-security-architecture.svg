<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc" xml:lang="hi">
  <title id="title">सार्वजनिक सुरक्षा प्रोग्राम का सत्यापन</title>
  <desc id="desc">आधिकारिक सत्यापक JS फ़ाइल और रिलीज़ का प्रमाण लेकर हैश, हस्ताक्षर और पारदर्शिता लॉग जाँचता है। मूल v42 के लिए कोड 0, एक बाइट जोड़ने पर source_hash त्रुटि और कोड 1 मिलता है। वास्तविक नोड व इंस्टॉल ऐप अलग जाँचें हैं।</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="640" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="16.3" font-weight="bold">सार्वजनिक सुरक्षा प्रोग्राम का सत्यापन</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="18" y="65" width="151" height="76" rx="8" />
      <rect x="191" y="65" width="151" height="76" rx="8" />
      <rect x="25" y="205" width="310" height="110" rx="8" />
      <rect x="18" y="395" width="151" height="100" rx="8" />
      <rect x="191" y="395" width="151" height="100" rx="8" fill="#f8e8dd" />
    </g>
    <text x="93" y="96">प्रोग्राम की JS फ़ाइल</text><text x="93" y="121" font-size="13.7">मूल या संशोधित</text>
    <text x="266" y="96">रिलीज़ प्रमाण JSON</text><text x="266" y="121">सार्वजनिक v42 डेटा</text>
    <text x="180" y="232">credential-enclave-verify program</text>
    <text x="180" y="257">फ़ाइल हैश और रिलीज़ हस्ताक्षर</text>
    <text x="180" y="282">पारदर्शिता लॉग का प्रमाण</text>
    <text x="180" y="305" font-size="12">क्रम से जाँचें · विफलता पर रुकें</text>
    <text x="93" y="424">मूल फ़ाइल: सफल</text><text x="93" y="452">version 42 · ok</text><text x="93" y="479">एग्ज़िट कोड 0</text>
    <text x="266" y="424">एक बाइट जोड़ी</text><text x="266" y="452" font-size="14.5">source_hash बेमेल</text><text x="266" y="479">एग्ज़िट कोड 1</text>
    <text x="180" y="555" font-size="14.2">प्रोडक्शन नोड का सत्यापन अलग है</text>
    <text x="180" y="583" font-size="15.0">इंस्टॉल iOS बाइनरी की जाँच भी अलग है</text>
    <text x="180" y="616" font-size="11.1">स्थानीय रन के समान इनपुट, शाखाएँ और परिणाम</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M93 141V170H180V205" /><path d="M266 141V170H180" />
    <path d="M180 315V355H93V395" /><path d="M180 355H266V395" />
  </g>
</svg>