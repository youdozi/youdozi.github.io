<svg xml:lang="hi" xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-labelledby="title desc">
<title id="title">Pickle में अनुरोध और पुष्टि</title><desc id="desc">शर्तें तय करें, अतिरिक्त जानकारी और पुष्टि कार्ड जाँचें। असहमत हों तो रुकें, सहमत हों तो आगे बढ़ें और बाहरी परिणाम जाँचें।</desc>
<rect width="400" height="500" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#183a2c"><rect x="40" y="15" width="320" height="62" rx="10" fill="#dcf1e5"/><text x="200" y="42">चैट में लक्ष्य, शर्तें और</text><text x="200" y="65">निषिद्ध कार्रवाइयाँ बताएँ</text><path d="M200 77v32" stroke="#357858" stroke-width="3"/><path d="M193 101l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="40" y="112" width="320" height="64" rx="10" fill="#dcf1e5"/><text x="200" y="138">सवाल और विकल्प पढ़ें</text><text x="200" y="161">कार्ड की शर्तें जाँचें</text><path d="M200 176v32" stroke="#357858" stroke-width="3"/><path d="M193 200l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="40" y="211" width="320" height="58" rx="10" fill="#e8eee9"/><text x="200" y="246">क्या शर्तें मेल खाती हैं?</text><path d="M110 269v30 M290 269v30" stroke="#357858" stroke-width="3"/><text x="110" y="322">नहीं</text><text x="290" y="322">हाँ</text><rect x="30" y="339" width="150" height="61" rx="10" fill="#f6e6dc"/><text x="105" y="365">अनुमोदन रोकें,</text><text x="105" y="388">शर्तें बदलें</text><rect x="220" y="339" width="150" height="61" rx="10" fill="#dcf1e5"/><text x="295" y="365">अनुमोदन दें,</text><text x="295" y="388">आगे बढ़ें</text><path d="M295 400v27" stroke="#357858" stroke-width="3"/><path d="M288 419l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="125" y="432" width="245" height="48" rx="10" fill="#dcf1e5"/><text x="247" y="461" font-size="15">परिणाम और बाहरी पुष्टि मिलाएँ</text></g></svg>
