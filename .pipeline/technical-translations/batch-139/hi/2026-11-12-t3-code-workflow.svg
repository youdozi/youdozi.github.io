<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1050" viewBox="0 0 360 1050" xml:lang="hi" role="img" aria-labelledby="title desc">
<title id="title">T3 Code में छोटे बदलाव की जाँच</title>
<desc id="desc">प्रारंभिक कोड और तय परीक्षण Git में रखें और विफलताएँ देखें। T3 Code में प्रोजेक्ट और प्रमाणित प्रदाता चुनें और Supervised मोड में सीमित अनुरोध भेजें। फ़ाइलों और परीक्षण कमांड की जाँच कर अनुमति दें। diff, मूल परीक्षण और वास्तविक परिणाम मिलाकर सुधार माँगें या खुद कमिट करें। एजेंट का काम उदाहरण है, संदर्भ समाधान अलग से जाँचा गया।</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57"/></marker></defs>
<rect width="360" height="1050" rx="16" fill="#f5f7f2"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="15" fill="#203a2c">
<text x="180" y="35" font-size="20" font-weight="700">T3 Code अभ्यास के चरण</text>
<rect x="24" y="58" width="312" height="88" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="86">शुरुआती कोड + तय परीक्षण + Git</text><text x="180" y="111">npm test: 19 में से 8 विफल</text><text x="180" y="134" font-size="12">संदर्भ समाधान से पहले का वास्तविक रन</text>
<path d="M180 146V179" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="184" width="312" height="96" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="212">T3 Code: प्रोजेक्ट और प्रदाता चुनें</text><text x="180" y="238">Supervised अनुमति मोड जाँचें</text><text x="180" y="263" textLength="280" lengthAdjust="spacingAndGlyphs">दायरा और सफलता की शर्तें बताएँ</text>
<path d="M180 280V315" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="320" width="312" height="105" rx="9" fill="#faecd6" stroke="#bca274"/>
<text x="180" y="349">एजेंट: कोड पढ़ें और बदलें</text><text x="180" y="376">फ़ाइल और कमांड का दायरा देखें</text><text x="180" y="403">मंज़ूरी दें और npm test चलाएँ</text>
<path d="M180 425V461" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="466" width="312" height="105" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="495">diff और तय परीक्षण मिलाएँ</text><text x="180" y="523">आउटपुट और निकास स्थिति देखें</text><text x="180" y="549">परीक्षण और सेटिंग ज्यों के त्यों हैं?</text>
<path d="M95 571V617" stroke="#496b57" marker-end="url(#arrow)"/><text x="68" y="600">हाँ</text>
<path d="M272 571V617" stroke="#496b57" marker-end="url(#arrow)"/><text x="301" y="600">नहीं</text>
<rect x="16" y="622" width="157" height="86" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="94" y="652">पूरा diff देखें</text><text x="94" y="681">Git में कमिट करें</text>
<rect x="186" y="622" width="158" height="86" rx="9" fill="#f5e1df" stroke="#b88880"/>
<text x="265" y="652">विफलताएँ बताएँ</text><text x="265" y="681">सुधार माँगें</text>
<path d="M344 665H352V371H338" fill="none" stroke="#b88880" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="24" y="755" width="312" height="137" rx="9" fill="#fff" stroke="#a8b6a7"/>
<text x="180" y="786" font-weight="700">उदाहरण की जाँच का दायरा</text><text x="180" y="814">शुरुआत: 8 विफल / संदर्भ: 19 पास</text><text x="180" y="841">परीक्षण वही · कोई बाहरी API कॉल नहीं</text><text x="180" y="870" textLength="280" lengthAdjust="spacingAndGlyphs">समाधान प्रदाता के AI ने नहीं बनाया</text>
<text x="180" y="949" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">T3 Code में कार्य, अनुमति और समीक्षा</text>
<text x="180" y="981" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">चुना एजेंट कोड लिखता और टूल चलाता है</text>
</g></svg>
