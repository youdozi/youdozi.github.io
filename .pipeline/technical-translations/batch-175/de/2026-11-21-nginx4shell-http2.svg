<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" width="400" height="485" viewBox="0 0 400 485" role="img" aria-labelledby="title desc">
  <title id="title">Patch-Priorität für NGINX HTTP/2</title>
  <desc id="desc">Produktherkunft ermitteln. Bei Anbieterprodukten oder unklarer Herkunft den Herstellerhinweis prüfen. Beim Original die Version abgleichen und bei betroffenen Versionen nach HTTP/2-Status priorisieren.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#4e7567"/>
    </marker>
  </defs>
  <rect width="400" height="485" rx="16" fill="#f4f8f6"/>
  <g fill="#fff" stroke="#afc9be">
    <rect x="96" y="20" width="208" height="58" rx="9"/>
    <rect x="20" y="118" width="172" height="64" rx="9"/>
    <rect x="208" y="118" width="172" height="64" rx="9"/>
    <rect x="208" y="224" width="172" height="64" rx="9"/>
    <rect x="20" y="224" width="172" height="64" rx="9"/>
    <rect x="20" y="331" width="360" height="130" rx="9" fill="#dcefe5"/>
  </g>
  <g fill="none" stroke="#4e7567" stroke-width="2" marker-end="url(#arrow)">
    <path d="M200 78V96H106V115"/>
    <path d="M200 78V96H294V115"/>
    <path d="M294 182V202H106V221"/>
    <path d="M294 182V221"/>
    <path d="M294 288V328"/>
  </g>
  <g fill="#193c31" font-family="system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">
    <text x="200" y="47" font-size="14">Herkunft und Version</text>
    <text x="106" y="144">Anbieter oder unklar</text>
    <text x="294" y="144">NGINX-Original</text>
    <text x="106" y="250">Andere Version</text>
    <text x="294" y="250">Potenziell betroffen</text>
    <text x="200" y="358">Nach HTTP/2-Status priorisieren</text>
  </g>
  <g fill="#35584d" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
    <text x="200" y="65">Auch HTTP/2-Status eingeben</text>
    <text x="106" y="166">Herstellerhinweis prüfen</text>
    <text x="294" y="166">Versionen abgleichen</text>
    <text x="106" y="272">Versionsergebnis melden</text>
    <text x="294" y="272">Passende CVEs wählen</text>
    <text x="200" y="385">Aktiv → Patch priorisieren</text>
    <text x="200" y="409">Inaktiv → Patch weiter einplanen</text>
    <text x="200" y="433">Unklar → HTTP/2 prüfen und patchen</text>
  </g>
</svg>
