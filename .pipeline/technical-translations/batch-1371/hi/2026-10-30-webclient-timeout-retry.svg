<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 735" width="420" height="735" role="img" aria-labelledby="title description" xml:lang="hi"><title id="title">टाइमआउट और पुनः प्रयास</title><desc id="description">हर प्रयास की समय-सीमा लगाएँ, केवल पात्र 503 पर दोबारा प्रयास करें और पूरी प्रक्रिया का समय सीमित रखें</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">टाइमआउट और पुनः प्रयास</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="113" text-anchor="middle" font-size="16">GET /value</text><text x="180" y="137" text-anchor="middle" font-size="16">retrieve → String डिकोड करें</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="239" text-anchor="middle" font-size="16">timeout(attemptLimit)</text><text x="180" y="263" text-anchor="middle" font-size="16">हर प्रयास का समय अलग</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="365" text-anchor="middle" font-size="16">retryWhen: केवल HTTP 503</text><text x="180" y="389" text-anchor="middle" font-size="16">प्रतीक्षा, अधिकतम दो पुनः प्रयास</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="491" text-anchor="middle" font-size="16">timeout(totalLimit)</text><text x="180" y="515" text-anchor="middle" font-size="16">सभी प्रयास और प्रतीक्षा शामिल</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="617" text-anchor="middle" font-size="16">सब्सक्राइबर को मान और समापन</text><text x="180" y="641" text-anchor="middle" font-size="16">या अंतिम त्रुटि मिलती है</text></g></svg>
