<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1070" viewBox="0 0 640 1070" role="img" aria-labelledby="title desc" xml:lang="hi">
<title id="title">10,000 RPS के API की संदर्भ संरचना</title><desc id="desc">एज और लोड बैलेंसर कई ज़ोन में स्टेटलेस प्रतिकृतियों तक अनुरोध भेजते हैं। अनुरोध प्रवेश, कैश, डेटाबेस और बाहरी सेवाओं पर समवर्ती काम सीमित है। वैकल्पिक DB आउटबॉक्स से कतार और इडेम्पोटेंट वर्कर को काम मिलता है।</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2d654c"/></marker></defs><rect width="640" height="1070" fill="#f7f7f2"/>
<g stroke="#2d654c" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M320 155V195"/><path d="M320 280V320"/><path d="M90 430V525H170"/><path d="M90 525V655H170"/><path d="M90 655V785H170"/><path d="M385 700H620V870H320V910" stroke-dasharray="8 7"/></g>
<rect x="40" y="60" width="560" height="95" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="91.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">CDN / WAF / प्रति क्लाइंट दर सीमा</text>
<text x="320.0" y="123.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">एज पर केवल उपयुक्त सार्वजनिक प्रतिक्रियाएँ कैश करें</text>
<rect x="40" y="195" width="560" height="85" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="221.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">लोड बैलेंसर</text>
<text x="320.0" y="253.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">हेल्थ चेक और ज़ोन के अनुसार वितरण</text>
<rect x="40" y="320" width="560" height="110" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="343.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">स्टेटलेस JDK API प्रतिकृतियाँ</text>
<text x="320.0" y="375.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">कई ज़ोन / अनुरोध प्रवेश नियंत्रण</text>
<text x="320.0" y="407.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">वर्चुअल थ्रेड / अनुरोध की समय-सीमा</text>
<rect x="170" y="480" width="430" height="90" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="385.0" y="509.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">रीड कैश (वैकल्पिक)</text>
<text x="385.0" y="541.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">हिट दर / TTL / समान मिस मिलाएँ</text>
<rect x="170" y="610" width="430" height="90" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="385.0" y="639.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">DB पूल / पढ़ने और लिखने के रास्ते</text>
<text x="385.0" y="671.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">कुल कनेक्शन सीमा / क्वेरी टाइमआउट</text>
<rect x="170" y="740" width="430" height="90" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="385.0" y="769.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">हर निर्भर सेवा की समवर्तिता सीमा</text>
<text x="385.0" y="801.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">समय-सीमाएँ / पुनः प्रयास की सीमा</text>
<rect x="40" y="910" width="560" height="100" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="944.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">DB आउटबॉक्स → कतार → वर्कर (वैकल्पिक)</text>
<text x="320.0" y="976.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">कमिट के बाद डिलीवरी / रीप्ले / इडेम्पोटेंसी</text>
<text x="320" y="1044" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#35443a">लोड टेस्ट से प्रतिकृतियों की संख्या और सीमाएँ तय करें</text></svg>
