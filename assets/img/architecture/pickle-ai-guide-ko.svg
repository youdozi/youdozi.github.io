<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-labelledby="title desc">
<title id="title">Pickle 작업 요청과 확인 흐름</title><desc id="desc">조건을 정해 요청하고 필요한 정보와 확인 카드를 살핀다. 동의하지 않으면 멈추고 동의하면 진행한 뒤 외부 결과를 확인한다.</desc>
<rect width="400" height="500" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#183a2c"><rect x="40" y="15" width="320" height="62" rx="10" fill="#dcf1e5"/><text x="200" y="42">목표·조건·금지 행동을</text><text x="200" y="65">채팅으로 요청</text><path d="M200 77v32" stroke="#357858" stroke-width="3"/><path d="M193 101l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="40" y="112" width="320" height="64" rx="10" fill="#dcf1e5"/><text x="200" y="138">추가 질문과 선택지를 확인</text><text x="200" y="161">확인 카드의 조건을 살핌</text><path d="M200 176v32" stroke="#357858" stroke-width="3"/><path d="M193 200l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="40" y="211" width="320" height="58" rx="10" fill="#e8eee9"/><text x="200" y="246">조건에 동의할 수 있는가?</text><path d="M110 269v30 M290 269v30" stroke="#357858" stroke-width="3"/><text x="110" y="322">아니요</text><text x="290" y="322">예</text><rect x="30" y="339" width="150" height="61" rx="10" fill="#f6e6dc"/><text x="105" y="365">승인하지 않고</text><text x="105" y="388">조건 수정</text><rect x="220" y="339" width="150" height="61" rx="10" fill="#dcf1e5"/><text x="295" y="365">승인 후</text><text x="295" y="388">작업 진행</text><path d="M295 400v27" stroke="#357858" stroke-width="3"/><path d="M288 419l7 8 7-8" fill="none" stroke="#357858" stroke-width="3"/><rect x="125" y="432" width="245" height="48" rx="10" fill="#dcf1e5"/><text x="247" y="461">결과·외부 확인 내용 대조</text></g></svg>
