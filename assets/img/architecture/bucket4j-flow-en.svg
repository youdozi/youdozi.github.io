<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1000" viewBox="0 0 360 1000" xml:lang="en" role="img" aria-labelledby="title desc">
<title id="title">Bucket4j local token bucket rate limit</title>
<desc id="desc">Create a Spring singleton bucket reused by all demo requests. Capacity and initial tokens are 5; Greedy refills 5 over 10 seconds. Each request atomically attempts to consume one token using elapsed time. Success returns 200; rejection returns 429 and Retry-After rounded up to seconds. Independent local buckets do not share the limit.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57"/></marker></defs>
<rect width="360" height="1000" rx="16" fill="#f5f7f2"/>
<g fill="#203a2c" font-family="system-ui,sans-serif" text-anchor="middle" font-size="15">
<text x="180" y="35" font-size="20" font-weight="700">Bucket4j token bucket</text>
<rect x="24" y="59" width="312" height="83" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="86">Create bucket at application startup</text><text x="180" y="109">Reuse as a Spring singleton bean</text><text x="180" y="132" font-size="13">All /demo requests share the bucket</text>
<path d="M180 142V174" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="179" width="312" height="89" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="205">Capacity 5 · initial tokens 5</text><text x="180" y="230">Greedy: refill 5 over 10 seconds</text><text x="180" y="254">Consume 5 at t=0 → 1 at t=2s</text>
<path d="M180 268V302" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="307" width="312" height="98" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="335">Request arrives → apply elapsed time</text><text x="180" y="361">Atomically attempt to consume 1 token</text><text x="180" y="388" font-size="12">tryConsumeAndReturnRemaining(1)</text>
<path d="M100 405V453" stroke="#496b57" marker-end="url(#arrow)"/><text x="74" y="435">Success</text>
<path d="M265 405V453" stroke="#496b57" marker-end="url(#arrow)"/><text x="294" y="435">Insufficient</text>
<rect x="16" y="458" width="159" height="110" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="95" y="486">Consume 1 token</text><text x="95" y="513">Proceed to work</text><text x="95" y="542">Demo: HTTP 200</text>
<rect x="187" y="458" width="157" height="110" rx="9" fill="#f9e8d9" stroke="#ba946e"/>
<text x="265" y="486" textLength="126" lengthAdjust="spacingAndGlyphs">Do not wait for refill</text><text x="265" y="513">HTTP 429</text><text x="265" y="542" textLength="126" lengthAdjust="spacingAndGlyphs">Retry-After: wait seconds</text>
<rect x="24" y="608" width="312" height="113" rx="9" fill="#fff" stroke="#a9b6a8"/>
<text x="180" y="636" font-weight="700">Refill is calculated from elapsed time</text><text x="180" y="663">Do not create a bucket per request</text><text x="180" y="689">No separate scheduler is registered</text><text x="180" y="710" font-size="12">This diagram covers a single local JVM</text>
<rect x="24" y="759" width="312" height="147" rx="9" fill="#f4e2df" stroke="#b88880"/>
<text x="180" y="789" font-weight="700">Two separate local buckets</text><text x="180" y="817" textLength="280" lengthAdjust="spacingAndGlyphs">Bucket A: initial 5 / Bucket B: initial 5</text><text x="180" y="846">No shared state: up to 10 total allowed</text><text x="180" y="875">A global limit needs distributed storage</text>
<text x="180" y="954" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">Capacity and refill rate are separate policy values</text>
</g></svg>
