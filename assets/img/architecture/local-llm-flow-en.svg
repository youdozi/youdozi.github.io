<svg xmlns="http://www.w3.org/2000/svg" width="360" height="936" viewBox="0 0 360 936" role="img" aria-labelledby="title description" xml:lang="en">
<title id="title">Process flow of local LLM at home</title>
<desc id="description">After online installation/download and custom model creation, the selected notes are inspected and delivered to the local API and model. After checking the response, a human compares it to the original text. Failure to verify is an error exit and there is no tool to execute the results.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#475569"/></marker></defs>
<rect width="360" height="936" rx="12" fill="#f8fafc"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f172a">
<text x="180" y="32" font-size="12" font-weight="600">Local LLM at home</text>
<rect x="16" y="64" width="328" height="86" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="180" y="99" font-size="12">Ollama installation/model download</text>
<text x="180" y="123" font-size="12">Preparation phase: external communication</text>
<path d="M180 150V176" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="183" width="328" height="86" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="180" y="218" font-size="12">Create custom configuration with Modelfile</text>
<text x="180" y="242" font-size="12">home-assistant</text>
<path d="M180 269V295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="302" width="328" height="86" rx="10" fill="#fef3c7" stroke="#64748b"/>
<text x="180" y="337" font-size="12">Selected memo: UTF-8, 2000 characters or less</text>
<text x="180" y="361" font-size="12">Empty or oversized input: exit with error</text>
<path d="M180 388V414" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="421" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="180" y="456" font-size="12">POST to local API</text>
<text x="180" y="480" font-size="12">127.0.0.1:11434/api/chat</text>
<path d="M180 507V533" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="540" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="180" y="575" font-size="12">Selected local model inference</text>
<text x="180" y="599" font-size="12">CPU/GPU usage depending on device</text>
<path d="M180 626V652" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="659" width="328" height="86" rx="10" fill="#fef3c7" stroke="#64748b"/>
<text x="180" y="694" font-size="12">Check HTTP, completion and output length</text>
<text x="180" y="718" font-size="12">Error exit on failure</text>
<path d="M180 745V771" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="778" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="180" y="813" font-size="12">Compare the result with the original note</text>
<text x="180" y="837" font-size="12">No file changes or automatic commands</text>
<text x="180" y="918" font-size="13">Requires local model and cloud disabled</text>
</g></svg>
