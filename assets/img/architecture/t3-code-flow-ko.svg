<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1050" viewBox="0 0 360 1050" xml:lang="ko" role="img" aria-labelledby="title desc">
<title id="title">T3 Code에서 작은 코드 수정을 검증하는 흐름</title>
<desc id="desc">시작 코드와 고정 테스트를 Git 프로젝트에 저장하고 실패를 확인한다. T3 Code에서 프로젝트와 인증된 제공자를 선택하고 Supervised 권한으로 수정 프롬프트를 보낸다. 제공자 에이전트가 파일 수정과 테스트 실행을 제안하면 범위를 확인해 승인한다. diff와 테스트 원본 및 실행 결과를 대조하고, 부족하면 다시 수정 요청하며 조건이 맞으면 직접 커밋한다. AI 출력 자체는 예시이며 참고 정답의 테스트는 별도로 검증했다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57"/></marker></defs>
<rect width="360" height="1050" rx="16" fill="#f5f7f2"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="15" fill="#203a2c">
<text x="180" y="35" font-size="20" font-weight="700">T3 Code 실습 흐름</text>
<rect x="24" y="58" width="312" height="88" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="86">시작 코드 + 고정 테스트 + Git</text><text x="180" y="111">npm test: 19개 중 8개 실패</text><text x="180" y="134" font-size="12">참고 구현을 넣기 전의 실제 실행 결과</text>
<path d="M180 146V179" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="184" width="312" height="96" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="212">T3 Code: 프로젝트·제공자 선택</text><text x="180" y="238">Supervised 권한 모드 확인</text><text x="180" y="263">수정 범위와 완료 조건을 프롬프트로 전달</text>
<path d="M180 280V315" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="320" width="312" height="105" rx="9" fill="#faecd6" stroke="#bca274"/>
<text x="180" y="349">제공자 에이전트: 코드 읽기·수정</text><text x="180" y="376">파일 변경·명령 실행 요청의 범위 확인</text><text x="180" y="403">허용한 작업과 npm test 실행</text>
<path d="M180 425V461" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="466" width="312" height="105" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="495">사용자: diff + 고정 테스트 대조</text><text x="180" y="523">명령의 실제 출력과 종료 상태 확인</text><text x="180" y="549">테스트·설정이 그대로인가?</text>
<path d="M95 571V617" stroke="#496b57" marker-end="url(#arrow)"/><text x="68" y="600">충족</text>
<path d="M272 571V617" stroke="#496b57" marker-end="url(#arrow)"/><text x="301" y="600">미충족</text>
<rect x="16" y="622" width="157" height="86" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="94" y="652">전체 diff 재확인</text><text x="94" y="681">직접 Git 커밋</text>
<rect x="186" y="622" width="158" height="86" rx="9" fill="#f5e1df" stroke="#b88880"/>
<text x="265" y="652">실패 사례·변경 범위</text><text x="265" y="681">명시해 수정 요청</text>
<path d="M344 665H352V371H338" fill="none" stroke="#b88880" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="24" y="755" width="312" height="137" rx="9" fill="#fff" stroke="#a8b6a7"/>
<text x="180" y="786" font-weight="700">예제의 검증 범위</text><text x="180" y="814">시작 코드: 실패 8개 / 참고 정답: 19개 통과</text><text x="180" y="841">테스트 원본 유지 · 외부 API 호출 없음</text><text x="180" y="870">제공자 AI 턴으로 정답 생성을 시험한 것은 아님</text>
<text x="180" y="949" font-size="13">T3 Code는 작업·권한·변경 검토를 연결하는 화면</text>
<text x="180" y="981" font-size="13">코드 작성·도구 실행은 선택한 에이전트가 수행</text>
</g></svg>
