<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 987" width="420" height="987" role="img" aria-labelledby="title description" xml:lang="en"><title id="title">Public read fallback</title><desc id="description">Admission, primary read, failure classification and snapshot age policy. Every acquired permit is released on exit.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6044"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f6f6f0"/><g font-family="system-ui,sans-serif" fill="#202923"><text x="210" y="39" text-anchor="middle" font-size="20" font-weight="650">Public read fallback</text><rect x="20" y="76" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="125" text-anchor="middle" font-size="16">tryAcquire(): permit acquired?</text><path d="M 342 119 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="119" r="12" fill="#8c3a32"/><text x="384" y="125" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="152" text-anchor="middle" font-size="10">rejected</text><text x="193" y="187" font-size="12">yes</text><path d="M 180 163 V 196" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="202" width="320" height="86" rx="7" fill="#ffffff" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="251" text-anchor="middle" font-size="16">primary.get(): primary read</text><path d="M 180 289 V 322" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="328" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="377" text-anchor="middle" font-size="16">Did the primary return?</text><path d="M 342 371 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="371" r="12" fill="#2b6044"/><text x="384" y="377" text-anchor="middle" font-size="19" fill="white">✓</text><text x="384" y="404" text-anchor="middle" font-size="10">primary</text><text x="193" y="439" font-size="12">exception</text><path d="M 180 415 V 448" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="454" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="503" text-anchor="middle" font-size="16">Is the error Unavailable?</text><path d="M 342 497 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="497" r="12" fill="#8c3a32"/><text x="384" y="503" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="530" text-anchor="middle" font-size="10">propagate</text><text x="193" y="565" font-size="12">yes</text><path d="M 180 541 V 574" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="580" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="629" text-anchor="middle" font-size="16">Does a snapshot exist?</text><path d="M 342 623 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="623" r="12" fill="#8c3a32"/><text x="384" y="629" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="656" text-anchor="middle" font-size="10">rejected</text><text x="193" y="691" font-size="12">yes</text><path d="M 180 667 V 700" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="706" width="320" height="86" rx="7" fill="#fff5da" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="755" text-anchor="middle" font-size="16">Is age between 0 and 60s?</text><path d="M 342 749 H 369" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><circle cx="384" cy="749" r="12" fill="#8c3a32"/><text x="384" y="755" text-anchor="middle" font-size="19" fill="white">×</text><text x="384" y="782" text-anchor="middle" font-size="10">rejected</text><text x="193" y="817" font-size="12">yes</text><path d="M 180 793 V 826" fill="none" stroke="#2b6044" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="832" width="320" height="86" rx="22" fill="#e3efdf" stroke="#7b8d79" stroke-width="1.5"/><text x="180" y="881" text-anchor="middle" font-size="16">Return snapshot, source and age</text></g></svg>
