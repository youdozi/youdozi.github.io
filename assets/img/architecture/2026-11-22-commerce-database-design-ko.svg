<svg xml:lang="ko" xmlns="http://www.w3.org/2000/svg" width="420" height="370" viewBox="0 0 420 370" role="img" aria-labelledby="title desc">
  <title id="title">PostgreSQL 주문행의 재고 예약 흐름</title>
  <desc id="desc">주문행에서 SKU와 수량을 읽고 같은 SKU 재고를 조건부 갱신한다. 갱신한 행이 있으면 예약을 기록해 성공을 반환하고, 없으면 예약 없이 실패를 반환한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#536983"/>
    </marker>
  </defs>
  <rect width="420" height="370" rx="16" fill="#f4f7fb"/>
  <g fill="none" stroke="#536983" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M210 74V106"/>
    <path d="M210 178V202H110V220"/>
    <path d="M210 178V202H310V220"/>
    <path d="M110 280V304"/>
    <path d="M310 280V304"/>
  </g>
  <g stroke-width="1.2">
    <rect x="35" y="16" width="350" height="58" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="35" y="109" width="350" height="69" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="15" y="223" width="190" height="57" rx="10" fill="#e7f5eb" stroke="#7ca98e"/>
    <rect x="215" y="223" width="190" height="57" rx="10" fill="#fff0df" stroke="#cfa671"/>
    <rect x="15" y="307" width="190" height="45" rx="10" fill="#fff" stroke="#7ca98e"/>
    <rect x="215" y="307" width="190" height="45" rx="10" fill="#fff" stroke="#cfa671"/>
  </g>
  <g fill="#172f48" font-family="system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif" text-anchor="middle" font-size="16">
    <text x="210" y="40" font-weight="700">order_item · 주문행</text>
    <text x="210" y="62">SKU와 주문 수량을 읽음</text>
    <text x="210" y="136" font-weight="700">inventory · 조건부 UPDATE</text>
    <text x="210" y="161">가용 수량이 충분하면 held 증가</text>
    <text x="110" y="247" font-weight="700">갱신 1행</text>
    <text x="110" y="269">stock_reservation 삽입</text>
    <text x="310" y="247" font-weight="700">갱신 0행</text>
    <text x="310" y="269">예약행 없음</text>
    <text x="110" y="334" font-weight="700">true · 예약 성공</text>
    <text x="310" y="334" font-weight="700">false · 예약 실패</text>
  </g>
</svg>
