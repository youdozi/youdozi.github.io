<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ko" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">저장된 메모</title><desc id="desc">상태와 빈 목록 확인 → 공백 메모 거절 → 첫 메모 저장 → 프로세스 종료 → 같은 DB로 재시작 → 저장된 메모 조회.</desc>
<rect width="480" height="480" rx="18" fill="#f4f8fc"/>
<rect x="20" y="10" width="440" height="76" rx="12" fill="white" stroke="#648399"/><text x="240" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#193c4c">상태와 빈 목록</text><text x="240" y="69" text-anchor="middle" font-family="monospace" font-size="18" fill="#21604b">GET /healthz · GET /notes → 200</text>
<path d="M240 87v15m-5 -6 5 6 5 -6" stroke="#47687c" stroke-width="2" fill="none"/>
