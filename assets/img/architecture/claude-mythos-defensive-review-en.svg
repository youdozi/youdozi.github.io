<svg xmlns="http://www.w3.org/2000/svg" width="420" height="357" viewBox="0 0 420 357" role="img" aria-labelledby="title desc">
  <title id="title">From a finding to a fix and regression tests</title>
  <desc id="desc">Read the commit and evidence. Defer if evidence is missing; if policy and omission are confirmed, fix server authorization, test allow and deny cases, and record the result.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58718e"/></marker></defs>
  <rect width="420" height="357" rx="16" fill="#f3f6fb"/>
  <g fill="none" stroke="#58718e" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M210 76V108"/>
    <path d="M210 171V193H108V215"/>
    <path d="M210 171V193H312V215"/>
    <path d="M312 274V302"/>
  </g>
  <g stroke-width="1.2">
    <rect x="28" y="16" width="364" height="60" rx="9" fill="#fff" stroke="#a7bbd2"/>
    <rect x="28" y="111" width="364" height="60" rx="9" fill="#fff" stroke="#a7bbd2"/>
    <rect x="14" y="218" width="188" height="56" rx="9" fill="#fff1e1" stroke="#caa574"/>
    <rect x="218" y="218" width="188" height="56" rx="9" fill="#e9f5ec" stroke="#83a98e"/>
    <rect x="218" y="305" width="188" height="37" rx="9" fill="#fff" stroke="#83a98e"/>
  </g>
  <g fill="#1b344e" text-anchor="middle" font-family="system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-size="16">
    <text x="210" y="41" font-weight="700">Claude Security finding</text>
    <text x="210" y="63">Check commit and evidence</text>
    <text x="210" y="136" font-weight="700">Compare server check and policy</text>
    <text x="210" y="158">Check role and order store</text>
    <text x="108" y="241" font-weight="700">Insufficient evidence</text>
    <text x="108" y="262">Record what is needed</text>
    <text x="312" y="241" font-weight="700">Omission confirmed</text>
    <text x="312" y="262">Fix server authorization</text>
    <text font-size="12" x="312" y="329" font-weight="700">Test allow / deny; record</text>
  </g>
</svg>
