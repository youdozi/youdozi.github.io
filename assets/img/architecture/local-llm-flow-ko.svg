<svg xmlns="http://www.w3.org/2000/svg" width="360" height="936" viewBox="0 0 360 936" role="img" aria-labelledby="title description" xml:lang="ko">
<title id="title">집에서 쓰는 로컬 LLM의 처리 흐름</title>
<desc id="description">온라인 설치·다운로드와 맞춤 모델 생성 후, 선택한 메모를 검사해 로컬 API와 모델로 전달한다. 응답을 검사한 뒤 사람이 원문과 대조한다. 검증 실패는 오류 종료이며 결과를 실행하는 도구는 없다.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#475569"/></marker></defs>
<rect width="360" height="936" rx="12" fill="#f8fafc"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" fill="#0f172a">
<text x="180" y="32" font-size="19" font-weight="600">집에서 쓰는 로컬 LLM</text>
<rect x="16" y="64" width="328" height="86" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="180" y="99" font-size="16">Ollama 설치·모델 다운로드</text>
<text x="180" y="123" font-size="16">준비 단계: 외부 통신</text>
<path d="M180 150V176" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="183" width="328" height="86" rx="10" fill="#dbeafe" stroke="#64748b"/>
<text x="180" y="218" font-size="16">Modelfile로 맞춤 구성 생성</text>
<text x="180" y="242" font-size="16">home-assistant</text>
<path d="M180 269V295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="302" width="328" height="86" rx="10" fill="#fef3c7" stroke="#64748b"/>
<text x="180" y="337" font-size="16">선택한 메모: UTF-8·2000자 이하</text>
<text x="180" y="361" font-size="16">빈 입력·길이 초과는 오류 종료</text>
<path d="M180 388V414" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="421" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="180" y="456" font-size="16">로컬 API로 POST</text>
<text x="180" y="480" font-size="16">127.0.0.1:11434/api/chat</text>
<path d="M180 507V533" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="540" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="180" y="575" font-size="16">선택한 로컬 모델 추론</text>
<text x="180" y="599" font-size="16">장치에 따라 CPU·GPU 사용</text>
<path d="M180 626V652" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="659" width="328" height="86" rx="10" fill="#fef3c7" stroke="#64748b"/>
<text x="180" y="694" font-size="16">HTTP·완료 응답·출력 길이 검사</text>
<text x="180" y="718" font-size="16">실패하면 오류 종료</text>
<path d="M180 745V771" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="778" width="328" height="86" rx="10" fill="#dcfce7" stroke="#64748b"/>
<text x="180" y="813" font-size="16">결과를 원문과 대조해 활용</text>
<text x="180" y="837" font-size="16">파일 변경·명령 자동 실행 없음</text>
<text x="180" y="918" font-size="13">로컬 모델·클라우드 비활성화가 전제</text>
</g></svg>
