<svg xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc"><title id="title">Aside 조사 결과 확인 흐름</title><desc id="desc">공식 URL 세 개와 출력 형식을 요청한다. 생성된 CSV를 코드로 검사하며 실패하면 수정한다. 통과한 파일도 원문의 의미와 대조한다.</desc><rect width="400" height="550" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="64" rx="9"/><rect x="35" y="120" width="330" height="64" rx="9"/><rect x="35" y="222" width="330" height="64" rx="9"/></g><rect x="35" y="324" width="330" height="68" rx="9" fill="#f5e9d9"/><rect x="35" y="430" width="330" height="92" rx="9" fill="#dcefe4"/><text x="200" y="45">입력: 공식 URL 세 개</text><text x="200" y="69">출력 형식·작업 폴더 지정</text><text x="200" y="147">Aside에 조사 요청</text><text x="200" y="171">CSV 저장 결과 확인</text><text x="200" y="249">코드로 열·행·URL 검사</text><text x="200" y="273">check_report.py 실행</text><text x="200" y="351">실패: 파일·요청 수정</text><text x="200" y="377">통과: 원문 대조로 진행</text><text x="200" y="458">요약의 사실·조건·누락 확인</text><text x="200" y="484">사람이 원문 링크와 대조</text><text x="200" y="509">코드 통과만으로 완료하지 않음</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 82v35m-6-8 6 8 6-8M200 184v35m-6-8 6 8 6-8M200 286v35m-6-8 6 8 6-8M200 392v35m-6-8 6 8 6-8"/></g></g></svg>
