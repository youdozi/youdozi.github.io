<svg xmlns="http://www.w3.org/2000/svg" width="640" height="626" viewBox="0 0 640 626" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">AI 에이전트용 맥 선택 흐름</title>
  <desc id="desc">고정형에는 맥 미니 M6, 이동형에는 맥북 에어 M5가 출발점이다. 로컬 모델을 실행하면 메모리 요구량을 확인한다.</desc>
  <rect x="2" y="2" width="636" height="622" rx="24" fill="#f8fafc" stroke="#b7c7d7" stroke-width="4"/>
  <g font-family="system-ui, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#132438">
    <text x="320" y="62" font-size="38" font-weight="700">AI 에이전트를 어디서 쓰나?</text>
    <g fill="none" stroke="#526980" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M320 86v33H171v30m149-30h149v30"/>
      <path d="m160 138 11 11 11-11m276 0 11 11 11-11"/>
      <path d="M171 352v27h298v-27m-149 27v35m-11-11 11 11 11-11"/>
    </g>
    <rect x="29" y="157" width="284" height="187" rx="18" fill="#e1efeb" stroke="#397568" stroke-width="3"/>
    <rect x="327" y="157" width="284" height="187" rx="18" fill="#e6eefb" stroke="#536f9c" stroke-width="3"/>
    <text x="171" y="208" font-size="32">고정형</text>
    <text x="171" y="259" font-size="35" font-weight="700">맥 미니 M6</text>
    <text x="171" y="307" font-size="29">예약 작업 · 원격 작업</text>
    <text x="469" y="208" font-size="32">이동형</text>
    <text x="469" y="259" font-size="35" font-weight="700">맥북 에어 M5</text>
    <text x="469" y="307" font-size="29">출장 · 외부 작업</text>
    <rect x="29" y="426" width="582" height="165" rx="18" fill="#fff3dc" stroke="#836b36" stroke-width="3"/>
    <text x="320" y="477" font-size="37" font-weight="700">로컬 모델도 실행한다면</text>
    <text x="320" y="526" font-size="30">실제 모델과 컨텍스트로</text>
    <text x="320" y="563" font-size="30">필요한 메모리 확인</text>
  </g>
</svg>
