<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1070" viewBox="0 0 640 1070" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">10,000 RPS HTTP API의 참조 구성</title><desc id="desc">엣지와 로드밸런서에서 여러 가용 영역의 API 복제본으로 전달하고, 요청 입장과 캐시·DB·외부 API의 동시성을 제한합니다. 비동기 작업은 DB outbox에서 큐와 워커로 전달하는 선택 경로입니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2d654c"/></marker></defs><rect width="640" height="1070" fill="#f7f7f2"/>
<g stroke="#2d654c" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M320 155V195"/><path d="M320 280V320"/><path d="M90 430V525H170"/><path d="M90 525V655H170"/><path d="M90 655V785H170"/><path d="M385 700H620V870H320V910" stroke-dasharray="8 7"/></g>
<rect x="40" y="60" width="560" height="95" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="91.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">CDN / WAF / 클라이언트별 요청률 제한</text>
<text x="320.0" y="123.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">캐시 가능한 공개 응답만 엣지에서 처리</text>
<rect x="40" y="195" width="560" height="85" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="221.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Load Balancer</text>
<text x="320.0" y="253.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">상태 확인·가용 영역 간 분산</text>
<rect x="40" y="320" width="560" height="110" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="343.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Stateless JDK API replicas</text>
<text x="320.0" y="375.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">여러 가용 영역·요청 입장 제한</text>
<text x="320.0" y="407.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">가상 스레드 / 요청 기한</text>
<rect x="170" y="480" width="430" height="90" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="385.0" y="509.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">읽기 캐시 (선택)</text>
<text x="385.0" y="541.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">적중률·TTL·캐시 미스 합치기</text>
<rect x="170" y="610" width="430" height="90" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="385.0" y="639.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">DB 연결 풀 / 읽기·쓰기 경로</text>
<text x="385.0" y="671.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">전체 연결 예산·쿼리 제한시간</text>
<rect x="170" y="740" width="430" height="90" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="385.0" y="769.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">외부 API별 동시성 제한</text>
<text x="385.0" y="801.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">기한·재시도 예산</text>
<rect x="40" y="910" width="560" height="100" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="944.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">DB outbox → Queue → Workers (선택)</text>
<text x="320.0" y="976.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">커밋 후 전달·재처리·멱등 소비</text>
<text x="320" y="1044" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" fill="#35443a">참조 설계: 장비 수와 제한값은 부하 시험으로 결정</text></svg>
