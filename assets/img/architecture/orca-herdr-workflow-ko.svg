<svg xmlns="http://www.w3.org/2000/svg" width="480" height="470" viewBox="0 0 480 470" role="img" aria-labelledby="title desc">
<title id="title">병렬 작업에서 작업 트리와 검토 흐름</title><desc id="desc">기준 커밋에서 작업 트리 두 개를 만든다. 각 작업 트리에서 서로 다른 값을 기록한 뒤 기준 파일과 두 변경 파일을 각각 확인한다. 이후 충돌을 검토한다.</desc>
<rect width="480" height="470" fill="#f8faf8"/><g font-family="sans-serif" font-size="18" fill="#193b2d" text-anchor="middle"><rect x="75" y="15" width="330" height="52" rx="10" fill="#dcefe4"/><text x="240" y="48">기준 저장소와 기준 커밋</text><path d="M240 67v27 M120 94h240 M120 94v26 M360 94v26" fill="none" stroke="#397955" stroke-width="3"/><rect x="20" y="122" width="200" height="84" rx="10" fill="#e5f0fa"/><text x="120" y="153">작업 트리 A</text><text x="120" y="185">task A 기록</text><rect x="260" y="122" width="200" height="84" rx="10" fill="#e5f0fa"/><text x="360" y="153">작업 트리 B</text><text x="360" y="185">task B 기록</text><path d="M120 206v38 M360 206v38" stroke="#397955" stroke-width="3"/><rect x="20" y="248" width="200" height="65" rx="10" fill="#dcefe4"/><text x="120" y="276">A 파일과</text><text x="120" y="301">변경 목록 확인</text><rect x="260" y="248" width="200" height="65" rx="10" fill="#dcefe4"/><text x="360" y="276">B 파일과</text><text x="360" y="301">변경 목록 확인</text><path d="M120 313v30h240v-30 M240 343v22" fill="none" stroke="#397955" stroke-width="3"/><rect x="55" y="368" width="370" height="72" rx="10" fill="#f5e9d9"/><text x="240" y="397">기준 파일 확인 후 변경을 비교</text><text x="240" y="423">실제 병합은 별도 검토</text></g></svg>
