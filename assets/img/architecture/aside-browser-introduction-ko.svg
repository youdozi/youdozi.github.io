<svg xmlns="http://www.w3.org/2000/svg" width="400" height="460" viewBox="0 0 400 460" role="img" aria-labelledby="title desc"><title id="title">Aside 공개 페이지 조회 예제</title><desc id="desc">공개 URL을 입력하고 REPL로 탭을 연다. 스냅샷을 읽어 제목과 주소를 출력한 뒤 사용자가 대상 페이지와 대조한다.</desc><rect width="400" height="460" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="60" rx="9"/><rect x="35" y="111" width="330" height="60" rx="9"/><rect x="35" y="204" width="330" height="60" rx="9"/><rect x="35" y="297" width="330" height="60" rx="9"/></g><rect x="35" y="390" width="330" height="52" rx="9" fill="#f5e9d9"/><text x="200" y="54">입력: 공개 페이지 URL</text><text x="200" y="147">REPL에서 탭 열기</text><text x="200" y="240">페이지 스냅샷 읽기</text><text x="200" y="333">제목과 URL 출력</text><text x="200" y="422">사용자가 요청 대상과 대조</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 78v30m-6-8 6 8 6-8M200 171v30m-6-8 6 8 6-8M200 264v30m-6-8 6 8 6-8M200 357v30m-6-8 6 8 6-8"/></g></g></svg>
