<svg xmlns="http://www.w3.org/2000/svg" width="468" height="461" viewBox="0 0 468 461" role="img" aria-labelledby="title desc">
  <title id="title">Order status shown after the buyer returns from payment</title>
  <desc id="desc">Look up the existing order. Show a waiting message while loading and a retry action if the lookup fails. Once loaded, use the payment and order states to direct the buyer to refresh, track shipping, browse products, refresh refund status, or view refund details.</desc>
  <rect width="468" height="461" rx="16" fill="#f4f7fb"/>
  <path d="M25 66V426 M25 100H44 M25 158H44 M25 225H44 M25 283H44 M25 341H44 M25 399H44" fill="none" stroke="#7185a0" stroke-width="1.6"/>
  <g stroke="#b5c4d6">
    <rect x="15" y="14" width="438" height="52" rx="9" fill="#fff"/>
    <rect x="44" y="80" width="408" height="47" rx="8" fill="#fff"/>
    <rect x="44" y="138" width="408" height="47" rx="8" fill="#fff2e5"/>
    <rect x="44" y="197" width="408" height="56" rx="8" fill="#eef4ff"/>
    <rect x="44" y="263" width="408" height="42" rx="8" fill="#e9f5ec"/>
    <rect x="44" y="321" width="408" height="42" rx="8" fill="#fff"/>
    <rect x="44" y="379" width="408" height="64" rx="8" fill="#eef4ff"/>
  </g>
  <g fill="#203951" font-family="system-ui, sans-serif" font-size="16">
    <text x="34" y="46" font-size="18" font-weight="700">Return from payment · look up order</text>
    <text x="61" y="109">Loading · show waiting message</text>
    <text x="61" y="167">Lookup failed · reload order status</text>
    <text x="61" y="220" font-weight="700">Payment unknown or order in review</text>
    <text x="61" y="243">Refresh order status</text>
    <text x="61" y="289">Payment and order confirmed · track shipment</text>
    <text x="61" y="347">Canceled without charge · browse products</text>
    <text x="61" y="403">Refund pending · refresh refund status</text>
    <text x="61" y="428">Refund complete · view refund details</text>
  </g>
</svg>
