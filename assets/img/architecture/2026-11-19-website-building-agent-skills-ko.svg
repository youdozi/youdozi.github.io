<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ko" width="400" height="520" viewBox="0 0 400 520" role="img" aria-labelledby="title desc">
  <title id="title">문의 동선의 브라우저 검사 흐름</title>
  <desc id="desc">두 화면 폭에서 소개 페이지를 각각 연다. 가로 넘침을 검사하고 Tab으로 문의 링크에 도달한 뒤 Enter로 상담 안내를 여는지 확인한다. 세 조건이 통과하면 해당 폭의 결과를 출력한다. 실패한 조건은 수정한 뒤 다시 실행한다.</desc>
  <rect width="400" height="520" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="28" y="18" width="344" height="60" rx="9"/>
    <rect x="28" y="111" width="344" height="60" rx="9"/>
    <rect x="28" y="204" width="344" height="60" rx="9"/>
    <rect x="28" y="297" width="344" height="64" rx="9"/>
    <rect x="28" y="394" width="344" height="60" rx="9"/>
  </g>
  <path d="M200 78v29m-6-7 6 7 6-7M200 171v29m-6-7 6 7 6-7M200 264v29m-6-7 6 7 6-7M200 361v29m-6-7 6 7 6-7" fill="none" stroke="#397955" stroke-width="3"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="17" text-anchor="middle">
    <text x="200" y="55">360px와 1280px에서 페이지 열기</text>
    <text x="200" y="148">화면 밖으로 가로 넘침이 있는지 확인</text>
    <text x="200" y="241">Tab으로 문의 링크에 도달하는지 확인</text>
    <text x="200" y="323">Enter로 링크 실행</text>
    <text x="200" y="346">상담 주소 조각과 제목 위치 확인</text>
    <text x="200" y="430">화면 폭별 PASS 출력</text>
    <text x="200" y="489">실패하면 해당 조건을 수정해 다시 실행</text>
  </g>
</svg>
