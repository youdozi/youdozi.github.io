<svg xmlns="http://www.w3.org/2000/svg" width="420" height="410" viewBox="0 0 420 410" role="img" aria-labelledby="title desc">
  <title id="title">HTTP 메트릭의 두 규약 비교</title>
  <desc id="desc">기본 규약과 OpenTelemetry 규약에서 같은 앱을 각각 시작한다. 상품 42와 99를 조회하고 Prometheus 출력을 저장한다. 이 예제에서 MVC 서버 이름과 라벨은 바뀌고 RestClient 이름과 라벨은 두 설정에서 같다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#506681"/>
    </marker>
  </defs>
  <rect width="420" height="410" rx="18" fill="#f3f7fb"/>
  <g fill="none" stroke="#506681" stroke-width="1.6" marker-end="url(#arrow)">
    <path d="M109 73V98H198V115"/>
    <path d="M311 73V98H222V115"/>
    <path d="M210 192V221"/>
    <path d="M210 285V307H109V325"/>
    <path d="M210 285V307H311V325"/>
  </g>
  <g stroke-width="1.2">
    <rect x="14" y="20" width="190" height="53" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="216" y="20" width="190" height="53" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="27" y="118" width="366" height="74" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="27" y="224" width="366" height="61" rx="10" fill="#fff" stroke="#a6bdd5"/>
    <rect x="14" y="328" width="190" height="61" rx="10" fill="#eaf3ff" stroke="#7a9ec4"/>
    <rect x="216" y="328" width="190" height="61" rx="10" fill="#e8f3ec" stroke="#78a08a"/>
  </g>
  <g fill="#18324e" font-family="system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif" text-anchor="middle" font-size="16">
    <text x="109" y="43" font-weight="700">기본 규약<tspan x="109" dy="18" font-weight="400">앱 시작</tspan></text>
    <text x="311" y="43" font-weight="700">OpenTelemetry 규약<tspan x="311" dy="18" font-weight="400">앱 시작</tspan></text>
    <text x="210" y="145" font-weight="700">각 실행에서 상품 ID 42와 99 조회</text>
    <text x="210" y="172">Spring MVC → RestClient → 외부 API</text>
    <text x="210" y="249" font-weight="700">Prometheus 출력 저장</text>
    <text x="210" y="273">/actuator/prometheus</text>
    <text x="109" y="354" font-weight="700">Spring MVC 서버</text>
    <text x="109" y="375">이름과 라벨 변경</text>
    <text x="311" y="354" font-weight="700">RestClient</text>
    <text x="311" y="375">이름과 라벨 동일</text>
  </g>
</svg>
