<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1050" viewBox="0 0 360 1050" xml:lang="en" role="img" aria-labelledby="title desc">
<title id="title">Orca project, worktree, terminal and browser workflow</title>
<desc id="desc">Open an example Git repository in Orca and create a worktree. Check its path and branch, then ask an agent to modify one file. Run fixed tests in the same worktree, open its development server in the embedded browser, compare the diff against the base branch, and commit if the conditions are met or request a correction otherwise. Worktree file isolation is separate from execution permissions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#496b57"/></marker></defs>
<rect width="360" height="1050" rx="16" fill="#f5f7f2"/>
<g font-family="system-ui,sans-serif" text-anchor="middle" font-size="15" fill="#203a2c">
<text x="180" y="36" font-size="20" font-weight="700">Orca task workflow</text>
<rect x="24" y="62" width="312" height="72" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="90">Open Git repository with Add Repo</text><text x="180" y="116">main: starter code + fixed tests</text>
<path d="M180 134V166" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="171" width="312" height="88" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="199">Create a task worktree</text><text x="180" y="224">First check its folder and branch</text><text x="180" y="246" font-size="12" textLength="280" lengthAdjust="spacingAndGlyphs">UI selection may differ from an existing shell cwd</text>
<path d="M180 259V291" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="296" width="312" height="83" rx="9" fill="#faecd6" stroke="#bca274"/>
<text x="180" y="324" textLength="280" lengthAdjust="spacingAndGlyphs">Ask the selected agent to change one file</text><text x="180" y="349" textLength="280" lengthAdjust="spacingAndGlyphs">Specify scope, permissions and completion</text><text x="180" y="370" font-size="12">A prompt does not grant tool permissions</text>
<path d="M180 379V412" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="417" width="312" height="108" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="180" y="447">Run npm test in the same worktree</text><text x="180" y="473">Start dev server → inspect port</text><text x="180" y="499">Check actual UI in embedded browser</text>
<path d="M180 525V558" stroke="#496b57" marker-end="url(#arrow)"/>
<rect x="24" y="563" width="312" height="82" rx="9" fill="#e5edf4" stroke="#839bae"/>
<text x="180" y="592">Compare diff and tests against main</text><text x="180" y="620">Do file changes meet the policy?</text>
<path d="M98 645V690" stroke="#496b57" marker-end="url(#arrow)"/><text x="70" y="674">Yes</text>
<path d="M268 645V690" stroke="#496b57" marker-end="url(#arrow)"/><text x="297" y="674">No</text>
<rect x="16" y="695" width="158" height="77" rx="9" fill="#deebdf" stroke="#86a18b"/>
<text x="95" y="724">Changed file</text><text x="95" y="751">Commit yourself</text>
<rect x="187" y="695" width="157" height="77" rx="9" fill="#f5e1df" stroke="#b88880"/>
<text x="265" y="724">Narrow failure</text><text x="265" y="751">Ask for a fix</text>
<path d="M344 733H352V338H338" fill="none" stroke="#b88880" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<rect x="24" y="820" width="312" height="118" rx="9" fill="#fff" stroke="#a8b6a7"/>
<text x="180" y="850" font-weight="700">Task isolation boundaries</text><text x="180" y="878">Worktree: files, branch and work view</text><text x="180" y="906" textLength="280" lengthAdjust="spacingAndGlyphs">Also consider ports, DB, accounts and access</text>
<text x="180" y="992" font-size="13" textLength="280" lengthAdjust="spacingAndGlyphs">Project → working path → results → review</text>
</g></svg>
