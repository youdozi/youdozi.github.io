<svg xmlns="http://www.w3.org/2000/svg" xml:lang="ko" width="400" height="478" viewBox="0 0 400 478" role="img" aria-labelledby="title desc">
  <title id="title">예약 취소 확인창의 검증 흐름</title>
  <desc id="desc">예약 상세 버튼으로 확인창을 열면 예약 유지에 포커스가 간다. Escape와 예약 유지는 예약 상태를 보존하고, Tab 다음 Enter로 취소를 확정하면 상태가 바뀐다. 모든 분기에서 닫은 뒤 버튼에 포커스가 돌아오는지 확인한다.</desc>
  <rect width="400" height="478" fill="#f8faf8"/>
  <g fill="#dcefe4">
    <rect x="30" y="20" width="340" height="63" rx="10"/>
    <rect x="30" y="111" width="340" height="63" rx="10"/>
    <rect x="15" y="218" width="177" height="108" rx="10"/>
    <rect x="208" y="218" width="177" height="108" rx="10" fill="#f4e8d7"/>
    <rect x="30" y="376" width="340" height="66" rx="10"/>
  </g>
  <path d="M200 83v24m-5-6 5 6 5-6M200 174v19H103v21m-5-6 5 6 5-6M200 193h97v21m-5-6 5 6 5-6M103 326v24h97v22m-5-6 5 6 5-6M297 326v24h-97" fill="none" stroke="#397955" stroke-width="2.5"/>
  <g fill="#193b2d" font-family="sans-serif" font-size="16" text-anchor="middle">
    <text x="200" y="57">예약 상세에서 확인창 열기</text>
    <text x="200" y="148">초기 포커스가 ‘예약 유지’인지 확인</text>
    <text x="103" y="250">Escape 또는</text>
    <text x="103" y="273">‘예약 유지’에서 Enter</text>
    <text x="103" y="304">예약 유지 중</text>
    <text x="297" y="250">Tab으로 확정 버튼 이동</text>
    <text x="297" y="273">Enter로 취소 확정</text>
    <text x="297" y="304">예약 취소됨</text>
    <text x="200" y="403">확인창 닫힘</text>
    <text x="200" y="426">‘취소 옵션 열기’로 포커스 복귀</text>
  </g>
</svg>
