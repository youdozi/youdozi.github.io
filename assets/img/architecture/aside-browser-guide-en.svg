<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" width="400" height="550" viewBox="0 0 400 550" role="img" aria-labelledby="title desc"><title id="title">Aside research output verification flow</title><desc id="desc">Request three official URLs and an output format. Validate the generated CSV in code; fix failures. Even a passing file must be compared with the originals.</desc><rect width="400" height="550" fill="#f8faf8"/><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#193b2d"><g fill="#dcefe4"><rect x="35" y="18" width="330" height="64" rx="9"/><rect x="35" y="120" width="330" height="64" rx="9"/><rect x="35" y="222" width="330" height="64" rx="9"/></g><rect x="35" y="324" width="330" height="68" rx="9" fill="#f5e9d9"/><rect x="35" y="430" width="330" height="92" rx="9" fill="#dcefe4"/><text x="200" y="45">Input: three official URLs</text><text x="200" y="69">Set format and working folder</text><text x="200" y="147">Request research from Aside</text><text x="200" y="171">Check saved CSV output</text><text x="200" y="249">Check columns, rows, URLs</text><text x="200" y="273">Run check_report.py</text><text x="200" y="351">Fail: fix file or request</text><text x="200" y="377">Pass: compare with sources</text><text x="200" y="458">Check facts and missing conditions</text><text x="200" y="484">Compare with original links</text><text x="200" y="509">Passing code is not completion</text><g stroke="#397955" stroke-width="3" fill="none"><path d="M200 82v35m-6-8 6 8 6-8M200 184v35m-6-8 6 8 6-8M200 286v35m-6-8 6 8 6-8M200 392v35m-6-8 6 8 6-8"/></g></g></svg>
