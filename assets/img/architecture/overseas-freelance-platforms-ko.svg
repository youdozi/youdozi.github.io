<title id="title">일감은 어디서 얻을까?</title><desc id="desc">플랫폼별 수주 방식을 비교한 뒤 계약금에서 계약 수수료, 제안 비용, 출금 비용을 빼고 남은 금액을 계산한다. 제안·작업·검수 시간을 합산한 뒤 비용 차감액을 총시간으로 나눈다.</desc>
