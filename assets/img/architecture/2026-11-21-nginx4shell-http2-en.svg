<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" width="400" height="485" viewBox="0 0 400 485" role="img" aria-labelledby="title desc">
  <title id="title">NGINX HTTP/2 patch priority</title>
  <desc id="desc">Identify the product source. For vendor products or unknown sources, check the vendor advisory. For upstream NGINX, compare the version with published ranges and use HTTP/2 status to prioritize affected releases.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#4e7567"/>
    </marker>
  </defs>
  <rect width="400" height="485" rx="16" fill="#f4f8f6"/>
  <g fill="#fff" stroke="#afc9be">
    <rect x="96" y="20" width="208" height="58" rx="9"/>
    <rect x="20" y="118" width="172" height="64" rx="9"/>
    <rect x="208" y="118" width="172" height="64" rx="9"/>
    <rect x="208" y="224" width="172" height="64" rx="9"/>
    <rect x="20" y="224" width="172" height="64" rx="9"/>
    <rect x="20" y="331" width="360" height="130" rx="9" fill="#dcefe5"/>
  </g>
  <g fill="none" stroke="#4e7567" stroke-width="2" marker-end="url(#arrow)">
    <path d="M200 78V96H106V115"/>
    <path d="M200 78V96H294V115"/>
    <path d="M294 182V202H106V221"/>
    <path d="M294 182V221"/>
    <path d="M294 288V328"/>
  </g>
  <g fill="#193c31" font-family="system-ui, sans-serif" font-size="16" font-weight="650" text-anchor="middle">
    <text x="200" y="47" font-size="14">Source and version</text>
    <text x="106" y="144">Vendor or unknown</text>
    <text x="294" y="144">NGINX upstream</text>
    <text x="106" y="250">Other versions</text>
    <text x="294" y="250">Possibly affected</text>
    <text x="200" y="358">Prioritize by HTTP/2 status</text>
  </g>
  <g fill="#35584d" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
    <text x="200" y="65">Also enter HTTP/2 status</text>
    <text x="106" y="166">Check vendor advisory</text>
    <text x="294" y="166">Compare version ranges</text>
    <text x="106" y="272">Report version result</text>
    <text x="294" y="272">Select applicable CVEs</text>
    <text x="200" y="385">On → prioritize patch</text>
    <text x="200" y="409">Off → keep patch plan</text>
    <text x="200" y="433">Unknown → check HTTP/2 and patch</text>
  </g>
</svg>
