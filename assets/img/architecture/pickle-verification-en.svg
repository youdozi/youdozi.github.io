<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Verify the public security program</title>
  <desc id="desc">The public program JS and release proof are inputs to the official verifier. It checks the file hash, release signature and transparency-log proof. Original v42 succeeds with code 0; adding one byte causes a source_hash failure and code 1. Production node attestation and the installed app binary are separate checks.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="640" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="16.3" font-weight="bold">Verify the public security program</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="18" y="65" width="151" height="76" rx="8" />
      <rect x="191" y="65" width="151" height="76" rx="8" />
      <rect x="25" y="205" width="310" height="110" rx="8" />
      <rect x="18" y="395" width="151" height="100" rx="8" />
      <rect x="191" y="395" width="151" height="100" rx="8" fill="#f8e8dd" />
    </g>
    <text x="93" y="96">Program JS</text><text x="93" y="121" font-size="13.7">Original or modified</text>
    <text x="266" y="96">Release proof JSON</text><text x="266" y="121">Public v42 data</text>
    <text x="180" y="232">credential-enclave-verify program</text>
    <text x="180" y="257">File hash · release signature</text>
    <text x="180" y="282">Transparency-log proof</text>
    <text x="180" y="305" font-size="12">Checks in order · stop on failure</text>
    <text x="93" y="424">Original: success</text><text x="93" y="452">version 42 · ok</text><text x="93" y="479">Exit code 0</text>
    <text x="266" y="424">One byte added</text><text x="266" y="452" font-size="14.5">source_hash failure</text><text x="266" y="479">Exit code 1</text>
    <text x="180" y="555" font-size="14.2">Production node attestation is separate</text>
    <text x="180" y="583" font-size="15.0">Installed iOS binary is also separate</text>
    <text x="180" y="616" font-size="11.1">Same inputs, branches and outputs as the local run</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M93 141V170H180V205" /><path d="M266 141V170H180" />
    <path d="M180 315V355H93V395" /><path d="M180 355H266V395" />
  </g>
</svg>