<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 440 308" role="img" aria-labelledby="title description">
  <title id="title">Candidate directory usage · Free space on the data volume</title>
  <desc id="description">Directory usage measured for the selected paths and free space measured on the data volume before and after cleanup</desc>
  <rect x="6" y="8" width="428" height="82" rx="10" fill="#f2f6fa" stroke="#577186"/>
  <text x="220" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#17384e">Candidate directory usage</text>
  <text x="220" y="70" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#153c52">du -sh</text>
  <path d="M220 92v16m-5 -5 5 5 5 -5" fill="none" stroke="#466a80" stroke-width="2"/>
  <rect x="6" y="112" width="428" height="82" rx="10" fill="#f2f6fa" stroke="#577186"/>
  <text x="220" y="144" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#17384e">Regenerable and no longer in use</text>
  <text x="220" y="174" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#153c52">20 selected directories · 1.61 GiB</text>
  <path d="M220 196v16m-5 -5 5 5 5 -5" fill="none" stroke="#466a80" stroke-width="2"/>
  <rect x="6" y="216" width="428" height="82" rx="10" fill="#f2f6fa" stroke="#577186"/>
  <text x="220" y="248" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#17384e">Free space on the data volume</text>
  <text x="220" y="278" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#153c52">df -h   ·   6.41 → 7.46 GiB</text>
</svg>
