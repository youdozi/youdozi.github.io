<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 400 426" role="img" aria-labelledby="title desc">
<title id="title">How work finds you</title><desc id="desc">Four ways to find work. Subtract contract, proposal and withdrawal costs from revenue, then divide by all hours spent pitching, delivering and reviewing.</desc>
<rect width="400" height="426" rx="12" fill="#f2f6fa"/>
<g font-family="system-ui, sans-serif" fill="#183345">
<text x="16" y="34" font-size="23" font-weight="700">How work finds you</text>
<rect x="12" y="49" width="376" height="60" rx="7" fill="white"/>
<text x="24" y="73" font-size="18" font-weight="700">Upwork</text>
<text x="24" y="97" font-size="17" font-weight="450">Pitch for a posted job</text>
<rect x="12" y="116" width="376" height="60" rx="7" fill="white"/>
<text x="24" y="140" font-size="18" font-weight="700">Fiverr</text>
<text x="24" y="164" font-size="17" font-weight="450">Sell a defined service</text>
<rect x="12" y="183" width="376" height="60" rx="7" fill="white"/>
<text x="24" y="207" font-size="18" font-weight="700">Contra</text>
<text x="24" y="231" font-size="17" font-weight="450">Portfolio, referrals or job feed</text>
<rect x="12" y="250" width="376" height="60" rx="7" fill="white"/>
<text x="24" y="274" font-size="18" font-weight="700">Freelancer.com</text>
<text x="24" y="298" font-size="17" font-weight="450">Bid with a price and milestones</text>
<rect x="12" y="327" width="376" height="86" rx="7" fill="#d8eee7"/>
<text x="22" y="358" font-size="15" font-weight="450">Price − fees − proposals − withdrawal</text>
<text x="22" y="391" font-size="20" font-weight="700">Remainder ÷ total hours</text>
</g>
</svg>
