<text x="320.0" y="221.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Load Balancer</text>
<text x="320.0" y="253.5" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Health checks and zone-aware distribution</text>
<rect x="40" y="320" width="560" height="110" rx="12" fill="#eef2e9" stroke="#66836f" stroke-width="2"/>
<text x="320.0" y="343.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Stateless JDK API replicas</text>
<text x="320.0" y="375.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Multiple zones / request admission</text>
<text x="320.0" y="407.0" text-anchor="middle" dominant-baseline="middle" fill="#23362b" font-family="system-ui,sans-serif" font-size="24">Virtual threads / request deadlines</text>
