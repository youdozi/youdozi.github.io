<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Rust amount CLI processing flow</title>
  <desc id="desc">main owns its argument strings and lends them to summarize. Empty input fails. Each value is parsed as u64 and accumulated with checked_add; errors return immediately. On success Summary is returned. main sends success to stdout with exit 0 and errors to stderr with exit 1.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="1040" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1e352d">
    <text x="180" y="31" font-size="19" font-weight="bold">Ownership → borrow → result</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="20" y="55" width="215" height="68" rx="8" />
      <rect x="20" y="155" width="215" height="68" rx="8" />
      <rect x="20" y="270" width="215" height="64" rx="8" />
      <rect x="20" y="385" width="215" height="64" rx="8" />
      <rect x="20" y="505" width="215" height="64" rx="8" />
      <rect x="20" y="625" width="215" height="64" rx="8" />
      <rect x="20" y="745" width="215" height="64" rx="8" />
      <rect x="20" y="865" width="215" height="68" rx="8" />
      <rect x="250" y="736" width="96" height="78" rx="8" fill="#f8e8dd" />
      <rect x="250" y="865" width="96" height="68" rx="8" fill="#f8e8dd" />
    </g>
    <text x="127" y="82">main: collect arguments</text><text x="127" y="106">Own Vec&lt;String&gt;</text>
    <text x="127" y="181">summarize(&amp;inputs)</text><text x="127" y="205">Borrow string slice</text>
    <text x="127" y="308">Is the input empty?</text>
    <text x="127" y="411">Is there a next value?</text><text x="127" y="434">Read each string by reference</text>
    <text x="127" y="531">Parse as u64</text><text x="127" y="554">Check number and range</text>
    <text x="127" y="651">Accumulate with checked_add</text><text x="127" y="674">Check sum overflow</text>
    <text x="127" y="772">Return Ok(Summary)</text><text x="127" y="795">Count and total</text>
    <text x="127" y="891">main: standard output</text><text x="127" y="916">Exit code 0</text>
    <text x="298" y="763">Return Err</text><text x="298" y="788" font-size="12">Early return</text>
    <text x="298" y="891">Standard error</text><text x="298" y="916">Exit code 1</text>
    <text x="148" y="362">No</text><text x="148" y="479">Yes</text>
    <text x="148" y="598">Success</text><text x="283" y="296">Yes</text>
    <text x="288" y="495">Failure</text><text x="288" y="617">Failure</text>
    <text x="88" y="704" font-size="13">Success: repeat</text>
    <text x="55" y="740" font-size="13">No more values</text>
    <text x="116" y="975">Repeat for the next value</text>
    <text x="180" y="1006" font-size="12.6">All error paths join the Err branch in main.</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M127 123V155" /><path d="M127 223V270" /><path d="M127 334V385" />
    <path d="M127 449V505" /><path d="M127 569V625" />
    <path d="M20 417H8V777H20" />
    <path d="M127 689V710H3V365H127V385" />
    <path d="M235 302H337V736" />
    <path d="M235 537H309V736" /><path d="M235 657H280V736" />
    <path d="M127 809V865" /><path d="M298 814V865" />
  </g>
</svg>