<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Pickle key delegation and two credential-use boundaries</title>
  <desc id="desc">During setup the public iPhone security program creates keys, verifies the node attestation and encrypts the user key for a verified Nitro Enclave. Records are stored encrypted. During use, the node verifies active delegation and log persistence before credential use. OAuth tokens remain in the node for API requests; Vault passwords and card values leave in plaintext to the operational worker for a web form. Later worker and AI result masking is a separate boundary.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#325e50" /></marker></defs>
  <rect width="360" height="1120" rx="16" fill="#f6f7f2" />
  <g font-family="sans-serif" text-anchor="middle" fill="#1e352d" font-size="15">
    <text x="180" y="32" font-size="18" font-weight="bold">Key delegation and use</text>
    <g fill="#e5efe9" stroke="#325e50" stroke-width="1.5">
      <rect x="25" y="60" width="310" height="85" rx="8" />
      <rect x="25" y="185" width="310" height="85" rx="8" />
      <rect x="25" y="310" width="310" height="85" rx="8" />
      <rect x="25" y="480" width="310" height="110" rx="8" />
      <rect x="18" y="655" width="151" height="105" rx="8" />
      <rect x="191" y="655" width="151" height="105" rx="8" fill="#f8e8dd" />
      <rect x="18" y="805" width="151" height="85" rx="8" />
      <rect x="191" y="805" width="151" height="85" rx="8" fill="#f8e8dd" />
    </g>
    <text x="180" y="86">iPhone: create master key</text>
    <text x="180" y="112">Store in iCloud Keychain</text>
    <text x="180" y="135" font-size="13">The protocol distinguishes derived keys</text>
    <text x="180" y="212" font-size="15.0">Check attestation, measurement, key</text>
    <text x="180" y="238">Failure → no key delegation</text>
    <text x="180" y="260" font-size="13">Encrypt key for verified node only</text>
    <text x="180" y="337">Server storage: encrypted records</text>
    <text x="180" y="365" font-size="15.0">Enclave memory: time-limited user key</text>
    <text x="180" y="386" font-size="13">The master key itself is not delegated</text>
    <text x="180" y="451" font-size="12.6">The use flow below requires valid delegation</text>
    <text x="180" y="508" font-size="15.0">Request → check delegation and record</text>
    <text x="180" y="535">Enclave decrypts · creates usage log</text>
    <text x="180" y="562" font-size="15.0">Use or release after log confirmation</text>
    <text x="180" y="582" font-size="13">Failure → no use or release</text>
    <text x="93" y="682">OAuth: forward</text>
    <text x="93" y="710" font-size="14.5">Token stays in node</text>
    <text x="93" y="738" font-size="13.7">Used for allowed API</text>
    <text x="266" y="682">Vault: release</text>
    <text x="266" y="710" font-size="13.1">Password · card value</text>
    <text x="266" y="738" font-size="14.5">Plaintext to worker</text>
    <text x="93" y="834" font-size="14.5">TLS to API provider</text><text x="93" y="861" font-size="12.5">Response data returned</text>
    <text x="266" y="834">worker → web form</text><text x="266" y="861">Outside the node</text>
    <text x="180" y="951" font-size="13.2" font-weight="bold">Mask values from AI results: service claim</text>
    <text x="180" y="983">Enforcement across worker and app</text>
    <text x="180" y="1008" font-size="14.2">is not proved by the Enclave repo alone</text>
    <text x="180" y="1060" font-size="13">Conceptual summary of public code</text>
    <text x="180" y="1086" font-size="13">Not live production or app verification</text>
  </g>
  <g fill="none" stroke="#325e50" stroke-width="1.7" marker-end="url(#arrow)">
    <path d="M180 145V185" /><path d="M180 270V310" />
    <path d="M180 590V620H93V655" /><path d="M180 620H266V655" />
    <path d="M93 760V805" /><path d="M266 760V805" />
  </g>
  <path d="M20 420H340" stroke="#a7b7ac" stroke-dasharray="5 5" />
</svg>