<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 440 310" role="img" aria-labelledby="title desc">
<title id="title">Making a PowerPoint with AI — from outline to editable slides</title>
<desc id="desc">Define the audience and decision, review the outline, build editable slides, then check them against the source and in slide show mode.</desc>
<rect width="440" height="310" rx="12" fill="#f3f6fa"/>
<g font-family="system-ui, sans-serif" fill="#163849">
<rect x="12" y="12" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="44" font-size="22" font-weight="700">Plan the outline</text>
<text x="28" y="72" font-size="17">Audience, decision and evidence</text>
<path d="M220 93v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="114" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="146" font-size="22" font-weight="700">Build the PowerPoint</text>
<text x="28" y="174" font-size="17">Editable tables, shapes and speaker notes</text>
<path d="M220 195v16m-6 -6 6 6 6 -6" fill="none" stroke="#26715b" stroke-width="2.5"/>
<rect x="12" y="216" width="416" height="80" rx="9" fill="white" stroke="#76998e"/>
<text x="28" y="248" font-size="22" font-weight="700">Review the slides</text>
<text x="28" y="276" font-size="17">Check sources, editing and slide show views</text>
</g>
</svg>
