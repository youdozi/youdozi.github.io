<svg xml:lang="ko" xmlns="http://www.w3.org/2000/svg" width="420" height="462" viewBox="0 0 420 462" role="img" aria-labelledby="title desc">
  <title id="title">결제 결과와 재고 예약을 함께 반영하는 흐름</title>
  <desc id="desc">결제 완료나 환불 대기 상태에서는 작업을 추가하지 않는다. 결제 미확인 상태에서는 기존 예약 상태를 유지한다. 미결제 종료가 확정되면 예약을 해제한다. 결제 완료는 예약을 보유하면 출고, 이미 해제했으면 환불로 이어진다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
