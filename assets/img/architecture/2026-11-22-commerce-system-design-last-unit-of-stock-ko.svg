  <g fill="#172f48" font-family="system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif" text-anchor="middle" font-size="16">
    <text x="210" y="45" font-weight="700">검증한 PG 결과와 주문 상태를 읽음</text>
    <text x="101" y="128" font-weight="700">결제 완료·환불 대기</text>
    <text x="101" y="149">추가 작업 없음</text>
    <text x="303" y="139" font-weight="700">검증한 PG 결과</text>
    <text x="72" y="230" font-weight="700">미확인</text>
    <text x="72" y="252">예약 상태 유지</text>
    <text x="210" y="230" font-weight="700">미결제 종료</text>
    <text x="210" y="252">예약 해제</text>
    <text x="348" y="242" font-weight="700">결제 완료</text>
    <text x="109" y="355" font-weight="700">예약 보유</text>
    <text x="109" y="380">주문 확정 · 재고 할당</text>
